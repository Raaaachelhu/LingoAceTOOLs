day.","reason":"天气形容词前需要is。"}],"senses":[{"word":"cold","meanings":[{"meaning":"形容词·冷的","icon":"❄️","scene":"下雪时穿上外套","en":"It is cold today.","zh":"今天很冷。"},{"meaning":"名词·感冒","icon":"🤧","scene":"孩子感冒了","en":"I have a cold.","zh":"我感冒了。"}]},{"word":"warm","meanings":[{"meaning":"形容词·温暖的","icon":"☀️","scene":"温暖的春日","en":"It is warm in spring.","zh":"春天天气温暖。"},{"meaning":"动词·使变暖","icon":"🥣","scene":"热一热汤","en":"Please warm the soup.","zh":"请把汤热一热。"}]}]},{"id":"A_L3_U08","material":"LingoAce（自研）","level":"3","no":8,"title":"Unit 8 · At the Aquarium","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"presentcontrast","title":"一般现在时与现在进行时：习性和此刻的区别","rule":"平常吃什么、具有什么特征用一般现在时；此刻正在做什么用am/is/are + 动词-ing。","scene":"给水族馆导览配音","examples":[{"en":"What are the dolphins doing? They are playing.","zh":"海豚正在做什么？它们正在玩耍。"},{"en":"What do dolphins eat? Dolphins eat fish.","zh":"海豚吃什么？海豚吃鱼。"}],"task":"企鹅正在游泳，描述此刻的动作。","answer":"The penguins are swimming.","correct":"Dolphins eat fish. They are playing now.","incorrect":"Dolphins are eat fish.","reason":"习性用eat；此刻正在吃应说are eating，不能are eat。"},{"profile":"has","title":"have / has与Does ... have：说明特征","rule":"单数第三人称肯定句用has；其他主语常用have。Does问句及doesn't否定句后用have。","scene":"用外形辨认海洋动物","examples":[{"en":"A turtle has a shell.","zh":"海龟有龟壳。"},{"en":"Do penguins have feathers? Yes, they do.","zh":"企鹅有羽毛吗？是的。"}],"task":"说海豹有毛。","answer":"Seals have fur.","correct":"Does it have wings?","incorrect":"Does it has wings?","reason":"Does后恢复为have。"}],"senses":[{"word":"seal","meanings":[{"meaning":"名词·海豹","icon":"🦭","scene":"水中游动的海豹","en":"The seal is swimming.","zh":"海豹正在游泳。"},{"meaning":"动词·密封","icon":"📦","scene":"封好一个盒子","en":"Please seal the box.","zh":"请把盒子封好。"}]}]},{"id":"A_L4_U01","material":"LingoAce（自研）","level":"4","no":1,"title":"Unit 1 · Picnic in the Park","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"quantity","title":"量词结构：把不可数食物按份表达","rule":"a piece/bottle/bowl/glass of后接食物或饮料；份数增加时主要变化量词，如two bottles of juice。","scene":"在野餐时分发食物","examples":[{"en":"Can I have a piece of cheese?","zh":"我可以要一块奶酪吗？"},{"en":"I would like a bottle of juice and a bowl of pasta.","zh":"我想要一瓶果汁和一碗意大利面。"}],"task":"用a glass of要一杯柠檬水。","answer":"Can I have a glass of lemonade?","correct":"Two bottles of juice, please.","incorrect":"Two bottle of juices, please.","reason":"这里两瓶果汁说two bottles of juice；bottle变复数，juice按不可数处理。"},{"profile":"any","title":"some / any：检查有没有物品","rule":"any常见于疑问、否定句，后接可数复数或不可数名词；some常见于肯定句以及期待肯定回答的请求、提议。","scene":"检查野餐食物是否齐全","examples":[{"en":"Do you have any cheese? Yes, I do.","zh":"你有奶酪吗？是的。"},{"en":"I would like some juice, but I don't want any lemonade.","zh":"我想要一些果汁，但我不想要柠檬水。"}],"task":"询问朋友有没有蔬菜。","answer":"Do you have any vegetables?","correct":"We don't have any apples.","incorrect":"We don't have any apple.","reason":"询问或否定有无苹果时一般用可数复数apples。"}],"senses":[{"word":"piece","meanings":[{"meaning":"名词·一块、一片","icon":"🍰","scene":"盘里的一块蛋糕","en":"I want a piece of cake.","zh":"我想要一块蛋糕。"},{"meaning":"名词·作品","icon":"🎼","scene":"演奏一首乐曲","en":"This is a beautiful piece of music.","zh":"这是一首优美的乐曲。"}]},{"word":"glass","meanings":[{"meaning":"名词·玻璃，材料义","icon":"🪟","scene":"玻璃制成的窗户","en":"The window is made of glass.","zh":"这扇窗户是玻璃做的。"},{"meaning":"名词·玻璃杯，可数","icon":"🥛","scene":"桌上的两个杯子","en":"There are two glasses on the table.","zh":"桌子上有两个玻璃杯。"}]}]},{"id":"A_L4_U02","material":"LingoAce（自研）","level":"4","no":2,"title":"Unit 2 · A Birthday Party","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"date","title":"日期与on：把生日和活动时间说清楚","rule":"日期用序数词，如March third / March 3rd；具体某日之前用on；只有月份时常用in。","scene":"邀请朋友参加生日派对","examples":[{"en":"When is your birthday? It is on March third.","zh":"你的生日是什么时候？三月三日。"},{"en":"What should we bring? We should bring a present.","zh":"我们应该带什么？我们应该带一份礼物。"}],"task":"说你的派对在十一月四日。","answer":"My party is on November fourth.","correct":"My birthday is on March third.","incorrect":"My birthday is in March third.","reason":"具体日期前用on。"}],"senses":[{"word":"present","meanings":[{"meaning":"名词·礼物","icon":"🎁","scene":"生日礼物盒","en":"This is a birthday present.","zh":"这是一份生日礼物。"},{"meaning":"形容词·在场的","icon":"🙋","scene":"学生到齐了","en":"All the students are present today.","zh":"今天所有学生都在场。"},{"meaning":"名词·现在","icon":"🕐","scene":"比较过去与现在","en":"We are learning about the past and the present.","zh":"我们正在学习过去和现在。"}]}]},{"id":"A_L4_U03","material":"LingoAce（自研）","level":"4","no":3,"title":"Unit 3 · Helping Out","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"frequency","title":"频率副词：说明事情多久发生一次","rule":"always、usually、sometimes、never常放在主要行为动词前、be动词后；sometimes也可以放句首。","scene":"介绍家务分工的频率","examples":[{"en":"My sister always cooks dinner on Mondays.","zh":"我姐姐每周一总是做晚饭。"},{"en":"I usually wash the dishes, but I never feed the dog.","zh":"我通常洗碗，但从不喂狗。"}],"task":"用sometimes说Amanda有时遛狗。","answer":"Amanda sometimes takes the dog out.","correct":"She usually washes the dishes.","incorrect":"She washes usually the dishes.","reason":"此处usually放在行为动词washes前更自然。"},{"profile":"timeprep","title":"in / on / at：把活动放进时间或地点","rule":"常用in the morning/afternoon，at night/at seven，on Monday；地点搭配随场景选择，如in the park。","scene":"介绍家务时间","examples":[{"en":"We sweep the floor in the evening.","zh":"我们晚上扫地。"},{"en":"Amanda feeds the dog at ten o'clock.","zh":"阿曼达十点喂狗。"}],"task":"说你周一早上做早餐。","answer":"I cook breakfast on Monday morning.","correct":"I get up at seven.","incorrect":"I get up in seven o'clock.","reason":"具体钟点前用at。"}],"senses":[{"word":"cook","meanings":[{"meaning":"名词·厨师","icon":"👨‍🍳","scene":"厨房里的厨师","en":"My uncle is a cook.","zh":"我的叔叔是一名厨师。"},{"meaning":"动词·烹饪","icon":"🍳","scene":"一起准备晚餐","en":"We cook dinner together.","zh":"我们一起做晚饭。"}]},{"word":"feed","meanings":[{"meaning":"动词·喂养","icon":"🐶","scene":"给狗喂食","en":"I feed the dog every morning.","zh":"我每天早晨喂狗。"},{"meaning":"名词·饲料","icon":"🌾","scene":"农场的一袋饲料","en":"The farmer bought a bag of animal feed.","zh":"农民买了一袋动物饲料。"}]}]},{"id":"A_L4_U04","material":"LingoAce（自研）","level":"4","no":4,"title":"Unit 4 · Fantasy Creatures","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"compare-super","title":"比较级和最高级：两者比较与组内排名","rule":"A比较B用比较级+than；在一个群体中最突出用the+最高级。heavy→heavier/heaviest，beautiful→more/most beautiful。","scene":"比较真实动物与幻想生物","examples":[{"en":"Tigers have sharper teeth than rabbits.","zh":"老虎的牙齿比兔子的更锋利。"},{"en":"I think whales are the heaviest animals.","zh":"我认为鲸是最重的动物。"}],"task":"用more beautiful比较unicorns和dinosaurs。","answer":"Unicorns are more beautiful than dinosaurs.","correct":"Whales are the heaviest animals.","incorrect":"Whales are the most heaviest animals.","reason":"heaviest已经是最高级，不再加most。"}],"senses":[{"word":"scale","meanings":[{"meaning":"名词·鳞片","icon":"🐟","scene":"鱼身上的鳞片","en":"Fish have scales.","zh":"鱼有鳞片。"},{"meaning":"名词·比例尺","icon":"🗺️","scene":"根据地图计算距离","en":"Use the map scale to find the distance.","zh":"用地图比例尺计算距离。"}]},{"word":"fast","meanings":[{"meaning":"形容词·快的","icon":"🚄","scene":"高速行驶的列车","en":"This is a fast train.","zh":"这是一列快车。"},{"meaning":"副词·快速地","icon":"🏃","scene":"跑得很快的孩子","en":"She runs fast.","zh":"她跑得很快。"}]}]},{"id":"A_L4_U05","material":"LingoAce（自研）","level":"4","no":5,"title":"Unit 5 · Around My Town","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"purpose","title":"to + 动词原形：解释做一件事的目的","rule":"先说去哪里或做什么，再用to + 动词原形说明为了什么。问Why时也可以用To ...作简短回答。","scene":"规划放学后的购物路线","examples":[{"en":"I am going to the supermarket to buy vegetables.","zh":"我要去超市买蔬菜。"},{"en":"The coffee shop is across from the supermarket.","zh":"咖啡馆在超市对面。"}],"task":"用to说明你去医院是为了看医生。","answer":"I am going to the hospital to see a doctor.","correct":"I go to the library to read.","incorrect":"I go to the library to reading.","reason":"表示目的的不定式to后用动词原形。"}],"senses":[{"word":"near","meanings":[{"meaning":"介词·靠近","icon":"🏪","scene":"商店在学校附近","en":"The store is near the school.","zh":"商店在学校附近。"},{"meaning":"动词·接近","icon":"🚆","scene":"火车快到车站","en":"The train is nearing the station.","zh":"火车正接近车站。"}]}]},{"id":"A_L4_U06","material":"LingoAce（自研）","level":"4","no":6,"title":"Unit 6 · I Don't Feel Well","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"pastcause","title":"过去时与so：解释过去发生的因果","rule":"用过去式说发生了什么，so连接后续结果；had、went、gave是不规则过去式。","scene":"说明昨天为什么缺课","examples":[{"en":"I had a fever, so I missed school.","zh":"我发烧了，所以没去上学。"},{"en":"I went to the hospital, and the doctor gave me medicine.","zh":"我去了医院，医生给我开了药。"}],"task":"用so说你头疼，所以待在家里。","answer":"I had a headache, so I stayed home.","correct":"I had a fever, so I stayed home.","incorrect":"I have a fever yesterday, so I stay home.","reason":"回顾昨天的事情用had和stayed。"}],"senses":[{"word":"miss","meanings":[{"meaning":"动词·错过、没赶上","icon":"🚌","scene":"没有赶上公共汽车","en":"I missed the bus.","zh":"我没赶上公共汽车。"},{"meaning":"动词·想念","icon":"🏠","scene":"在旅行中想家","en":"I miss my family.","zh":"我想念家人。"}]}]},{"id":"A_L4_U07","material":"LingoAce（自研）","level":"4","no":7,"title":"Unit 7 · How Was Your Weekend?","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"pastcontrast","title":"过去时与but：讲事件并补充转折","rule":"先用过去式说发生的事，再用but说与预期不同的结果；没有受伤可用wasn't hurt。","scene":"分享周末发生的小插曲","examples":[{"en":"I fell down, but I was not hurt.","zh":"我摔倒了，但没有受伤。"},{"en":"My cousins came over, and we had a picnic.","zh":"我的堂表兄弟姐妹来做客，我们一起野餐。"}],"task":"用but说你看了电影，但电影不好看。","answer":"I saw a movie, but it was not good.","correct":"I fell down, but I wasn't hurt.","incorrect":"I falled down, but I wasn't hurt.","reason":"fall的过去式是fell，不是falled。"}],"senses":[{"word":"build","meanings":[{"meaning":"动词·建造","icon":"🏠","scene":"建造树屋","en":"We build a tree house.","zh":"我们建造一座树屋。"},{"meaning":"动词·逐步建立、增强","icon":"💪","scene":"通过练习增强信心","en":"Practice helps build confidence.","zh":"练习有助于增强信心。"}]},{"word":"fall","meanings":[{"meaning":"动词·落下、摔倒","icon":"🍂","scene":"树叶从树上落下","en":"Leaves fall from the trees.","zh":"树叶从树上落下。"},{"meaning":"名词·秋天，美式用法","icon":"🍁","scene":"秋天的公园","en":"The leaves turn yellow in the fall.","zh":"秋天树叶变黄。"}]}]},{"id":"A_L4_U08","material":"LingoAce（自研）","level":"4","no":8,"title":"Unit 8 · My Summer Vacation","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"past","title":"一般过去时：回顾已经发生的事情","rule":"肯定句用过去式；问句Did + 主语 + 动词原形；否定didn't + 动词原形。go→went，buy→bought。","scene":"采访朋友的假期","examples":[{"en":"Where did you go on vacation? I went to Italy.","zh":"你假期去了哪里？我去了意大利。"},{"en":"We visited a museum, but we didn't go shopping.","zh":"我们参观了博物馆，但没有购物。"}],"task":"询问朋友假期做了什么。","answer":"What did you do on vacation?","correct":"Did you go to the park?","incorrect":"Did you went to the park?","reason":"Did之后用go，不再使用过去式went。"}],"senses":[]},{"id":"A_L5_U01","material":"LingoAce（自研）","level":"5","no":1,"title":"Unit 1 · Museum Trip","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"purpose","title":"to + 动词原形：解释做一件事的目的","rule":"先说去哪里或做什么，再用to + 动词原形说明为了什么。问Why时也可以用To ...作简短回答。","scene":"讲解博物馆里的骑士装备","examples":[{"en":"The knight carries a shield to protect himself.","zh":"骑士带着盾牌来保护自己。"},{"en":"Knights wore helmets to protect their heads.","zh":"骑士们戴头盔保护头部。"}],"task":"用to说明骑士拿剑是为了战斗。","answer":"The knight carries a sword to fight.","correct":"I go to the library to read.","incorrect":"I go to the library to reading.","reason":"表示目的的不定式to后用动词原形。"}],"senses":[{"word":"crown","meanings":[{"meaning":"名词·王冠","icon":"👑","scene":"国王戴着王冠","en":"The king wears a crown.","zh":"国王戴着王冠。"},{"meaning":"名词·树冠","icon":"🌳","scene":"鸟在树冠中筑巢","en":"Birds nest in the crown of the tree.","zh":"鸟在树冠中筑巢。"}]}]},{"id":"A_L5_U02","material":"LingoAce（自研）","level":"5","no":2,"title":"Unit 2 · The Great Outdoors","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"direction","title":"方向介词与指令：把路线说清楚","rule":"across表示从一侧到另一侧，through表示从内部穿过，past表示经过；配合walk、go、turn组织路线。","scene":"根据地图设计户外路线","examples":[{"en":"We can take a path through the forest.","zh":"我们可以沿着一条小路穿过森林。"},{"en":"We crossed the bridge to get to the village.","zh":"我们过桥去了村庄。"}],"task":"用through说你们穿过田野到达湖边。","answer":"We walked through the field to get to the lake.","correct":"Walk across the bridge.","incorrect":"Walk cross the bridge.","reason":"walk后用介词across；cross本身是动词，可以直接说Cross the bridge。"}],"senses":[{"word":"field","meanings":[{"meaning":"名词·田地","icon":"🌾","scene":"田地里的拖拉机","en":"A tractor is in the field.","zh":"一辆拖拉机在田地里。"},{"meaning":"名词·领域","icon":"🔬","scene":"科学研究的不同领域","en":"She works in the field of science.","zh":"她从事科学领域的工作。"}]}]},{"id":"A_L5_U03","material":"LingoAce（自研）","level":"5","no":3,"title":"Unit 3 · What Happened?","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"pastcontinuous","title":"过去进行时与when：描述背景和突然发生的事","rule":"was/were + doing描述过去当时正在进行的动作；when后常用一般过去时引出发生的事件。","scene":"向救援人员描述事故经过","examples":[{"en":"The man was helping a cat when he fell out of the tree.","zh":"那个人从树上掉下来时正在帮助一只猫。"},{"en":"I was walking home when I saw the accident.","zh":"我走路回家时看到了那场事故。"}],"task":"用was doing ... when说你正在睡觉时听到了响声。","answer":"I was sleeping when I heard a noise.","correct":"I was walking when I saw the accident.","incorrect":"I was walk when I saw the accident.","reason":"was后用walking构成过去进行时。"},{"profile":"pastcause","title":"过去时与so：解释过去发生的因果","rule":"用过去式说发生了什么，so连接后续结果；had、went、gave是不规则过去式。","scene":"说明目击事故后的行动","examples":[{"en":"I saw an accident, so I called the emergency number.","zh":"我看到了事故，所以拨打了急救电话。"},{"en":"The firefighters came and helped the man.","zh":"消防员赶来帮助了那个人。"}],"task":"用so说你听到求救声，于是叫了救护车。","answer":"I heard a call for help, so I called an ambulance.","correct":"I had a fever, so I stayed home.","incorrect":"I have a fever yesterday, so I stay home.","reason":"回顾昨天的事情用had和stayed。"}],"senses":[{"word":"fall","meanings":[{"meaning":"动词·落下、摔倒","icon":"🍂","scene":"树叶从树上落下","en":"Leaves fall from the trees.","zh":"树叶从树上落下。"},{"meaning":"名词·秋天，美式用法","icon":"🍁","scene":"秋天的公园","en":"The leaves turn yellow in the fall.","zh":"秋天树叶变黄。"}]}]},{"id":"A_L5_U04","material":"LingoAce（自研）","level":"5","no":4,"title":"Unit 4 · Concert Time","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"posspronoun","title":"物主代词：不用重复物品名称","rule":"my/your/his/her/our/their后要接名词；mine/yours/his/hers/ours/theirs可独立使用，不再接名词。","scene":"音乐会后寻找乐器主人","examples":[{"en":"Whose guitar is this? It is hers.","zh":"这是谁的吉他？是她的。"},{"en":"This is my violin. That violin is his.","zh":"这是我的小提琴。那把小提琴是他的。"}],"task":"把It is our piano换成独立的物主代词表达。","answer":"The piano is ours.","correct":"This guitar is hers.","incorrect":"This guitar is her.","reason":"名词已经作主语出现，表所属用独立形式hers。"}],"senses":[{"word":"stage","meanings":[{"meaning":"名词·舞台","icon":"🎭","scene":"演员站在舞台上","en":"The actor is on the stage.","zh":"演员在舞台上。"},{"meaning":"名词·阶段","icon":"🦋","scene":"观察蝴蝶成长","en":"A caterpillar is one stage in a butterfly's life.","zh":"毛毛虫是蝴蝶生命中的一个阶段。"}]}]},{"id":"A_L5_U05","material":"LingoAce（自研）","level":"5","no":5,"title":"Unit 5 · A Dream Vacation","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"perfect","title":"现在完成时：询问经历或截至现在的完成情况","rule":"have/has + 过去分词；ever询问经历，yet常用于疑问和否定句。不要把明确结束的过去时间直接与现在完成时搭配。","scene":"核对旅行准备是否已经完成","examples":[{"en":"Have you booked your hotel yet? Yes, I have.","zh":"你已经订好酒店了吗？是的。"},{"en":"I have bought the tickets, but I haven't packed yet.","zh":"我已经买好票了，但还没收拾行李。"}],"task":"询问朋友是否曾去过另一个国家。","answer":"Have you ever traveled to another country?","correct":"Have you bought the tickets yet?","incorrect":"Have you buy the tickets yet?","reason":"完成时需要过去分词bought。"}],"senses":[{"word":"spring","meanings":[{"meaning":"名词·春天","icon":"🌸","scene":"春天花开","en":"Flowers grow in spring.","zh":"花儿在春天生长。"},{"meaning":"名词·弹簧","icon":"🌀","scene":"玩具里的弹簧","en":"This toy has a spring inside.","zh":"这个玩具里面有一个弹簧。"},{"meaning":"名词·泉水、泉","icon":"💧","scene":"山间涌出的泉水","en":"Water comes from a mountain spring.","zh":"水来自山泉。"}]},{"word":"book","meanings":[{"meaning":"名词·书","icon":"📖","scene":"桌上放着一本书","en":"This is my English book.","zh":"这是我的英语书。"},{"meaning":"动词·预订","icon":"🎫","scene":"出行前订车票","en":"We need to book our tickets.","zh":"我们需要预订车票。"}]}]},{"id":"A_L5_U06","material":"LingoAce（自研）","level":"5","no":6,"title":"Unit 6 · Outer Space","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"future","title":"be going to与will：表达计划及将来想法","rule":"be going to常表达已有计划或迹象，will常表达预测、临时决定、承诺等；两者有重叠，需结合语境，后面都接原形。","scene":"讲述自己的太空梦想与计划","examples":[{"en":"I am going to look for planets tonight.","zh":"今晚我打算寻找行星。"},{"en":"One day, I will travel to space in a spaceship.","zh":"有一天，我会乘坐飞船去太空。"}],"task":"用going to说她打算成为宇航员。","answer":"She is going to be an astronaut.","correct":"I will travel to space one day.","incorrect":"I will to travel to space one day.","reason":"will后直接用动词原形travel。"}],"senses":[{"word":"space","meanings":[{"meaning":"名词·太空","icon":"🚀","scene":"宇航员进入太空","en":"The astronaut travels into space.","zh":"宇航员前往太空。"},{"meaning":"名词·空间","icon":"📦","scene":"桌上没有空间","en":"There is no space on the desk.","zh":"桌上没有空间了。"}]}]},{"id":"A_L5_U07","material":"LingoAce（自研）","level":"5","no":7,"title":"Unit 7 · Eating Out","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"politerequest","title":"Could you与would like：礼貌请求和点餐","rule":"Could you please + 动词原形用于请求；I would like + 名词用于点餐或表达想要；I'd是I would缩写。","scene":"在餐厅礼貌提出需求","examples":[{"en":"Could you please bring me a clean fork?","zh":"请给我拿一把干净的叉子，好吗？"},{"en":"What would you like for dessert? I'd like some ice cream.","zh":"你想要什么甜点？我想要一些冰激凌。"}],"task":"礼貌请求服务员多拿一些餐巾。","answer":"Could you please bring us more napkins?","correct":"Could you bring me a fork?","incorrect":"Could you to bring me a fork?","reason":"Could you后直接接bring。"}],"senses":[{"word":"starter","meanings":[{"meaning":"名词·开胃菜","icon":"🥗","scene":"餐厅先上沙拉","en":"I'd like a salad as a starter.","zh":"我想要沙拉作为开胃菜。"},{"meaning":"名词·启动器","icon":"🚗","scene":"修理汽车的启动器","en":"The car needs a new starter.","zh":"这辆汽车需要一个新的启动器。"}]}]},{"id":"A_L5_U08","material":"LingoAce（自研）","level":"5","no":8,"title":"Unit 8 · Life in the Amazon","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"measure","title":"How + 形容词与数量单位：解释测量结果","rule":"How long询问长度，How large询问范围大小，How fast询问速度；数值后接对应单位，多个可数单位用复数。","scene":"介绍雨林的范围和物种","examples":[{"en":"How long is the river? It is thousands of kilometers long.","zh":"这条河有多长？有数千千米长。"},{"en":"How many types of birds are there? There are many types.","zh":"有多少种鸟？有许多种。"}],"task":"用How large询问雨林的面积。","answer":"How large is the rainforest?","correct":"The average speed is five meters per second.","incorrect":"The average speed is five meter per seconds.","reason":"five meters用复数；per second中的second按一个单位用单数。"}],"senses":[{"word":"plant","meanings":[{"meaning":"名词·植物","icon":"🌱","scene":"窗台上的植物","en":"This plant needs light.","zh":"这株植物需要光。"},{"meaning":"动词·种植","icon":"🌳","scene":"大家一起种树","en":"We plant trees in spring.","zh":"我们春天种树。"},{"meaning":"名词·工厂","icon":"🏭","scene":"发电厂","en":"The power plant produces electricity.","zh":"这座发电厂生产电力。"}]}]},{"id":"A_L6_U01","material":"LingoAce（自研）","level":"6","no":1,"title":"Unit 1 · My Future Self (未来的自己)","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"verbforms","title":"动名词与不定式：让动词搭配自然","rule":"enjoy + doing；plan/want/need + to do。like/love等可接doing或to do，意思与语境有关，不能把所有动词一律归类。","scene":"把职业愿望变成行动计划","examples":[{"en":"I enjoy making models, so I want to be an engineer.","zh":"我喜欢做模型，所以想成为工程师。"},{"en":"I plan to gain experience by joining a science club.","zh":"我计划通过参加科学俱乐部积累经验。"}],"task":"用enjoy和plan说你喜欢做饭，计划学习新食谱。","answer":"I enjoy cooking, and I plan to learn new recipes.","correct":"I enjoy cooking and plan to learn more.","incorrect":"I enjoy to cook and plan learning more.","reason":"这里用enjoy cooking与plan to learn。"},{"profile":"purpose","title":"to + 动词原形：解释做一件事的目的","rule":"先说去哪里或做什么，再用to + 动词原形说明为了什么。问Why时也可以用To ...作简短回答。","scene":"解释职业准备的目的","examples":[{"en":"I take drama classes to become an actor.","zh":"我上戏剧课是为了成为演员。"},{"en":"I learn new recipes to become a better chef.","zh":"我学习新食谱是为了成为更好的厨师。"}],"task":"用to说明你做模型是为了获得经验。","answer":"I make models to gain experience.","correct":"I go to the library to read.","incorrect":"I go to the library to reading.","reason":"表示目的的不定式to后用动词原形。"}],"senses":[{"word":"take","meanings":[{"meaning":"动词·拿走、带走","icon":"🎒","scene":"出门时带伞","en":"Take your umbrella with you.","zh":"带上你的雨伞。"},{"meaning":"动词·花费时间","icon":"🕐","scene":"钟表显示路程用时","en":"The trip takes two hours.","zh":"这段旅程需要两小时。"},{"meaning":"搭配·乘坐","icon":"🚌","scene":"孩子坐公交上学","en":"I take the bus to school.","zh":"我乘公共汽车上学。"}]}]},{"id":"A_L6_U02","material":"LingoAce（自研）","level":"6","no":2,"title":"Unit 2 · The Science Class (科学实验课)","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"past","title":"一般过去时：回顾已经发生的事情","rule":"肯定句用过去式；问句Did + 主语 + 动词原形；否定didn't + 动词原形。go→went，buy→bought。","scene":"回顾科学实验的步骤","examples":[{"en":"We measured the liquid before we heated it.","zh":"我们加热液体之前先测量了它。"},{"en":"Did you cool the liquid first? No, we didn't.","zh":"你们先冷却液体了吗？不，没有。"}],"task":"询问朋友做了什么实验。","answer":"What experiment did you do?","correct":"Did you go to the park?","incorrect":"Did you went to the park?","reason":"Did之后用go，不再使用过去式went。"}],"senses":[{"word":"cool","meanings":[{"meaning":"形容词·凉爽的","icon":"🍃","scene":"凉爽的秋日","en":"It is cool today.","zh":"今天很凉爽。"},{"meaning":"动词·使冷却","icon":"🧪","scene":"实验液体降温","en":"Let the liquid cool.","zh":"让液体冷却。"},{"meaning":"非正式形容词·很棒的、酷的","icon":"😎","scene":"欣赏朋友的创意","en":"That is a cool idea!","zh":"那个主意真棒！"}]}]},{"id":"A_L6_U03","material":"LingoAce（自研）","level":"6","no":3,"title":"Unit 3 · Sports (运动)","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"passive","title":"一般现在时被动语态：突出赛事和活动本身","rule":"am/is/are + 过去分词；重点是动作承受者。需要说明执行者时可加by ...。主语单复数决定be形式。","scene":"介绍学校体育赛事","examples":[{"en":"The race is held every year.","zh":"这场比赛每年举行。"},{"en":"The prizes are given to the winners after the race.","zh":"比赛后，奖品会发给获胜者。"}],"task":"把The coach plans the race改为The race开头的被动句。","answer":"The race is planned by the coach.","correct":"The race is planned by the coach.","incorrect":"The race is plan by the coach.","reason":"被动结构用过去分词planned。"},{"profile":"possibility","title":"could / might / shall：提出可能性与建议","rule":"could/might + 动词原形可表示可能；Shall we + 动词原形用于建议共同做某事。结合语境区别could表示过去能力的用法。","scene":"体育解说中的可能性与提议","examples":[{"en":"This could be the most important point of the game.","zh":"这可能是比赛最重要的一分。"},{"en":"Shall we watch that goal again?","zh":"我们再看一次那个进球，好吗？"}],"task":"用might说他可能赢得比赛。","answer":"He might win the race.","correct":"He might win the race.","incorrect":"He might wins the race.","reason":"might后使用win原形。"}],"senses":[{"word":"race","meanings":[{"meaning":"名词·竞赛","icon":"🏃","scene":"学校跑步比赛","en":"The race starts at nine.","zh":"比赛九点开始。"},{"meaning":"动词·快速移动、竞速","icon":"🚴","scene":"孩子们骑车冲向终点","en":"They raced toward the finish line.","zh":"他们飞速冲向终点线。"}]},{"word":"point","meanings":[{"meaning":"名词·分数、得分","icon":"🏅","scene":"比赛中获得一分","en":"Our team won a point.","zh":"我们队得了一分。"},{"meaning":"动词·指向","icon":"👉","scene":"指向地图上的地方","en":"Point to the lake on the map.","zh":"指出地图上的湖。"},{"meaning":"名词·要点、观点","icon":"💬","scene":"讨论一个重要观点","en":"That is an important point.","zh":"那是一个重要的观点。"}]}]},{"id":"A_L6_U04","material":"LingoAce（自研）","level":"6","no":4,"title":"Unit 4 · Getting Around (出行)","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"should","title":"should / shouldn't：给出建议","rule":"should和shouldn't后都接动词原形；表达建议，通常不等同于必须遵守的强制命令。","scene":"为出行提供建议","examples":[{"en":"You should bring a guidebook.","zh":"你应该带一本旅行指南。"},{"en":"You shouldn't carry too much luggage.","zh":"你不应该带太多行李。"}],"task":"建议朋友随身带好护照。","answer":"You should bring your passport.","correct":"You should bring your passport.","incorrect":"You should to bring your passport.","reason":"should后用原形bring，不加to。"},{"profile":"politerequest","title":"Could you与would like：礼貌请求和点餐","rule":"Could you please + 动词原形用于请求；I would like + 名词用于点餐或表达想要；I'd是I would缩写。","scene":"旅行途中礼貌请求","examples":[{"en":"Could I try on that T-shirt?","zh":"我可以试穿那件T恤吗？"},{"en":"Do you mind if I close the door? Not at all.","zh":"你介意我关门吗？完全不介意。"}],"task":"礼貌请求试戴那副耳环。","answer":"Could I try on those earrings?","correct":"Could you bring me a fork?","incorrect":"Could you to bring me a fork?","reason":"Could you后直接接bring。"}],"senses":[{"word":"pack","meanings":[{"meaning":"动词·打包、收拾","icon":"🧳","scene":"出发前收行李","en":"I need to pack my bag.","zh":"我需要收拾行李。"},{"meaning":"名词·一包","icon":"🧃","scene":"一包果汁","en":"We bought a pack of juice boxes.","zh":"我们买了一包盒装果汁。"}]}]},{"id":"A_L6_U05","material":"LingoAce（自研）","level":"6","no":5,"title":"Unit 5 · The Story Teller (故事讲述者)","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"perfectjust","title":"现在完成时与just：汇报刚刚完成的事","rule":"have/has + just + 过去分词，说明刚完成且与现在有关。just通常位于have/has之后、过去分词之前。","scene":"汇报校园剧的最新进展","examples":[{"en":"We have just finished practising for the play.","zh":"我们刚刚完成这部剧的排练。"},{"en":"The curtain has just opened, and the show has begun.","zh":"幕布刚刚拉开，演出已经开始了。"}],"task":"用just说演员们刚刚穿好戏服。","answer":"The actors have just put on their costumes.","correct":"The show has just begun.","incorrect":"The show has just began.","reason":"begin的过去分词为begun，began是一般过去式。"},{"profile":"verbforms","title":"动名词与不定式：让动词搭配自然","rule":"enjoy + doing；plan/want/need + to do。like/love等可接doing或to do，意思与语境有关，不能把所有动词一律归类。","scene":"讲述人物决定与行动","examples":[{"en":"They decide to leave the town.","zh":"他们决定离开小镇。"},{"en":"She avoids making the same mistake.","zh":"她避免犯同样的错误。"}],"task":"用refuse说他拒绝离开。","answer":"He refuses to leave.","correct":"I enjoy cooking and plan to learn more.","incorrect":"I enjoy to cook and plan learning more.","reason":"这里用enjoy cooking与plan to learn。"}],"senses":[{"word":"play","meanings":[{"meaning":"动词·玩耍","icon":"🧸","scene":"孩子和玩具一起玩","en":"The children play with their toys.","zh":"孩子们玩玩具。"},{"meaning":"搭配·演奏乐器","icon":"🎹","scene":"孩子弹钢琴","en":"She plays the piano.","zh":"她弹钢琴。"},{"meaning":"名词·戏剧","icon":"🎭","scene":"观众看舞台剧","en":"We watched a school play.","zh":"我们看了一出校园剧。"}]}]},{"id":"A_L6_U06","material":"LingoAce（自研）","level":"6","no":6,"title":"Unit 6 · Museum of the Future (未来博物馆)","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"zeroif","title":"零条件句：解释装置和规律怎样工作","rule":"If + 一般现在时，一般现在时，用于一般规律或可重复的结果。If从句在前时通常加逗号。","scene":"讲解博物馆互动装置","examples":[{"en":"If you press the button, the machine starts.","zh":"如果按下按钮，机器就会启动。"},{"en":"If you shut down the computer, the screen goes dark.","zh":"如果关闭电脑，屏幕就会变暗。"}],"task":"用If说打开开关时，灯会亮。","answer":"If you turn on the switch, the light comes on.","correct":"If you press the button, the machine starts.","incorrect":"If you will press the button, the machine starts.","reason":"本句解释一般工作规律，if从句直接用press。"},{"profile":"material","title":"be made of：说明材料；to do：说明用途","rule":"be made of + 材料，常用于仍能辨认出原材料的物品；to + 动词原形可表示做某事的目的。","scene":"为旧物制作博物馆标签","examples":[{"en":"The saddle is made of leather.","zh":"这个马鞍是皮革制成的。"},{"en":"It is used for riding horses.","zh":"它用于骑马。"}],"task":"说这辆马车是木制的。","answer":"The wagon is made of wood.","correct":"The mask is made of paper.","incorrect":"The mask made of paper.","reason":"完整陈述句需要is；made of在这里不能独立作完整谓语。"}],"senses":[{"word":"switch","meanings":[{"meaning":"名词·开关","icon":"💡","scene":"墙上的电灯开关","en":"Press the switch to turn on the light.","zh":"按开关打开灯。"},{"meaning":"动词·转换、切换","icon":"🔄","scene":"切换为另一种能源","en":"We can switch to solar energy.","zh":"我们可以转而使用太阳能。"}]}]},{"id":"A_L6_U07","material":"LingoAce（自研）","level":"6","no":7,"title":"Unit 7 · Fantastic Flavors (奇妙的口味)","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"tooenough","title":"too / enough：表达过度与是否足够","rule":"too + 形容词 + to do表示太……而不能；形容词 + enough + to do表示足够……可以；not ... enough表示不够。","scene":"点餐时解释口味需求","examples":[{"en":"The curry is too spicy for me to eat.","zh":"这份咖喱太辣，我吃不了。"},{"en":"The tea isn't sweet enough for me.","zh":"这杯茶对我来说不够甜。"}],"task":"用too ... to说汤太烫，不能喝。","answer":"The soup is too hot to drink.","correct":"The soup is too hot to drink.","incorrect":"The soup is hot too to drink.","reason":"too放在形容词hot前；enough则放在形容词后。"},{"profile":"prefer","title":"prefer / would rather与反身代词：表达偏好和自己完成","rule":"prefer A to B表示更喜欢A；would rather + 动词原形；by herself强调独自完成，herself可强调亲自完成。","scene":"点餐时表达更喜欢的选项","examples":[{"en":"Do you prefer home-cooked food or fast food?","zh":"你更喜欢家常饭还是快餐？"},{"en":"I'd rather have spinach. She made it herself.","zh":"我宁愿吃菠菜。她亲自做的。"}],"task":"用prefer ... to说你更喜欢家常饭而非快餐。","answer":"I prefer home-cooked food to fast food.","correct":"I'd rather have spinach.","incorrect":"I'd rather to have spinach.","reason":"would rather后用have原形，不加to。"}],"senses":[{"word":"fast","meanings":[{"meaning":"形容词·快的","icon":"🚄","scene":"高速行驶的列车","en":"This is a fast train.","zh":"这是一列快车。"},{"meaning":"副词·快速地","icon":"🏃","scene":"跑得很快的孩子","en":"She runs fast.","zh":"她跑得很快。"}]}]},{"id":"A_L6_U08","material":"LingoAce（自研）","level":"6","no":8,"title":"Unit 8 · Big Wide World (大千世界)","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"sosuch","title":"so ... that / such ... that：突出程度与结果","rule":"so + 形容词/副词 + that；such + 名词短语 + that。单数可数名词通常用such a/an + 形容词 + 名词。","scene":"推荐一个风景优美的旅行地点","examples":[{"en":"The valley is so peaceful that we want to stay.","zh":"这片山谷如此宁静，让我们想留下来。"},{"en":"It is such a beautiful place that we take many photos.","zh":"这是一个如此美丽的地方，我们拍了许多照片。"}],"task":"用so ... that说景色很美，所以你想再去。","answer":"The scenery is so beautiful that I want to go back.","correct":"It is such a peaceful valley that we stay.","incorrect":"It is so a peaceful valley that we stay.","reason":"后接a peaceful valley这个名词短语，用such。"},{"profile":"compare-super","title":"比较级和最高级：两者比较与组内排名","rule":"A比较B用比较级+than；在一个群体中最突出用the+最高级。heavy→heavier/heaviest，beautiful→more/most beautiful。","scene":"在旅行介绍中比较地点","examples":[{"en":"This valley is quieter than the harbor.","zh":"这片山谷比港口更安静。"},{"en":"It is the most peaceful place on our trip.","zh":"它是我们这次旅行中最宁静的地方。"}],"task":"用largest说这是该国最大的港口。","answer":"This is the largest harbor in the country.","correct":"Whales are the heaviest animals.","incorrect":"Whales are the most heaviest animals.","reason":"heaviest已经是最高级，不再加most。"}],"senses":[{"word":"port","meanings":[{"meaning":"名词·港口","icon":"🚢","scene":"货船停靠的港口","en":"The ship arrived at the port.","zh":"这艘船抵达港口。"},{"meaning":"名词·设备接口","icon":"💻","scene":"把线插入电脑接口","en":"Plug the cable into the USB port.","zh":"把连接线插入USB接口。"}]}]},{"id":"A_L7_U01","material":"LingoAce（自研）","level":"7","no":1,"title":"Unit 1 · What's New at School?","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"relative","title":"关系从句：用额外信息说明是哪一个人或物","rule":"who常指人，which/that常指物；where说明地点。从句修饰前面的名词，已经由关系词承担的成分不要重复。","scene":"介绍学校的新设施与工作人员","examples":[{"en":"This is the person who serves meals in the cafeteria.","zh":"这就是在食堂为大家供餐的人。"},{"en":"The bike rack that stands near the gate is new.","zh":"立在大门附近的自行车架是新的。"}],"task":"用that合并This is the bin和We use it for recycling。","answer":"This is the bin that we use for recycling.","correct":"This is the book that I bought.","incorrect":"This is the book that I bought it.","reason":"that已经代表book作bought的宾语，后面不再加it。"},{"profile":"perfect","title":"现在完成时：询问经历或截至现在的完成情况","rule":"have/has + 过去分词；ever询问经历，yet常用于疑问和否定句。不要把明确结束的过去时间直接与现在完成时搭配。","scene":"确认是否体验过新设施","examples":[{"en":"Have you seen the new gym yet? No, I haven't.","zh":"你已经看过新体育馆了吗？还没有。"},{"en":"I have already used the new bike rack.","zh":"我已经用过新自行车架了。"}],"task":"用yet问朋友是否已经在新球场打过球。","answer":"Have you played on the new court yet?","correct":"Have you bought the tickets yet?","incorrect":"Have you buy the tickets yet?","reason":"完成时需要过去分词bought。"}],"senses":[{"word":"net","meanings":[{"meaning":"名词·网","icon":"🥅","scene":"球门后的球网","en":"The ball hit the net.","zh":"球碰到了网。"},{"meaning":"形容词·净的","icon":"💰","scene":"扣除成本后的利润","en":"The net profit is small.","zh":"净利润很少。"}]}]},{"id":"A_L7_U02","material":"LingoAce（自研）","level":"7","no":2,"title":"Unit 2 · Sea Adventure","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"indirect","title":"间接疑问句：礼貌提问时使用陈述语序","rule":"Do you know / Can you tell me后面的嵌入问句使用主语+谓语语序，不再把be或助动词倒装。","scene":"在船上礼貌询问位置","examples":[{"en":"Do you know where the cabins are?","zh":"你知道船舱在哪里吗？"},{"en":"Can you tell me where the captain is?","zh":"你能告诉我船长在哪里吗？"}],"task":"把Where is the lifeboat?改成Do you know开头。","answer":"Do you know where the lifeboat is?","correct":"Do you know where the captain is?","incorrect":"Do you know where is the captain?","reason":"嵌入问句里使用the captain is。"}],"senses":[{"word":"deck","meanings":[{"meaning":"名词·甲板","icon":"🚢","scene":"站在船的甲板上","en":"The captain is on the deck.","zh":"船长在甲板上。"},{"meaning":"名词·一副牌","icon":"🃏","scene":"拿出一副纸牌","en":"We have a deck of cards.","zh":"我们有一副纸牌。"}]}]},{"id":"A_L7_U03","material":"LingoAce（自研）","level":"7","no":3,"title":"Unit 3 · A Pirate Tale","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"future","title":"be going to与will：表达计划及将来想法","rule":"be going to常表达已有计划或迹象，will常表达预测、临时决定、承诺等；两者有重叠，需结合语境，后面都接原形。","scene":"给冒险故事安排下一幕","examples":[{"en":"We are sailing to the island today.","zh":"我们今天要航行去那座岛。"},{"en":"In two days, we will relax on the beach.","zh":"两天后，我们会在海滩上休息。"}],"task":"用will说你们下周会找到宝藏。","answer":"We will find the treasure next week.","correct":"I will travel to space one day.","incorrect":"I will to travel to space one day.","reason":"will后直接用动词原形travel。"}],"senses":[{"word":"coin","meanings":[{"meaning":"名词·硬币","icon":"🪙","scene":"发现一枚古钱币","en":"We found an old coin.","zh":"我们发现了一枚旧硬币。"},{"meaning":"动词·创造新词","icon":"✍️","scene":"为新发明创造名称","en":"The writer coined a new word.","zh":"这位作家创造了一个新词。"}]}]},{"id":"A_L7_U04","material":"LingoAce（自研）","level":"7","no":4,"title":"Unit 4 · Adapting for the Future","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"bydoing","title":"by + doing：解释通过什么方式实现目标","rule":"by是介词，后面的动作用-ing；可配合can、should说明行动方式，再用so that说明目的。","scene":"为环保行动解释做法","examples":[{"en":"We can reduce pollution by using public transportation.","zh":"我们可以通过乘坐公共交通减少污染。"},{"en":"We should use solar energy so that we use less fuel.","zh":"我们应该利用太阳能，以减少燃料使用。"}],"task":"用by doing说通过骑车去学校来帮助环境。","answer":"I can help the environment by riding a bike to school.","correct":"We save energy by using less fuel.","incorrect":"We save energy by use less fuel.","reason":"by后接动名词using。"},{"profile":"should","title":"should / shouldn't：给出建议","rule":"should和shouldn't后都接动词原形；表达建议，通常不等同于必须遵守的强制命令。","scene":"为低污染生活提出建议","examples":[{"en":"We should use less fuel.","zh":"我们应该少用燃料。"},{"en":"We should use solar energy when possible.","zh":"条件允许时，我们应该使用太阳能。"}],"task":"建议人们乘坐公共交通。","answer":"People should use public transportation.","correct":"You should bring your passport.","incorrect":"You should to bring your passport.","reason":"should后用原形bring，不加to。"}],"senses":[{"word":"fuel","meanings":[{"meaning":"名词·燃料","icon":"⛽","scene":"汽车需要燃料","en":"The car needs fuel.","zh":"汽车需要燃料。"},{"meaning":"动词·助长、推动","icon":"💡","scene":"好奇心推动学习","en":"Curiosity fuels learning.","zh":"好奇心推动学习。"}]}]},{"id":"A_L7_U05","material":"LingoAce（自研）","level":"7","no":5,"title":"Unit 5 · Egypt","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"pastpurpose","title":"used ... to do：解释过去物品的用途","rule":"used是use的过去式，use A to do B表示用A做B；注意与used to do表示过去习惯的结构不同。","scene":"讲解古埃及建筑与历史","examples":[{"en":"The Egyptians used cloth to wrap the mummies.","zh":"古埃及人用布包裹木乃伊。"},{"en":"It was difficult to move the heavy blocks.","zh":"移动沉重的石块很困难。"}],"task":"用used ... to说古埃及人用石块建造金字塔。","answer":"The Egyptians used stone blocks to build the pyramids.","correct":"They used cloth to wrap the mummies.","incorrect":"They used cloth to wrapping the mummies.","reason":"目的不定式to后用wrap；used cloth to含有具体工具cloth。"}],"senses":[{"word":"ruler","meanings":[{"meaning":"名词·统治者","icon":"👑","scene":"介绍古代统治者","en":"The pharaoh was a ruler of Egypt.","zh":"法老是埃及的统治者。"},{"meaning":"名词·尺子","icon":"📏","scene":"用尺子测长度","en":"Use a ruler to measure the line.","zh":"用尺子测量这条线。"}]}]},{"id":"A_L7_U06","material":"LingoAce（自研）","level":"7","no":6,"title":"Unit 6 · Ready for Launch","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"gerundsubject","title":"动名词作主语：把活动本身作为讨论对象","rule":"动词-ing短语可作主语；讨论一项活动时通常按单数处理，后接is、takes等。","scene":"向宇航员学员介绍训练","examples":[{"en":"Floating in the air is fun.","zh":"在空中漂浮很有趣。"},{"en":"Landing on the moon takes careful planning.","zh":"登陆月球需要周密计划。"}],"task":"用Collecting开头，说采集岩石很有挑战性。","answer":"Collecting rocks is challenging.","correct":"Floating in the air is fun.","incorrect":"Floating in the air are fun.","reason":"此处Floating in the air指一项活动，谓语用is。"},{"profile":"must","title":"must / mustn't：说明必须做与禁止做的事","rule":"must + 动词原形表示必须；mustn't + 动词原形表示禁止。mustn't不是不必，不必通常用don't have to。","scene":"说明发射前的必要要求","examples":[{"en":"The astronauts must listen carefully before launch.","zh":"宇航员在发射前必须认真倾听。"},{"en":"They must check the control panel.","zh":"他们必须检查控制面板。"}],"task":"提醒宇航员必须穿宇航服。","answer":"The astronauts must wear spacesuits.","correct":"You must wear a helmet.","incorrect":"You must to wear a helmet.","reason":"must后直接接动词原形，不加to。"}],"senses":[{"word":"land","meanings":[{"meaning":"名词·陆地","icon":"🏝️","scene":"远处看见陆地","en":"We can see land from the ship.","zh":"我们从船上能看见陆地。"},{"meaning":"动词·着陆","icon":"🚀","scene":"飞船登陆月球","en":"The spacecraft will land on the moon.","zh":"飞船将登陆月球。"}]}]},{"id":"A_L7_U07","material":"LingoAce（自研）","level":"7","no":7,"title":"Unit 7 · Visiting the Arctic","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"usedto","title":"used to：对比过去的习惯或状态与现在","rule":"used to + 动词原形表示过去常常或过去曾经；否定常用didn't use to；区别be used to + 名词/doing表示习惯于。","scene":"比较北极过去与现在","examples":[{"en":"My grandfather used to be an explorer.","zh":"我的祖父过去是一名探险家。"},{"en":"The polar bear population used to be larger.","zh":"北极熊的数量过去更多。"}],"task":"用used to说过去这里有更多冰。","answer":"There used to be more ice here.","correct":"He used to be an explorer.","incorrect":"He used to was an explorer.","reason":"used to后用be原形。"},{"profile":"goingto","title":"be going to：介绍计划与打算","rule":"am/is/are going to + 动词原形；表示打算成为某职业时用be going to be。","scene":"说明未来环境变化的影响","examples":[{"en":"Climate change is going to affect the polar bears.","zh":"气候变化将影响北极熊。"},{"en":"We are going to learn how to protect their habitat.","zh":"我们打算学习如何保护它们的栖息地。"}],"task":"说你打算观察北极熊幼崽。","answer":"I am going to observe the polar bear cubs.","correct":"She is going to be an artist.","incorrect":"She going to be an artist.","reason":"going to前需要与主语对应的be动词。"}],"senses":[{"word":"seal","meanings":[{"meaning":"名词·海豹","icon":"🦭","scene":"水中游动的海豹","en":"The seal is swimming.","zh":"海豹正在游泳。"},{"meaning":"动词·密封","icon":"📦","scene":"封好一个盒子","en":"Please seal the box.","zh":"请把盒子封好。"}]}]},{"id":"A_L7_U08","material":"LingoAce（自研）","level":"7","no":8,"title":"Unit 8 · Enjoying the Outdoors","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"sincefor","title":"since / for与现在完成时：表达持续时间","rule":"for后接时间段；since后接起始时间或表示起点的从句；持续到现在常使用现在完成时。","scene":"介绍露营经历的持续时间","examples":[{"en":"I have been ready for this trip for two weeks.","zh":"我为这次旅行准备就绪已经两周了。"},{"en":"I have seen few people since I arrived at the campsite.","zh":"自从到达营地，我见到的人很少。"}],"task":"用since说你从周一开始一直待在这里。","answer":"I have been here since Monday.","correct":"I have been here for two weeks.","incorrect":"I have been here since two weeks.","reason":"two weeks是时间段，用for；since Monday表示从周一起。"}],"senses":[{"word":"pack","meanings":[{"meaning":"动词·打包、收拾","icon":"🧳","scene":"出发前收行李","en":"I need to pack my bag.","zh":"我需要收拾行李。"},{"meaning":"名词·一包","icon":"🧃","scene":"一包果汁","en":"We bought a pack of juice boxes.","zh":"我们买了一包盒装果汁。"}]}]},{"id":"A_L8_U01","material":"LingoAce（自研）","level":"8","no":1,"title":"Unit 1 · Incredible People","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"because","title":"because / because of：用不同结构解释原因","rule":"because后接完整从句；because of后接名词、代词或动名词短语。原因相同，结构可以转换。","scene":"解释自己为什么敬佩某个人","examples":[{"en":"I admire her because she inspires other people.","zh":"我敬佩她，因为她鼓舞他人。"},{"en":"People respect her because of her achievements.","zh":"人们因为她的成就而尊重她。"}],"task":"把because she is brave改成because of her bravery，写完整句。","answer":"I admire her because of her bravery.","correct":"I admire her because of her courage.","incorrect":"I admire her because of she is brave.","reason":"完整从句she is brave前用because，不用because of。"},{"profile":"perfect","title":"现在完成时：询问经历或截至现在的完成情况","rule":"have/has + 过去分词；ever询问经历，yet常用于疑问和否定句。不要把明确结束的过去时间直接与现在完成时搭配。","scene":"采访人物的经历","examples":[{"en":"Have you ever seen her perform? Yes, I have.","zh":"你曾看过她表演吗？是的。"},{"en":"I have never seen her give up.","zh":"我从未见过她放弃。"}],"task":"用ever询问朋友是否读过他的故事。","answer":"Have you ever read his story?","correct":"Have you bought the tickets yet?","incorrect":"Have you buy the tickets yet?","reason":"完成时需要过去分词bought。"}],"senses":[{"word":"active","meanings":[{"meaning":"形容词·活跃的","icon":"🏃","scene":"喜欢运动的孩子","en":"She is an active child.","zh":"她是个活跃的孩子。"},{"meaning":"形容词·仍在活动的、活的","icon":"🌋","scene":"活火山","en":"This is an active volcano.","zh":"这是一座活火山。"}]}]},{"id":"A_L8_U02","material":"LingoAce（自研）","level":"8","no":2,"title":"Unit 2 · On the Screen","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"comparedegree","title":"程度副词修饰比较级；not as ... as","rule":"much、far、a lot表示差异大；a bit、a little表示差异小。not as + 原级 + as表达不如另一者。","scene":"比较不同类型的影视作品","examples":[{"en":"This documentary is much more interesting than that show.","zh":"这部纪录片比那个节目有趣得多。"},{"en":"The comedy is not as scary as the horror film.","zh":"这部喜剧没有那部恐怖片吓人。"}],"task":"用a bit more exciting比较the action film和the drama。","answer":"The action film is a bit more exciting than the drama.","correct":"This film is much more interesting.","incorrect":"This film is very more interesting.","reason":"比较级前在这里用much，不用very。"}],"senses":[{"word":"film","meanings":[{"meaning":"名词·电影","icon":"🎬","scene":"观看一部动画电影","en":"We watched an animated film.","zh":"我们看了一部动画电影。"},{"meaning":"动词·拍摄","icon":"📹","scene":"拍摄校园剧","en":"They are filming our school play.","zh":"他们正在拍摄我们的校园剧。"}]}]},{"id":"A_L8_U03","material":"LingoAce（自研）","level":"8","no":3,"title":"Unit 3 · Online Life","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"advice","title":"should / had better：提出建议与提醒","rule":"should/ought to表达应该；had better常用于带有现实后果的较强提醒。had better + 原形，否定had better not + 原形。","scene":"为朋友提供网络安全建议","examples":[{"en":"You shouldn't post your password online.","zh":"你不应该把密码发布到网上。"},{"en":"You had better check the privacy settings.","zh":"你最好检查隐私设置。"}],"task":"用had better not建议朋友不要分享个人照片。","answer":"You had better not share personal photos.","correct":"You had better not share your password.","incorrect":"You had better don't share your password.","reason":"had better的否定形式是在better后加not。"},{"profile":"indefinite","title":"不定代词：说清某个人、每个人或没有人","rule":"someone、everyone、no one通常按单数主语处理；谓语用is/has或动词第三人称单数。否定意义的no one通常不再叠加not。","scene":"讨论网络内容的传播","examples":[{"en":"Everyone is talking about the new video.","zh":"每个人都在谈论这个新视频。"},{"en":"Someone has shared my photo, but no one asked me.","zh":"有人分享了我的照片，但没人征求我的意见。"}],"task":"说没有人知道你的密码。","answer":"No one knows my password.","correct":"Everyone is talking about the video.","incorrect":"Everyone are talking about the video.","reason":"everyone按单数处理，用is。"}],"senses":[{"word":"run","meanings":[{"meaning":"动词·跑","icon":"🏃","scene":"孩子在操场跑步","en":"I run in the playground.","zh":"我在操场跑步。"},{"meaning":"动词·经营、管理","icon":"🏪","scene":"一家人经营小商店","en":"My aunt runs a small shop.","zh":"我的阿姨经营一家小商店。"}]}]},{"id":"A_L8_U04","material":"LingoAce（自研）","level":"8","no":4,"title":"Unit 4 · It's the law!","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"reported","title":"间接引语：转述陈述和疑问","rule":"过去语境转述时常有时态、人称和时间词变化；间接疑问句用陈述语序。具体是否回移取决于原话和转述语境。","scene":"转述侦探采访时听到的话","examples":[{"en":"The witness said, \"I saw a man.\"","zh":"目击者说：“我看到了一个男人。”"},{"en":"The reporter said that the witness had seen a man.","zh":"记者说，目击者看到过一个男人。"}],"task":"把The detective asked, \"Where do you live?\"改为间接引语，听话者用me。","answer":"The detective asked me where I lived.","correct":"He asked me where I lived.","incorrect":"He asked me where did I live.","reason":"间接问句使用I lived，不保留did I live的倒装。"},{"profile":"reported","title":"间接引语：转述陈述和疑问","rule":"过去语境转述时常有时态、人称和时间词变化；间接疑问句用陈述语序。具体是否回移取决于原话和转述语境。","scene":"转述证人对事件的描述","examples":[{"en":"The witness said, \"I was walking home.\"","zh":"目击者说：“我当时正在走路回家。”"},{"en":"The witness said that she had been walking home.","zh":"目击者说，她当时正在走路回家。"}],"task":"把He said, \"I am tired.\"改为过去语境中的间接引语。","answer":"He said that he was tired.","correct":"He asked me where I lived.","incorrect":"He asked me where did I live.","reason":"间接问句使用I lived，不保留did I live的倒装。"}],"senses":[{"word":"judge","meanings":[{"meaning":"名词·法官","icon":"⚖️","scene":"法庭里的法官","en":"The judge listened to the witness.","zh":"法官听取了目击者的陈述。"},{"meaning":"动词·判断、评价","icon":"💭","scene":"不要仅凭外表评价人","en":"Don't judge people by their appearance.","zh":"不要以貌取人。"}]}]},{"id":"A_L8_U05","material":"LingoAce（自研）","level":"8","no":5,"title":"Unit 5 · Customs and Traditions","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"tag","title":"附加问句：确认信息或寻求认同","rule":"通常前肯后否、前否后肯；附加部分助动词与前句时态、主语对应。注意语境和语调影响含义。","scene":"讨论尊重不同文化的习俗","examples":[{"en":"We should respect other cultures, shouldn't we?","zh":"我们应该尊重其他文化，对吧？"},{"en":"The ceremony isn't over, is it?","zh":"仪式还没结束，是吗？"}],"task":"给It is important to preserve traditions补上附加问句。","answer":"It is important to preserve traditions, isn't it?","correct":"It is important, isn't it?","incorrect":"It is important, doesn't it?","reason":"前句用is，附加问句对应isn't。"},{"profile":"shortagreement","title":"So / Neither + 助动词 + 主语：表示也一样","rule":"肯定认同用So do/am/can I等；否定认同用Neither do/am/can I等。助动词与原句的时态和结构相对应。","scene":"简短表达相同意见","examples":[{"en":"I like this tradition. So do I.","zh":"我喜欢这个传统。我也是。"},{"en":"I don't like rude behavior. Neither do I.","zh":"我不喜欢粗鲁的行为。我也不喜欢。"}],"task":"对I am interested in this ceremony表示你也一样。","answer":"So am I.","correct":"I am excited. So am I.","incorrect":"I am excited. So do I.","reason":"原句使用am，回应也使用am。"}],"senses":[{"word":"preserve","meanings":[{"meaning":"动词·保护、保存","icon":"🏛️","scene":"保护一处古迹","en":"We should preserve the ancient site.","zh":"我们应该保护这处古迹。"},{"meaning":"动词·加工保藏食物","icon":"🍓","scene":"把水果制成果酱保藏","en":"We preserve fruit by making jam.","zh":"我们把水果做成果酱来保藏。"}]}]},{"id":"A_L8_U06","material":"LingoAce（自研）","level":"8","no":6,"title":"Unit 6 · Natural Disaster","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"passiveif","title":"过去时被动与unless：报告影响并提出条件","rule":"was/were + 过去分词表示过去被怎样；unless意为除非，常相当于if ... not；真实将来条件从句常用现在时。","scene":"报道洪水影响并提出预防办法","examples":[{"en":"Several houses were damaged by the flood.","zh":"几座房屋被洪水损坏了。"},{"en":"The damage will get worse unless we take action.","zh":"除非我们采取行动，否则损害会加重。"}],"task":"用were rescued说幸存者被志愿者救出了。","answer":"The survivors were rescued by volunteers.","correct":"The houses were damaged by the flood.","incorrect":"The houses was damaged by the flood.","reason":"houses为复数，过去时被动用were damaged。"},{"profile":"firstif","title":"第一条件句：讨论真实可能的将来结果","rule":"If/unless从句常用一般现在时，主句可用will + 原形。unless相当于if ... not，避免无意中重复否定。","scene":"讨论环保行动的未来结果","examples":[{"en":"If we recycle more, we will reduce waste.","zh":"如果我们多回收，就会减少垃圾。"},{"en":"Unless we act now, the problem will get worse.","zh":"除非我们现在行动，否则问题会加重。"}],"task":"用if说如果人们保护湿地，就会帮助野生动物。","answer":"If people protect wetlands, they will help wildlife.","correct":"If we act now, we will reduce waste.","incorrect":"If we will act now, we will reduce waste.","reason":"在这个将来条件结构中，if从句用act。"}],"senses":[{"word":"flood","meanings":[{"meaning":"名词·洪水","icon":"🌊","scene":"洪水损坏房屋","en":"The flood damaged many houses.","zh":"洪水损坏了许多房屋。"},{"meaning":"动词·大量涌入、淹没","icon":"💬","scene":"消息不断涌入","en":"Messages flooded into my inbox.","zh":"消息大量涌入我的收件箱。"}]}]},{"id":"A_L8_U07","material":"LingoAce（自研）","level":"8","no":7,"title":"Unit 7 · Universe","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"secondif","title":"第二条件句与wish：表达现在的假设或愿望","rule":"If + 过去式，would/could + 原形，常用于与现实不同或可能性较低的假设。I wish + 过去式表达现在难实现的愿望。","scene":"讨论尚未实现的太空探索设想","examples":[{"en":"If we had the right spacecraft, we could travel farther.","zh":"如果我们有合适的飞船，就能走得更远。"},{"en":"I wish we knew more about this planet.","zh":"但愿我们对这颗行星了解得更多。"}],"task":"假设你是宇航员，用If和would说你会探索火星。","answer":"If I were an astronaut, I would explore Mars.","correct":"If I were an astronaut, I would explore Mars.","incorrect":"If I would be an astronaut, I would explore Mars.","reason":"本结构if从句用过去式were，不用would be。"}],"senses":[{"word":"support","meanings":[{"meaning":"动词·支持","icon":"🤝","scene":"朋友鼓励参赛者","en":"My friends support my dream.","zh":"我的朋友们支持我的梦想。"},{"meaning":"动词·支撑","icon":"🏗️","scene":"柱子支撑屋顶","en":"These columns support the roof.","zh":"这些柱子支撑着屋顶。"}]}]},{"id":"A_L8_U08","material":"LingoAce（自研）","level":"8","no":8,"title":"Unit 8 · Rules and Regulations","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"thirdif","title":"第三条件句：回顾没有发生的过去可能性","rule":"If + had + 过去分词，would/could have + 过去分词，用于假设与过去事实相反的情况；不要与未来真实条件混淆。","scene":"回顾违反规则后的后果","examples":[{"en":"If I had asked for permission, I wouldn't have got into trouble.","zh":"如果我当时征求了许可，就不会惹麻烦了。"},{"en":"If we follow the rules now, we will avoid problems.","zh":"如果我们现在遵守规则，就会避免问题。"}],"task":"过去没道歉而受罚，用If表达“如果当时道歉，就不会受罚”。","answer":"If I had apologized, I wouldn't have been punished.","correct":"If I had asked, I wouldn't have been punished.","incorrect":"If I asked yesterday, I wouldn't have been punished.","reason":"这里明确反事实回顾过去，if从句用had asked。"},{"profile":"secondif","title":"第二条件句与wish：表达现在的假设或愿望","rule":"If + 过去式，would/could + 原形，常用于与现实不同或可能性较低的假设。I wish + 过去式表达现在难实现的愿望。","scene":"区分现在假设与过去遗憾","examples":[{"en":"If the rule were fairer, more students would accept it.","zh":"如果这条规则更公平，更多学生就会接受。"},{"en":"If we had followed the rule, we wouldn't have got into trouble.","zh":"如果我们当时遵守了规则，就不会惹麻烦。"}],"task":"假设现在规则更清晰，用If和would表达你能理解它们。","answer":"If the rules were clearer, I would understand them.","correct":"If I were an astronaut, I would explore Mars.","incorrect":"If I would be an astronaut, I would explore Mars.","reason":"本结构if从句用过去式were，不用would be。"}],"senses":[{"word":"break","meanings":[{"meaning":"动词·打破、弄坏","icon":"🏺","scene":"不小心打碎花瓶","en":"Be careful not to break the vase.","zh":"小心别打碎花瓶。"},{"meaning":"搭配·break the rules，违反规则","icon":"📋","scene":"提醒遵守规则","en":"You must not break the rules.","zh":"你不能违反规则。"}]}]}]};
(()=>{
'use strict';
const WIDTH=1080,SCALE=2,MARGIN=60,INNER=960;
const FONT='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
const C={ink:'#342d47',muted:'#746b80',purple:'#8060a5',line:'#e5dcee',paper:'#f6f2fa',white:'#ffffff',mint:'#eef8f4',rose:'#fff2f0',lavender:'#f6f0fc'};
function painter(ctx,draw){
 function font(size,weight=400){ctx.font=`${weight} ${size}px ${FONT}`;ctx.textBaseline='top';}
 function lines(text,width,size,weight=400){
  font(size,weight);const result=[];
  for(const paragraph of String(text??'').split('\n')){
   let line='';const tokens=paragraph.match(/[A-Za-z0-9]+(?:['’.-][A-Za-z0-9]+)*\s*|\s+|./gu)||[''];
   for(const token of tokens){
    if(line&&ctx.measureText(line+token).width>width){result.push(line.trimEnd());line='';}
    if(ctx.measureText(token).width>width){for(const char of token){if(line&&ctx.measureText(line+char).width>width){result.push(line.trimEnd());line='';}line+=char;}}
    else line+=token;
   }
   result.push(line.trimEnd());
  }
  return result;
 }
 function text(value,x,y,width,size=20,color=C.ink,weight=400,leading=1.5){
  const ls=lines(value,width,size,weight),step=size*leading;
  if(draw){font(size,weight);ctx.fillStyle=color;ls.forEach((line,i)=>ctx.fillText(line,x,y+i*step));}
  return y+ls.length*step;
 }
 function box(x,y,w,h,fill=C.white,r=22){if(!draw)return;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=1;ctx.strokeStyle=C.line;ctx.stroke();}
 function section(label,y){return text(label,MARGIN,y,INNER,26,C.purple,700)+20;}
 function column(title,body,x,y,w,fill){
  let end=y+22;end=text(title,x+24,end,w-48,17,C.purple,700)+10;
  for(const item of body)end=text(item.text,x+24,end,w-48,item.size||19,item.color||C.ink,item.weight||400)+10;
  const bottom=end+12;box(x,y,w,bottom-y,fill,17);
  if(draw){let yy=y+22;yy=text(title,x+24,yy,w-48,17,C.purple,700)+10;for(const item of body)yy=text(item.text,x+24,yy,w-48,item.size||19,item.color||C.ink,item.weight||400)+10;}
  return bottom;
 }
 // Measurement and painting use the same wrapping and coordinates.
 function layout(u){
  let y=55;y=text('lingoace',MARGIN,y,INNER,36,C.purple,700)+10;
  y=text(`${u.material}  ·  Level ${u.level}  ·  Unit ${u.no}`,MARGIN,y,INNER,18,C.muted)+28;
  y=text(u.title.replace(/^Unit\s*\d+\s*[·.:-]\s*/,''),MARGIN,y,INNER,43,C.ink,700,1.25)+18;
  y=text('一词多义 × 单元语法应用',MARGIN,y,INNER,25,C.purple,700)+10;
  y=text('看懂情境，读懂句意，再换成自己的生活说一说。',MARGIN,y,INNER,20,C.muted)+22;
  if(u.kind==='主题拓展')y=text('主题拓展 · 配套延伸句型',MARGIN,y,INNER,17,C.muted)+12;
  y=section('01  一词多义 · 同一个词，不同的意思',y+20);
  if(!u.senses.length)y=text('本单元先巩固基础词义，直接进入下方语法应用。',MARGIN,y,INNER,21,C.muted)+25;
  for(const s of u.senses){
   const top=y;let yy=y+28;yy=text(s.word,MARGIN+28,yy,INNER-56,34,C.purple,700)+18;
   const gap=18,cw=(INNER-56-gap)/2;
   for(let i=0;i<s.meanings.length;i+=2){
    const bottoms=[];
    for(let j=i;j<Math.min(i+2,s.meanings.length);j++){
     const m=s.meanings[j],x=MARGIN+28+(j-i)*(cw+gap);
     bottoms.push(column(m.meaning,[{text:'场景：'+m.scene,size:17,color:C.muted},{text:m.en,size:22,weight:600},{text:m.zh,size:18,color:C.muted}],x,yy,cw,j%2?C.mint:C.lavender));
    }
    yy=Math.max(...bottoms)+18;
   }
   yy=text('试一试：遮住中文，说出句中这个词的意思，再换一个情境造句。',MARGIN+28,yy,INNER-56,18,C.muted)+26;
   if(draw){ctx.save();ctx.globalCompositeOperation='destination-over';box(MARGIN,top,INNER,yy-top);ctx.restore();}
   y=yy+22;
  }
  y=section('02  单元语法 · 让句子用得起来',y+12);
  for(let i=0;i<u.grammar.length;i++){
   const g=u.grammar[i],top=y;let yy=y+28;
   yy=text(`${String(i+1).padStart(2,'0')}  ${g.title}`,MARGIN+28,yy,INNER-56,25,C.ink,700)+17;
   yy=text('使用场景：'+g.scene,MARGIN+28,yy,INNER-56,20,C.purple,600)+12;
   yy=text(g.rule,MARGIN+28,yy,INNER-56,19,C.muted)+20;
   for(const e of g.examples){yy=text(e.en,MARGIN+28,yy,INNER-56,25,C.ink,600)+6;yy=text(e.zh,MARGIN+28,yy,INNER-56,19,C.muted)+18;}
   const cw=(INNER-74)/2;
   const left=column('轮到孩子说',[{text:g.task,size:20},{text:'参考表达',size:16,color:C.purple,weight:700},{text:g.answer,size:22,weight:600}],MARGIN+28,yy,cw,C.mint);
   const right=column('常见错误 → 正确表达',[{text:'易错：'+g.incorrect,size:18,color:'#9a6664'},{text:'正确：'+g.correct,size:20,color:'#39765d',weight:600},{text:g.reason,size:17,color:C.muted}],MARGIN+46+cw,yy,cw,C.rose);
   yy=Math.max(left,right)+28;
   if(draw){ctx.save();ctx.globalCompositeOperation='destination-over';box(MARGIN,top,INNER,yy-top);ctx.restore();}
   y=yy+23;
  }
  y=section('03  家庭小练习 · 每次 5–8 分钟',y+10);
  y=text('① 看情境，读例句，说一说词和句子的意思。\n② 遮住参考答案，完成一个替换或表达任务。\n③ 联系自己的生活，再说一个新句子。',MARGIN,y,INNER,21,C.ink,400,1.65)+24;
  y=text('新编配套拓展 · 合理的其他表达也可以。',MARGIN,y,INNER,16,C.muted)+20;
  y=text('From Rachel Hu',MARGIN,y,INNER,17,C.purple,600)+55;
  if(draw){ctx.save();ctx.globalCompositeOperation="destination-over";ctx.fillStyle=C.paper;ctx.fillRect(0,0,WIDTH,ctx.canvas.height/SCALE);ctx.restore();}
  return Math.ceil(y);
 }
 return layout;
}
async function exportUnit(u){
 if(!u)throw Error('未找到单元');
 if(document.fonts?.ready)await document.fonts.ready;
 const measure=document.createElement('canvas');const mc=measure.getContext('2d');if(!mc)throw Error('当前浏览器无法生成图片');
 const logicalHeight=Math.max(1920,painter(mc,false)(u));
