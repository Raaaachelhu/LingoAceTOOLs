":"progressive","title":"现在进行时：描述此刻正在做什么","rule":"结构是am/is/are + 动词-ing；疑问句把be动词提前。根据主语选择am、is或are。","scene":"运动场上的现场解说","examples":[{"en":"What is she doing? She is throwing a ball.","zh":"她正在做什么？她正在扔球。"},{"en":"Are they playing tennis? No, they are swimming.","zh":"他们正在打网球吗？不，他们正在游泳。"}],"task":"看到一个男孩正在骑自行车，用He开头说一句。","answer":"He is riding a bike.","correct":"She is swimming.","incorrect":"She swimming.","reason":"进行时不能漏掉be动词；不是把每个动词加-ing就成句。"},{"profile":"can","title":"can / can't：表达能力或许可","rule":"can表示能、会，也可在场景中表示允许；can't表示不能或不允许。后接动词原形；Can ...?用于提问，简答用can/can't。","scene":"读懂运动场上的许可与禁止","examples":[{"en":"Can we play tennis here? Yes, you can.","zh":"我们可以在这里打网球吗？可以。"},{"en":"You can't ride bikes here.","zh":"你们不能在这里骑自行车。"}],"task":"用can't提醒朋友不能在这里游泳。","answer":"You can't swim here.","correct":"She can swim.","incorrect":"She can swims.","reason":"can后面用动词原形。"}],"senses":[{"word":"play","meanings":[{"meaning":"动词·玩耍","icon":"🧸","scene":"孩子和玩具一起玩","en":"The children play with their toys.","zh":"孩子们玩玩具。"},{"meaning":"搭配·演奏乐器","icon":"🎹","scene":"孩子弹钢琴","en":"She plays the piano.","zh":"她弹钢琴。"},{"meaning":"名词·戏剧","icon":"🎭","scene":"观众看舞台剧","en":"We watched a school play.","zh":"我们看了一出校园剧。"}]},{"word":"ride","meanings":[{"meaning":"动词·骑","icon":"🚲","scene":"骑自行车去公园","en":"I ride my bike to the park.","zh":"我骑自行车去公园。"},{"meaning":"名词·乘坐、兜风","icon":"🎡","scene":"乘坐摩天轮","en":"We went for a ride on the big wheel.","zh":"我们乘了一次摩天轮。"}]}]},{"id":"P_L1_U08","material":"Power Up","level":"1","no":8,"title":"Unit 8 · At Home","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1 · Vocabulary & Expressions 1","Lesson 2 · Vocabulary & Expressions 2","Lesson 3 · Story & Grammar","Lesson 4 · Read & Sing Aloud 1","Lesson 5 · Read & Sing Aloud 2","Lesson 6 · Dialogue & Grammar","Lesson 7 · Cross-curricular","Lesson 9 · Literature 2"],"grammar":[{"profile":"can","title":"can / can't：表达能力或许可","rule":"can表示能、会，也可在场景中表示允许；can't表示不能或不允许。后接动词原形；Can ...?用于提问，简答用can/can't。","scene":"介绍家人的才艺","examples":[{"en":"I can swim, but I can't play the guitar.","zh":"我会游泳，但不会弹吉他。"},{"en":"Can your sister play the piano? Yes, she can.","zh":"你姐姐会弹钢琴吗？是的，她会。"}],"task":"把your sister换成your brother，提问他是否会游泳。","answer":"Can your brother swim?","correct":"She can swim.","incorrect":"She can swims.","reason":"can后面用动词原形。"},{"profile":"place","title":"位置介词：用句子说明在哪里","rule":"用Where is询问一个物品；用in、on、under、next to说明位置。多个物品用Where are ...? / They are ...。","scene":"介绍家具的位置","examples":[{"en":"The rug is in front of the armchair.","zh":"地毯在扶手椅前面。"},{"en":"The lamp is between the armchair and the sofa.","zh":"灯在扶手椅和沙发之间。"}],"task":"用behind说钟在沙发后面。","answer":"The clock is behind the sofa.","correct":"The crayon is under the desk.","incorrect":"The crayon under the desk.","reason":"描述位置也需要is或are，不能只写物品和介词。"}],"senses":[{"word":"bed","meanings":[{"meaning":"名词·床","icon":"🛏️","scene":"睡在床上","en":"I sleep in my bed.","zh":"我睡在床上。"},{"meaning":"名词·花坛、种植床","icon":"🌷","scene":"花坛里开着花","en":"The flowers grow in a garden bed.","zh":"这些花长在花坛里。"}]},{"word":"phone","meanings":[{"meaning":"名词·电话","icon":"📱","scene":"桌上有一部手机","en":"My phone is on the desk.","zh":"我的手机在桌上。"},{"meaning":"动词·打电话","icon":"☎️","scene":"给奶奶打电话","en":"I will phone Grandma tonight.","zh":"我今晚会给奶奶打电话。"}]}]},{"id":"P_L1_U09","material":"Power Up","level":"1","no":9,"title":"Unit 9 · Happy Holidays","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1 · Vocabulary & Expression 1","Lesson 2 · Vocabulary & Expressions 2","Lesson 3 · Story & Grammar","Lesson 4 · Read & Sing Aloud 1","Lesson 5 · Read & Sing Aloud 2","Lesson 6 · Dialogue & Grammar","Lesson 7 · Cross-curricular","Lesson 9 · Literature 2"],"grammar":[{"profile":"imperative","title":"祈使句：听懂并发出动作指令","rule":"用动词原形开头；通常省略you。Don't + 动词原形表示不要做某事；加please更礼貌。","scene":"海边收拾行李与衣物","examples":[{"en":"Put the hat on the table.","zh":"把帽子放到桌子上。"},{"en":"Take these pencils and put them in the bag.","zh":"拿上这些铅笔，把它们放进包里。"}],"task":"提醒朋友收起那些衣服，用Pick up开头。","answer":"Pick up those clothes.","correct":"Open your book, please.","incorrect":"Opens your book, please.","reason":"指令开头使用动词原形open。"},{"profile":"gerund","title":"like + doing：表达喜欢的活动","rule":"like后可接动词-ing形式描述喜好，也常可接to do；球类通常play football，乐器通常play the guitar。 enjoy后只能接doing，不能接to do。","scene":"分享假期喜欢的活动","examples":[{"en":"I like swimming in the sea.","zh":"我喜欢在海里游泳。"},{"en":"I enjoy playing on the sand.","zh":"我喜欢在沙滩上玩。"}],"task":"用enjoy说明你喜欢在海滩拍照。","answer":"I enjoy taking photos at the beach.","correct":"I like playing football.","incorrect":"I like play football.","reason":"like后的活动用playing football或to play football。"}],"senses":[{"word":"rock","meanings":[{"meaning":"名词·岩石","icon":"🪨","scene":"河边的大石头","en":"There is a big rock by the river.","zh":"河边有一块大石头。"},{"meaning":"动词·摇动","icon":"🪑","scene":"轻轻摇动椅子","en":"The chair rocks gently.","zh":"椅子轻轻摇动。"},{"meaning":"名词·摇滚乐","icon":"🎸","scene":"乐队演奏摇滚乐","en":"My brother likes rock music.","zh":"我哥哥喜欢摇滚乐。"}]},{"word":"short","meanings":[{"meaning":"形容词·短的","icon":"📏","scene":"一支很短的铅笔","en":"This pencil is short.","zh":"这支铅笔很短。"},{"meaning":"形容词·个子矮的","icon":"🧍","scene":"比较两个人的身高","en":"The boy is short, but his brother is tall.","zh":"这个男孩个子矮，但他哥哥很高。"}]}]},{"id":"P_L2_U01","material":"Power Up","level":"2","no":1,"title":"Unit 1 · A Day on the Farm","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1 · Vocabulary & Expressions 1","Lesson 2 · Vocabulary & Expressions 2","Lesson 3 · Story & Grammar","Lesson 4 · Read & Sing Aloud 1","Lesson 5 · Read & Sing Aloud 2","Lesson 6 · Dialogue & Grammar","Lesson 7 · Cross-curricular","Lesson 9 · Literature 2"],"grammar":[{"profile":"routine","title":"一般现在时：介绍习惯、工作与作息","rule":"I/you/we/they用动词原形；he/she/it用第三人称单数形式。问句用Do/Does，后接动词原形。","scene":"分享上学日的作息","examples":[{"en":"What time do you get up? I get up at seven.","zh":"你几点起床？我七点起床。"},{"en":"What time does school finish? It finishes at four.","zh":"学校几点放学？四点放学。"}],"task":"介绍Mia七点起床，注意动词变化。","answer":"Mia gets up at seven.","correct":"He goes to school at seven.","incorrect":"He go to school at seven.","reason":"第三人称单数肯定句需要goes；Does he go中的go仍用原形。"},{"profile":"there","title":"There be：介绍有、没有与数量","rule":"一个或不可数事物用There is；多个用There are。提问用Is/Are there；否定用isn't/aren't。","scene":"比较山地景物的数量","examples":[{"en":"There are rocks on the mountain.","zh":"山上有岩石。"},{"en":"There isn't any grass on the ground.","zh":"地面上没有草。"}],"task":"说树上没有叶子。","answer":"There aren't any leaves on the tree.","correct":"There are two chairs.","incorrect":"There is two chairs.","reason":"two chairs是复数，搭配are。"}],"senses":[{"word":"rock","meanings":[{"meaning":"名词·岩石","icon":"🪨","scene":"河边的大石头","en":"There is a big rock by the river.","zh":"河边有一块大石头。"},{"meaning":"动词·摇动","icon":"🪑","scene":"轻轻摇动椅子","en":"The chair rocks gently.","zh":"椅子轻轻摇动。"},{"meaning":"名词·摇滚乐","icon":"🎸","scene":"乐队演奏摇滚乐","en":"My brother likes rock music.","zh":"我哥哥喜欢摇滚乐。"}]},{"word":"ground","meanings":[{"meaning":"名词·地面","icon":"🌱","scene":"地面上的种子","en":"The seed fell on the ground.","zh":"种子落在地上。"},{"meaning":"动词形式·grind的过去式和过去分词","icon":"☕","scene":"把咖啡豆磨成粉","en":"She ground the coffee beans.","zh":"她把咖啡豆磨成了粉。"}]}]},{"id":"P_L2_U02","material":"Power Up","level":"2","no":2,"title":"Unit 2 · My Week","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1 · Vocabulary & Expressions 1","Lesson 2 · Vocabulary & Expressions 2","Lesson 3 · Story & Grammar","Lesson 4 · Read & Sing Aloud 1","Lesson 5 · Read & Sing Aloud 2","Lesson 6 · Dialogue & Grammar","Lesson 7 · Cross-curricular","Lesson 9 · Literature 2"],"grammar":[{"profile":"must","title":"must / mustn't：说明必须做与禁止做的事","rule":"must + 动词原形表示必须；mustn't + 动词原形表示禁止。mustn't不是不必，不必通常用don't have to。","scene":"制作轮滑安全提示牌","examples":[{"en":"You must wear a helmet.","zh":"你必须戴头盔。"},{"en":"You mustn't wear your skates in the house.","zh":"你不可以在家里穿轮滑鞋。"}],"task":"提醒朋友运动前必须热身。","answer":"You must warm up before you play sports.","correct":"You must wear a helmet.","incorrect":"You must to wear a helmet.","reason":"must后直接接动词原形，不加to。"},{"profile":"frequency","title":"频率副词：说明事情多久发生一次","rule":"always、usually、sometimes、never常放在主要行为动词前、be动词后；sometimes也可以放句首。","scene":"采访朋友活动的频率","examples":[{"en":"How often do you listen to music? I often listen to music.","zh":"你多久听一次音乐？我经常听音乐。"},{"en":"Do you ever write emails? No, I never write emails.","zh":"你写过电子邮件吗？没有，我从不写电子邮件。"}],"task":"用sometimes说你有时购物。","answer":"I sometimes go shopping.","correct":"She usually washes the dishes.","incorrect":"She washes usually the dishes.","reason":"此处usually放在行为动词washes前更自然。"}],"senses":[{"word":"book","meanings":[{"meaning":"名词·书","icon":"📖","scene":"桌上放着一本书","en":"This is my English book.","zh":"这是我的英语书。"},{"meaning":"动词·预订","icon":"🎫","scene":"出行前订车票","en":"We need to book our tickets.","zh":"我们需要预订车票。"}]},{"word":"feed","meanings":[{"meaning":"动词·喂养","icon":"🐶","scene":"给狗喂食","en":"I feed the dog every morning.","zh":"我每天早晨喂狗。"},{"meaning":"名词·饲料","icon":"🌾","scene":"农场的一袋饲料","en":"The farmer bought a bag of animal feed.","zh":"农民买了一袋动物饲料。"}]}]},{"id":"P_L2_U03","material":"Power Up","level":"2","no":3,"title":"Unit 3 · Party time!","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1 · Vocabulary & Expressions 1","Lesson 2 · Vocabulary & Expressions 2","Lesson 3 · Story & Grammar","Lesson 4 · Read & Sing Aloud 1","Lesson 5 · Read & Sing Aloud 2","Lesson 6 · Dialogue & Grammar","Lesson 7 · Cross-curricular","Lesson 9 · Literature 2"],"grammar":[{"profile":"why","title":"Why / because：提问原因并给出解释","rule":"Why引导原因问句；because后接主语和谓语构成的完整从句。可以先问答，再合成一个句子。","scene":"猜一猜朋友为什么穿着戏服","examples":[{"en":"Why are you wearing a pirate's costume?","zh":"你为什么穿着海盗服？"},{"en":"Because I am going to a costume party.","zh":"因为我要去参加化装舞会。"}],"task":"朋友说Because I love asking questions，补出为什么问这么多问题。","answer":"Why are you asking so many questions?","correct":"I like art because it is fun.","incorrect":"Because it is fun, so I like art.","reason":"标准英语中because和so不在同一句中成对引导同一因果关系。"},{"profile":"presentcontrast","title":"一般现在时与现在进行时：习性和此刻的区别","rule":"平常吃什么、具有什么特征用一般现在时；此刻正在做什么用am/is/are + 动词-ing。","scene":"对比平时的穿着与今天的戏服","examples":[{"en":"He usually wears a shirt.","zh":"他平时通常穿衬衫。"},{"en":"Today, he is wearing a pirate's costume.","zh":"今天，他穿着海盗服。"}],"task":"她平时穿裙子，但今天正穿着护士服，用两句表达。","answer":"She usually wears a dress. Today, she is wearing a nurse's costume.","correct":"Dolphins eat fish. They are playing now.","incorrect":"Dolphins are eat fish.","reason":"习性用eat；此刻正在吃应说are eating，不能are eat。"}],"senses":[{"word":"present","meanings":[{"meaning":"名词·礼物","icon":"🎁","scene":"生日礼物盒","en":"This is a birthday present.","zh":"这是一份生日礼物。"},{"meaning":"形容词·在场的","icon":"🙋","scene":"学生到齐了","en":"All the students are present today.","zh":"今天所有学生都在场。"},{"meaning":"名词·现在","icon":"🕐","scene":"比较过去与现在","en":"We are learning about the past and the present.","zh":"我们正在学习过去和现在。"}]},{"word":"good","meanings":[{"meaning":"形容词·好的、质量好的","icon":"📚","scene":"孩子喜欢一本书","en":"This is a good book.","zh":"这是一本好书。"},{"meaning":"形容词·善良的、品行好的","icon":"🤝","scene":"乐于帮助邻居的人","en":"He is a good person who helps others.","zh":"他是个帮助他人的好人。"},{"meaning":"搭配·be good at，擅长","icon":"🎨","scene":"孩子擅长画画","en":"She is good at drawing.","zh":"她擅长画画。"}]}]},{"id":"P_L2_U04","material":"Power Up","level":"2","no":4,"title":"Unit 4 · The Family at Home","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1 · Vocabulary & Expressions 1","Lesson 2 · Vocabulary & Expressions 2","Lesson 3 · Story & Grammar","Lesson 4 · Read & Sing Aloud 1","Lesson 5 · Read & Sing Aloud 2","Lesson 6 · Dialogue & Grammar","Lesson 7 · Cross-curricular","Lesson 9 · Literature 2"],"grammar":[{"profile":"compare","title":"比较级：比较两个人或事物","rule":"短形容词常加-er，长形容词常用more；两者比较用than。big变bigger，clean变cleaner。","scene":"比较两个家人的房间","examples":[{"en":"My room is bigger than Sam's room.","zh":"我的房间比萨姆的房间大。"},{"en":"His room is smaller, but it is cleaner.","zh":"他的房间更小，但更干净。"}],"task":"用cleaner比较your room和my room。","answer":"Your room is cleaner than my room.","correct":"My room is bigger than yours.","incorrect":"My room is more bigger than yours.","reason":"bigger本身就是比较级，不再叠加more。"},{"profile":"posspronoun","title":"物主代词：不用重复物品名称","rule":"my/your/his/her/our/their后要接名词；mine/yours/his/hers/ours/theirs可独立使用，不再接名词。","scene":"比较属于不同人的物品","examples":[{"en":"This is my room. That is hers.","zh":"这是我的房间。那是她的。"},{"en":"Our dog is small. Theirs is bigger.","zh":"我们的狗很小。他们的狗更大。"}],"task":"把My family is big改用Mine开头，前文已明确说family。","answer":"Mine is big.","correct":"This guitar is hers.","incorrect":"This guitar is her.","reason":"名词已经作主语出现，表所属用独立形式hers。"}],"senses":[{"word":"text","meanings":[{"meaning":"名词·文字、文本","icon":"📃","scene":"阅读页面上的文字","en":"Read the text on the page.","zh":"读一读页面上的文字。"},{"meaning":"动词·发短信","icon":"📱","scene":"告诉朋友自己到家了","en":"Text me when you get home.","zh":"到家后给我发短信。"}]},{"word":"ring","meanings":[{"meaning":"名词·戒指","icon":"💍","scene":"手指上戴着戒指","en":"She wears a gold ring.","zh":"她戴着一枚金戒指。"},{"meaning":"动词·铃响","icon":"🔔","scene":"学校上课铃响起","en":"The school bell rings at eight.","zh":"学校的铃八点响。"}]}]},{"id":"P_L2_U05","material":"Power Up","level":"2","no":5,"title":"Unit 5 · Animal World","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1 · Vocabulary & Expressions 1","Lesson 2 · Vocabulary & Expressions 2","Lesson 3 · Story & Grammar","Lesson 4 · Read & Sing Aloud 1","Lesson 5 · Read & Sing Aloud 2","Lesson 6 · Dialogue & Grammar","Lesson 7 · Cross-curricular","Lesson 9 · Literature 2"],"grammar":[{"profile":"superlative","title":"最高级：在一个范围里选出最突出的","rule":"最高级前通常加the；短形容词常加-est，长形容词常用most。说明范围，如here或in our class。","scene":"给动物颁发特色奖","examples":[{"en":"The bear is the biggest animal here.","zh":"熊是这里最大的动物。"},{"en":"The kangaroo has got the longest tail.","zh":"袋鼠的尾巴最长。"}],"task":"用prettiest给鹦鹉颁奖，限定范围here。","answer":"The parrot is the prettiest bird here.","correct":"It is the biggest animal here.","incorrect":"It is biggest animal here.","reason":"普通最高级名词短语前通常需要the。"},{"profile":"place","title":"位置介词：用句子说明在哪里","rule":"用Where is询问一个物品；用in、on、under、next to说明位置。多个物品用Where are ...? / They are ...。","scene":"用动物园地图定位动物","examples":[{"en":"The parrot is above the panda.","zh":"鹦鹉在熊猫上方。"},{"en":"The lion is near the rock.","zh":"狮子在岩石附近。"}],"task":"用below说海豚在鲸的下方。","answer":"The dolphin is below the whale.","correct":"The crayon is under the desk.","incorrect":"The crayon under the desk.","reason":"描述位置也需要is或are，不能只写物品和介词。"}],"senses":[{"word":"bat","meanings":[{"meaning":"名词·蝙蝠","icon":"🦇","scene":"夜空中的蝙蝠","en":"The bat flies at night.","zh":"蝙蝠在夜间飞行。"},{"meaning":"名词·球棒","icon":"🏏","scene":"孩子拿着球棒","en":"He is holding a baseball bat.","zh":"他正拿着一根棒球棒。"}]},{"word":"bear","meanings":[{"meaning":"名词·熊","icon":"🐻","scene":"熊在森林里","en":"The bear lives in the forest.","zh":"这只熊生活在森林里。"},{"meaning":"动词·忍受","icon":"🔊","scene":"响声让人受不了","en":"I can't bear the loud noise.","zh":"我受不了这巨大的噪声。"}]}]},{"id":"P_L2_U06","material":"Power Up","level":"2","no":6,"title":"Unit 6 · Our Weather","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1 · Vocabulary & Expressions 1","Lesson 2 · Vocabulary & Expressions 2","Lesson 3 · Story & Grammar","Lesson 4 · Read & Sing Aloud 1","Lesson 5 · Read & Sing Aloud 2","Lesson 6 · Dialogue & Grammar","Lesson 7 · Cross-curricular","Lesson 9 · Literature 2"],"grammar":[{"profile":"pastbe","title":"was / were与There was / were：描述过去状态","rule":"I/he/she/it过去用was；you/we/they用were。过去存在用There was/were；否定加not。","scene":"对比昨天和今天的天气","examples":[{"en":"It was sunny yesterday, but it is cold today.","zh":"昨天阳光明媚，但今天很冷。"},{"en":"Were you in the park yesterday? No, I wasn't.","zh":"昨天你在公园吗？不，我不在。"}],"task":"说昨天桌子上有一个包，使用There was。","answer":"There was a bag on the table yesterday.","correct":"It was cold yesterday.","incorrect":"It is cold yesterday.","reason":"yesterday定位过去，描述当时状态用was。"},{"profile":"pastbe","title":"was / were与There was / were：描述过去状态","rule":"I/he/she/it过去用was；you/we/they用were。过去存在用There was/were；否定加not。","scene":"回忆昨天房间里的物品","examples":[{"en":"There was a bag on the floor.","zh":"地板上曾有一个包。"},{"en":"Were there any shorts? No, there weren't.","zh":"当时有短裤吗？不，没有。"}],"task":"用There were说昨天床上有两件外套。","answer":"There were two coats on the bed yesterday.","correct":"It was cold yesterday.","incorrect":"It is cold yesterday.","reason":"yesterday定位过去，描述当时状态用was。"}],"senses":[{"word":"cold","meanings":[{"meaning":"形容词·冷的","icon":"❄️","scene":"下雪时穿上外套","en":"It is cold today.","zh":"今天很冷。"},{"meaning":"名词·感冒","icon":"🤧","scene":"孩子感冒了","en":"I have a cold.","zh":"我感冒了。"}]},{"word":"short","meanings":[{"meaning":"形容词·短的","icon":"📏","scene":"一支很短的铅笔","en":"This pencil is short.","zh":"这支铅笔很短。"},{"meaning":"形容词·个子矮的","icon":"🧍","scene":"比较两个人的身高","en":"The boy is short, but his brother is tall.","zh":"这个男孩个子矮，但他哥哥很高。"}]}]},{"id":"P_L2_U07","material":"Power Up","level":"2","no":7,"title":"Unit 7 · Let's Cook!","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1 · Vocabulary & Expressions 1","Lesson 2 · Vocabulary & Expressions 2","Lesson 3 · Story & Grammar","Lesson 4 · Read & Sing Aloud 1","Lesson 5 · Read & Sing Aloud 2","Lesson 6 · Dialogue & Grammar","Lesson 7 · Cross-curricular","Lesson 9 · Literature 2"],"grammar":[{"profile":"past","title":"一般过去时：回顾已经发生的事情","rule":"肯定句用过去式；问句Did + 主语 + 动词原形；否定didn't + 动词原形。go→went，buy→bought。","scene":"回忆昨天做的晚餐","examples":[{"en":"We fried fish and boiled pasta last night.","zh":"昨晚我们煎了鱼，还煮了意大利面。"},{"en":"Did you cook dinner? No, I didn't. I washed the dishes.","zh":"你做晚饭了吗？不，我没有。我洗了碗。"}],"task":"用didn't说自己昨天没有吃鱼。","answer":"I didn't eat fish yesterday.","correct":"Did you go to the park?","incorrect":"Did you went to the park?","reason":"Did之后用go，不再使用过去式went。"}],"senses" "no":1,"title":"Unit 1 · Practice Time","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1 · Vocabulary & Expressions","Lesson 3 · Grammar & Expressions","Lesson 4 · Vocabulary & Song","Lesson 5 · Conversation & Grammar","Lesson 6 · Cross-curricular","Lesson 9 · Literature 2"],"grammar":[{"profile":"could","title":"could / couldn't：回顾过去的能力","rule":"could表示过去一般具备的能力，后接动词原形；用when I was ...交代年龄。can常用于现在能力。","scene":"分享小时候会做的事情","examples":[{"en":"I could hop on one leg when I was four.","zh":"我四岁时就会单脚跳。"},{"en":"I couldn't skip then, but I can skip now.","zh":"那时我不会跳绳，但现在我会了。"}],"task":"用could说自己五岁时会跳舞。","answer":"I could dance when I was five.","correct":"I could swim when I was five.","incorrect":"I could swam when I was five.","reason":"could后用动词原形swim。"},{"profile":"question","title":"疑问句：把想了解的信息问出来","rule":"be动词问句把am/is/are提前；一般现在时行为动词常用Do/Does；What/Where/How等放在问题开头。","scene":"了解杂技演员的工作时间","examples":[{"en":"What time do they have breakfast?","zh":"他们几点吃早餐？"},{"en":"Why do they get up early?","zh":"他们为什么早起？"}],"task":"询问这是谁的帽子。","answer":"Whose hat is this?","correct":"Is it a pencil?","incorrect":"It is a pencil?","reason":"规范的一般疑问句把is移到主语it之前。"}],"senses":[{"word":"dress","meanings":[{"meaning":"名词·连衣裙","icon":"👗","scene":"穿一条新裙子","en":"She has a new dress.","zh":"她有一条新连衣裙。"},{"meaning":"动词·穿衣","icon":"🧥","scene":"为天气选择穿着","en":"We dress warmly in winter.","zh":"冬天我们穿得暖和。"}]},{"word":"balance","meanings":[{"meaning":"名词·平衡","icon":"⚖️","scene":"保持身体或生态平衡","en":"The ecosystem needs balance.","zh":"生态系统需要平衡。"},{"meaning":"动词·使平衡","icon":"🤸","scene":"把书顶在头上","en":"Can you balance a book on your head?","zh":"你能把一本书平衡地顶在头上吗？"}]}]},{"id":"P_L3_U02","material":"Power Up","level":"3","no":2,"title":"Unit 2 · What's for Breakfast?","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1 · Vocabulary & Expressions","Lesson 3 · Grammar & Expressions","Lesson 4 · Vocabulary & Song","Lesson 5 · Conversation & Grammar","Lesson 6 · Cross-curricular","Lesson 9 · Literature 2"],"grammar":[{"profile":"relative","title":"关系从句：用额外信息说明是哪一个人或物","rule":"who常指人，which/that常指物；where说明地点。从句修饰前面的名词，已经由关系词承担的成分不要重复。","scene":"给早餐旅行照片写说明","examples":[{"en":"This is the teacher who taught May.","zh":"这就是教过梅的那位老师。"},{"en":"This is the place where May grew up.","zh":"这就是梅长大的地方。"}],"task":"用who把This is the cook和He made our pancakes合成一句。","answer":"This is the cook who made our pancakes.","correct":"This is the book that I bought.","incorrect":"This is the book that I bought it.","reason":"that已经代表book作bought的宾语，后面不再加it。"},{"profile":"when","title":"When ...：解释条件或时间与变化","rule":"用When + 主语 + 动词描述某事发生的条件或时间，再用完整主句说明结果；一般规律可用一般现在时。","scene":"按时间讲一次早餐后的出行","examples":[{"en":"When we finished breakfast, we went shopping.","zh":"吃完早餐后，我们去购物了。"},{"en":"Grandma made a pancake when I was sad.","zh":"我难过时，奶奶给我做了一个薄饼。"}],"task":"用When连接We finished lunch和We climbed the wall。","answer":"When we finished lunch, we climbed the wall.","correct":"When ice gets warm, it melts.","incorrect":"When ice get warm, it melt.","reason":"ice在这里作单数不可数主语，gets和melts都要对应。"}],"senses":[{"word":"part","meanings":[{"meaning":"名词·部分","icon":"🧩","scene":"观察植物结构","en":"A root is part of a plant.","zh":"根是植物的一部分。"},{"meaning":"名词·角色","icon":"🎭","scene":"学生在戏剧中表演","en":"She has a small part in the play.","zh":"她在这出戏里扮演一个小角色。"}]}]},{"id":"P_L3_U03","material":"Power Up","level":"3","no":3,"title":"Unit 3 · A Healthy Body","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1 · Vocabulary & Expressions","Lesson 3 · Grammar & Expressions","Lesson 4 · Vocabulary & Song","Lesson 5 · Conversation & Grammar","Lesson 6 · Cross-curricular","Lesson 9 · Literature 2"],"grammar":[{"profile":"asas","title":"as ... as：表达一样或不一样","rule":"as + 形容词原级 + as表示同样；not as ... as表示不如。中间不用比较级。","scene":"比较运动员，表达健康需要","examples":[{"en":"Paul is as strong as Mike.","zh":"保罗和迈克一样强壮。"},{"en":"Alex is not as stro :[],"grammar":[{"profile":"purpose","title":"to + 动词原形：解释做一件事的目的","rule":"先说去哪里或做什么，再用to + 动词原形说明为了什么。问Why时也可以用To ...作简短回答。","scene":"准备课堂项目：主题拓展","examples":[{"en":"We work together to finish our science project.","zh":"我们一起合作完成科学项目。"},{"en":"I revise my work to make it clearer.","zh":"我修改自己的作品，让它更清楚。"}],"task":"用to说明你请求反馈是为了改进项目。","answer":"I ask for feedback to improve my project.","correct":"I go to the library to read.","incorrect":"I go to the library to reading.","reason":"表示目的的不定式to后用动词原形。"}],"senses":[{"word":"subject","meanings":[{"meaning":"名词·学科","icon":"📚","scene":"选择学校课程","en":"Science is my favorite subject.","zh":"科学是我最喜欢的学科。"},{"meaning":"名词·主语","icon":"✏️","scene":"标出句子主语","en":"In \"Birds fly,\" the subject is \"Birds.\"","zh":"在“Birds fly”中，主语是“Birds”。"}]}]},{"id":"P_L3_U07","material":"Power Up","level":"3","no":7,"title":"Unit 7 · When I Grow Up","low":false,"note":"本包缺少该单元原始课次句型；以下为围绕单元主题编写的拓展，不标为教材原有语法。","kind":"主题拓展","lessons":[],"grammar":[{"profile":"goingto","title":"be going to：介绍计划与打算","rule":"am/is/are going to + 动词原形；表示打算成为某职业时用be going to be。","scene":"介绍职业愿望：主题拓展","examples":[{"en":"I am going to be an engineer.","zh":"我打算成为一名工程师。"},{"en":"I am going to practise my skills every week.","zh":"我打算每周练习技能。"}],"task":"把职业换成artist，介绍你的计划。","answer":"I am going to be an artist.","correct":"She is going to be an artist.","incorrect":"She going to be an artist.","reason":"going to前需要与主语对应的be动词。"}],"senses":[{"word":"patient","meanings":[{"meaning":"形容词·有耐心的","icon":"⏳","scene":"老师耐心等待回答","en":"Our teacher is patient.","zh":"我们的老师很有耐心。"},{"meaning":"名词·病人","icon":"🏥","scene":"医生照顾病人","en":"The doctor is helping a patient.","zh":"医生正在帮助一位病人。"}]}]},{"id":"P_L3_U08","material":"Power Up","level":"3","no":8,"title":"Unit 8 · City Break","low":false,"note":"本包缺少该单元原始课次句型；以下为围绕单元主题编写的拓展，不标为教材原有语法。","kind":"主题拓展","lessons":[],"grammar":[{"profile":"direction","title":"方向介词与指令：把路线说清楚","rule":"across表示从一侧到另一侧，through表示从内部穿过，past表示经过；配合walk、go、turn组织路线。 ":"What do you like to do? I like to draw.","zh":"你喜欢做什么？我喜欢画画。"},{"en":"Do you like soup? No, I don't. I like pizza.","zh":"你喜欢汤吗？不，我不喜欢。我喜欢比萨。"}],"task":"用I like to介绍自己喜欢游泳。","answer":"I like to swim.","correct":"Does he like apples?","incorrect":"Does he likes apples?","reason":"Does已经承担人称变化，后面的like要用原形。"},{"profile":"can","title":"can / can't：表达能力或许可","rule":"can表示能、会，也可在场景中表示允许；can't表示不能或不允许。后接动词原形；Can ...?用于提问，简答用can/can't。","scene":"介绍宠物能做什么","examples":[{"en":"My rabbit can jump.","zh":"我的兔子会跳。"},{"en":"Can your bird fly? Yes, it can.","zh":"你的鸟会飞吗？是的。"}],"task":"说你的猫会爬。","answer":"My cat can climb.","correct":"She can swim.","incorrect":"She can swims.","reason":"can后面用动词原形。"}],"senses":[{"word":"square","meanings":[{"meaning":"名词·正方形","icon":"🟪","scene":"纸上画正方形","en":"Draw a square on the paper.","zh":"在纸上画一个正方形。"},{"meaning":"名词·广场","icon":"🏙️","scene":"市中心的广场","en":"We met in the town square.","zh":"我们在小镇广场见面。"}]},{"word":"cook","meanings":[{"meaning":"名词·厨师","icon":"👨‍🍳","scene":"厨房里的厨师","en":"My uncle is a cook.","zh":"我的叔叔是一名厨师。"},{"meaning":"动词·烹饪","icon":"🍳","scene":"一起准备晚餐","en":"We cook dinner together.","zh":"我们一起做晚饭。"}]}]},{"id":"R_L1_U03","material":"Reach Higher","level":"1","no":3,"title":"Unit 3 · My Life","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1-16（话题课）","Lesson 19-20（口语训练课）"],"grammar":[{"profile":"progressive","title":"现在进行时：描述此刻正在做什么","rule":"结构是am/is/are + 动词-ing；疑问句把be动词提前。根据主语选择am、is或are。","scene":"给校园活动照片配音","examples":[{"en":"What are you doing? I am reading.","zh":"你正在做什么？我正在阅读。"},{"en":"My friend is drawing in the art room.","zh":"我的朋友正在美术教室画画。"}],"task":"用They介绍两个孩子正在写字。","answer":"They are writing.","correct":"She is swimming.","incorrect":"She swimming.","reason":"进行时不能漏掉be动词；不是把每个动词加-ing就成句。"},{"profile":"any","title":"some / any：检查有没有物品","rule":"any常见于疑问、否定句，后接可数复数或不可数名词；some常见于肯定句以及期待肯定回答的请求、提议。","scene":"准备体育课用品","examples":[{"en":"Do you have a basketball? Yes, I do.","zh": ns":["Lesson 1-16（话题课）","Lesson 19-20（口语训练课）"],"grammar":[{"profile":"sequence","title":"顺序表达：把步骤讲完整","rule":"用First、Next、Then、Last/Finally串联完整句子。描述习惯步骤用一般现在时；发指令时用动词原形。","scene":"讲解制作沙拉的步骤","examples":[{"en":"First, I wash the vegetables. Next, I cut them.","zh":"首先，我洗蔬菜。接着，我把它们切好。"},{"en":"Last, I put them in a bowl and make a salad.","zh":"最后，我把它们放进碗里，做成沙拉。"}],"task":"用First和Next说先种种子，再浇水。","answer":"First, I plant a seed. Next, I water it.","correct":"First, I wash the carrots.","incorrect":"First, wash I the carrots.","reason":"叙述句保持主语I在动词wash前；指令可以说First, wash the carrots。"}],"senses":[{"word":"root","meanings":[{"meaning":"名词·植物的根","icon":"🌱","scene":"植物根部吸水","en":"The roots absorb water.","zh":"根吸收水分。"},{"meaning":"名词·根源","icon":"🧩","scene":"讨论问题的原因","en":"We need to find the root of the problem.","zh":"我们需要找到问题的根源。"}]},{"word":"water","meanings":[{"meaning":"名词·水","icon":"💧","scene":"杯子里的水","en":"There is some water in the glass.","zh":"杯子里有一些水。"},{"meaning":"动词·浇水","icon":"🌱","scene":"孩子给花浇水","en":"I water the flowers every day.","zh":"我每天给花浇水。"}]}]},{"id":"R_L2_U03","material":"Reach Higher","level":"2","no":3,"title":"Unit 3 · Is It Spring Yet","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1-16（话题课）","Lesson 19-20（口语训练课）"],"grammar":[{"profile":"weather","title":"It is ...与Let's ...：描述天气并安排活动","rule":"天气用It is + 形容词，如sunny、rainy、cold；季节前常用in；Let's后接动词原形提出共同活动。","scene":"按季节选择衣服","examples":[{"en":"What's the weather like in winter? It is cold.","zh":"冬天天气怎么样？很冷。"},{"en":"I wear a scarf in winter. I can play in the snow.","zh":"我冬天戴围巾。我可以在雪里玩。"}],"task":"说夏天很热，你穿T恤。","answer":"It is hot in summer. I wear a T-shirt.","correct":"It is rainy today.","incorrect":"It rainy today.","reason":"天气形容词前需要is。"}],"senses":[{"word":"spring","meanings":[{"meaning":"名词·春天","icon":"🌸","scene":"春天花开","en":"Flowers grow in spring.","zh":"花儿在春天生长。"},{"meaning":"名词·弹簧","icon":"🌀","scene":"玩具里的弹簧","en":"This toy has a spring inside.","zh":"这个玩具里面有一个弹簧。"},{"meaning":"名词·泉水、泉","icon":"💧","scene":"山间涌出的泉水","en":"Water comes from a mountain spring.","zh":"水来自山泉。"}]},{"word":"cold","meanings":[{"meaning":"形容词·冷的","icon":"❄️","scene":"下雪时穿上外套","en":"It is cold today.","zh":"今天很冷。"},{"meaning":"名词·感冒","icon":"🤧","scene":"孩子感冒了","en":"I have a cold.","zh":"我感冒了。"}]}]},{"id":"R_L3_U01","material":"Reach Higher","level":"3","no":1,"title":"Unit 1 · I Like It Here","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1-16（话题课）","Lesson 19-20（口语训练课）"],"grammar":[{"profile":"routine","title":"一般现在时：介绍习惯、工作与作息","rule":"I/you/we/they用动词原形；he/she/it用第三人称单数形式。问句用Do/Does，后接动词原形。","scene":"介绍社区里的人与地点","examples":[{"en":"She goes to the bakery to buy bread.","zh":"她去面包店买面包。"},{"en":"The bakery is beside the library.","zh":"面包店在图书馆旁边。"}],"task":"用He开头说他去商店买麦片。","answer":"He goes to the store to buy cereal.","correct":"He goes to school at seven.","incorrect":"He go to school at seven.","reason":"第三人称单数肯定句需要goes；Does he go中的go仍用原形。"},{"profile":"place","title":"位置介词：用句子说明在哪里","rule":"用Where is询问一个物品；用in、on、under、next to说明位置。多个物品用Where are ...? / They are ...。","scene":"在社区地图上标位置","examples":[{"en":"The bakery is behind the library.","zh":"面包店在图书馆后面。"},{"en":"The restaurant is between the store and the library.","zh":"餐馆在商店和图书馆之间。"}],"task":"用in front of说公交车在学校前面。","answer":"The bus is in front of the school.","correct":"The crayon is under the desk.","incorrect":"The crayon under the desk.","reason":"描述位置也需要is或are，不能只写物品和介词。"}],"senses":[{"word":"store","meanings":[{"meaning":"名词·商店","icon":"🏪","scene":"去商店买东西","en":"She goes to the store.","zh":"她去商店。"},{"meaning":"动词·储存","icon":"📦","scene":"把食物存放在盒子里","en":"We store food in these boxes.","zh":"我们把食物储存在这些盒子里。"}]}]},{"id":"R_L3_U02","material":"Reach Higher","level":"3","no":2,"title":"Unit 2 · Jobs People Do","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1-16（话题课）","Lesson 19-20（口语训练课）"],"grammar":[{"profile":"routine","title":"一般现在时：介绍习惯、工作与作息","rule":"I/you/we/they用动词原形；he/she/it用第三人称单数形式。问句用Do/Does，后接动词原形。","scene":"采访社区职业","examples":[{"en":"What does a baker do? A baker makes bread.","zh":"面包师做什么？面包师制作面包。"},{"en":"What does a doctor need? A doctor needs tools.","zh":"医生需要什么？医生需要工具。"}],"task":"用A teacher开头，说老师在学校工作。","answer":"A teacher works at a school.","correct":"He goes to school at seven.","incorrect":"He go to school at seven.","reason":"第三人称单数肯定句需要goes；Does he go中的go仍用原形。"},{"profile":"wantbe","title":"want to be：表达想成为的职业","rule":"want to be + a/an + 职业；第三人称单数用wants to be。想做某事用want to + 动词原形。","scene":"介绍自己未来想做的职业","examples":[{"en":"I want to be a pilot.","zh":"我想成为飞行员。"},{"en":"She wants to be a writer.","zh":"她想成为作家。"}],"task":"说你的哥哥想成为消防员。","answer":"My brother wants to be a firefighter.","correct":"She wants to be a writer.","incorrect":"She wants be a writer.","reason":"want后用to be，职业单数名词前通常要a/an。"}],"senses":[{"word":"play","meanings":[{"meaning":"动词·玩耍","icon":"🧸","scene":"孩子和玩具一起玩","en":"The children play with their toys.","zh":"孩子们玩玩具。"},{"meaning":"搭配·演奏乐器","icon":"🎹","scene":"孩子弹钢琴","en":"She plays the piano.","zh":"她弹钢琴。"},{"meaning":"名词·戏剧","icon":"🎭","scene":"观众看舞台剧","en":"We watched a school play.","zh":"我们看了一出校园剧。"}]},{"word":"pen","meanings":[{"meaning":"名词·笔","icon":"🖊️","scene":"孩子拿笔写名字","en":"Please write your name with a pen.","zh":"请用笔写下你的名字。"},{"meaning":"名词·围栏圈地","icon":"🐑","scene":"绵羊待在围栏中","en":"The sheep are in a pen.","zh":"绵羊在围栏里。"}]}]},{"id":"R_L3_U03","material":"Reach Higher","level":"3","no":3,"title":"Unit 3 · The Sun and Moon","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1-16（话题课）","Lesson 19-20（口语训练课）"],"grammar":[{"profile":"timeprep","title":"in / on / at：把活动放进时间或地点","rule":"常用in the morning/afternoon，at night/at seven，on Monday；地点搭配随场景选择，如in the park。","scene":"介绍一天里的活动","examples":[{"en":"I go to school in the morning.","zh":"我早上去上学。"},{"en":"I go to bed at nine o'clock at night.","zh":"我晚上九点睡觉。"}],"task":"用in和at分别说下午做作业、六点吃晚饭。","answer":"I do homework in the afternoon. I have dinner at six.","correct":"I get up at seven.","incorrect":"I get up in seven o'clock.","reason":"具体钟点前用at。"}],"senses":[{"word":"light","meanings":[{"meaning":"名词·光","icon":"☀️","scene":"阳光照进房间","en":"Light comes through the window.","zh":"光从窗户照进来。"},{"meaning":"名词·灯","icon":"💡","scene":"打开台灯","en":"Please turn on the light.","zh":"请打开灯。"},{"meaning":"形容词·轻的","icon":"🎒","scene":"轻松提起书包","en":"This bag is light.","zh":"这个书包很轻。"}]},{"word":"take","meanings":[{"meaning":"动词·拿走、带走","icon":"🎒","scene":"出门时带伞","en":"Take your umbrella with you.","zh":"带上你的雨伞。"},{"meaning":"动词·花费时间","icon":"🕐","scene":"钟表显示路程用时","en":"The trip takes two hours.","zh":"这段旅程需要两小时。"},{"meaning":"搭配·乘坐","icon":"🚌","scene":"孩子坐公交上学","en":"I take the bus to school.","zh":"我乘公共汽车上学。"}]}]},{"id":"R_L4_U01","material":"Reach Higher","level":"4","no":1,"title":"Unit 1 · My Family","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1（话题课1（第1循环））","Lesson 2（话题课2（第1循环））","Lesson 3（话题课3（第1循环））","Lesson 4（话题课4（第2循环））","Lesson 5（话题课5（第2循环））","Lesson 6（话题课6（第2循环））","Lesson 7（写作训练课）"],"grammar":[{"profile":"plural","title":"名词单复数：让数量、代词与句子一致","rule":"可数名词表示多个时通常用复数；child→children，country→countries，valley→valleys。专有名词开头大写。","scene":"介绍全家人的共同活动","examples":[{"en":"My brother helps me. My parents help me, too.","zh":"我哥哥帮助我。我的父母也帮助我。"},{"en":"There are three children in our extended family.","zh":"我们的大家庭里有三个孩子。"}],"task":"用two children说两个孩子一起玩。","answer":"Two children play together.","correct":"There are two children.","incorrect":"There are two childs.","reason":"child的复数是不规则形式children。"}],"senses":[{"word":"play","meanings":[{"meaning":"动词·玩耍","icon":"🧸","scene":"孩子和玩具一起玩","en":"The children play with their toys.","zh":"孩子们玩玩具。"},{"meaning":"搭配·演奏乐器","icon":"🎹","scene":"孩子弹钢琴","en":"She plays the piano.","zh":"她弹钢琴。"},{"meaning":"名词·戏剧","icon":"🎭 er has fur, but an alligator has scales.","correct":"Water is scarce, so animals move away.","incorrect":"Because water is scarce, so animals move away.","reason":"同一因果结构通常选because或so其中一种。"}],"senses":[{"word":"scale","meanings":[{"meaning":"名词·鳞片","icon":"🐟","scene":"鱼身上的鳞片","en":"Fish have scales.","zh":"鱼有鳞片。"},{"meaning":"名词·比例尺","icon":"🗺️","scene":"根据地图计算距离","en":"Use the map scale to find the distance.","zh":"用地图比例尺计算距离。"}]},{"word":"mouth","meanings":[{"meaning":"名词·嘴","icon":"🙂","scene":"张开嘴巴","en":"Open your mouth.","zh":"张开你的嘴。"},{"meaning":"名词·河口","icon":"🏞️","scene":"河流流入大海","en":"The river mouth is near the coast.","zh":"河口在海岸附近。"}]}]},{"id":"R_L4_U06","material":"Reach Higher","level":"4","no":6,"title":"Unit 6 · Up in the Air","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1（话题课1（第1循环））","Lesson 2（话题课2（第1循环））","Lesson 3（话题课3（第1循环））","Lesson 4（话题课4（第2循环））","Lesson 5（话题课5（第2循环））","Lesson 6（话题课6（第2循环））","Lesson 7（写作训练课）"],"grammar":[{"profile":"question","title":"疑问句：把想了解的信息问出来","rule":"be动词问句把am/is/are提前；一般现在时行为动词常用Do/Does；What/Where/How等放在问题开头。","scene":"采访朋友喜欢的天气","examples":[{"en":"Wind can blow leaves away.","zh":"风可以把叶子吹走。"},{"en":"What can wind blow away? It can blow leaves away.","zh":"风能吹走什么？它能吹走叶子。"}],"task":"把You like windy weather变成Do开头的问句。","answer":"Do you like windy weather?","correct":"Is it a pencil?","incorrect":"It is a pencil?","reason":"规范的一般疑问句把is移到主语it之前。"}],"senses":[{"word":"power","meanings":[{"meaning":"名词·动力、电力","icon":"⚡","scene":"风提供电力","en":"Wind can provide power.","zh":"风可以提供动力。"},{"meaning":"名词·权力","icon":"👑","scene":"统治者的权力","en":"The ruler had great power.","zh":"这位统治者拥有很大的权力。"}]},{"word":"cold","meanings":[{"meaning":"形容词·冷的","icon":"❄️","scene":"下雪时穿上外套","en":"It is cold today.","zh":"今天很冷。"},{"meaning":"名词·感冒","icon":"🤧","scene":"孩子感冒了","en":"I have a cold.","zh":"我感冒了。"}]}]},{"id":"R_L4_U07","material":"Reach Higher","level":"4","no":7,"title":"Unit 7 · Then and Now","low 话题课6（第2循环））","Lesson 7（写作训练课）"],"grammar":[{"profile":"compound","title":"连接词：让两个想法有清楚的关系","rule":"and连接并列信息，but表示转折，so表示结果；because引导原因。根据意思选择，不只是把句子接长。","scene":"解释生态平衡中的关系","examples":[{"en":"The river is low, so the animals have less water.","zh":"河水水位很低，所以动物能用的水更少了。"},{"en":"Some plants survive, but others die.","zh":"有些植物活了下来，但另一些死去了。"}],"task":"用so连接There is a drought和Water is scarce。","answer":"There is a drought, so water is scarce.","correct":"Water is scarce, so animals move away.","incorrect":"Because water is scarce, so animals move away.","reason":"同一因果结构通常选because或so其中一种。"},{"profile":"imperative","title":"祈使句：听懂并发出动作指令","rule":"用动词原形开头；通常省略you。Don't + 动词原形表示不要做某事；加please更礼貌。","scene":"给生态观察员发出指令","examples":[{"en":"Show me the river on the map.","zh":"给我指出地图上的河。"},{"en":"Point to the animal at the top of the food chain.","zh":"指出食物链顶端的动物。"}],"task":"请朋友观察这些植物。","answer":"Look at these plants, please.","correct":"Open your book, please.","incorrect":"Opens your book, please.","reason":"指令开头使用动词原形open。"}],"senses":[{"word":"balance","meanings":[{"meaning":"名词·平衡","icon":"⚖️","scene":"保持身体或生态平衡","en":"The ecosystem needs balance.","zh":"生态系统需要平衡。"},{"meaning":"动词·使平衡","icon":"🤸","scene":"把书顶在头上","en":"Can you balance a book on your head?","zh":"你能把一本书平衡地顶在头上吗？"}]},{"word":"level","meanings":[{"meaning":"名词·水平、高度","icon":"📏","scene":"河流的水位","en":"The water level is low.","zh":"水位很低。"},{"meaning":"形容词·平坦的","icon":"🏕️","scene":"选择平坦地面搭帐篷","en":"Put the tent on level ground.","zh":"把帐篷搭在平坦的地面上。"}]}]},{"id":"R_L6_U03","material":"Reach Higher","level":"6","no":3,"title":"Unit 3 · Life in the Soil","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1（话题课1（第1循环））","Lesson 2（话题课2（第1循环））","Lesson 3（话题课3（第1循环））","Lesson 4（话题课4（第2循环））","Lesson 5（话题课5（第2循环））","Lesson 6（话题课6（第2循环））","Lesson 7（写作训练课）"],"grammar":[{"profile":"countable","title":"可数与不可数：把数量说准确","rule":"seeds等可数名词可用数字、many；water、soil、sand等在本语境下不可数，用some/much或合适的计量表达  and my aunt weave baskets.","zh":"我的妈妈和阿姨编篮子。"},{"en":"My grandfather performs music at the ceremony.","zh":"我的祖父在仪式上演奏音乐。"}],"task":"用My brother and I作主语，说你们制作陶器。","answer":"My brother and I make pottery.","correct":"My mother and my aunt weave baskets.","incorrect":"My mother and my aunt weaves baskets.","reason":"由and连接的两个参与者在这里构成复数主语，使用weave。"}],"senses":[{"word":"craft","meanings":[{"meaning":"名词·手工艺","icon":"🧶","scene":"传统手工艺活动","en":"We learn a traditional craft.","zh":"我们学习一种传统手工艺。"},{"meaning":"动词·精心制作","icon":"🏺","scene":"工匠制作陶碗","en":"She crafts bowls from clay.","zh":"她用黏土精心制作碗。"}]},{"word":"express","meanings":[{"meaning":"动词·表达","icon":"💬","scene":"用音乐表达情感","en":"Music helps us express our feelings.","zh":"音乐帮助我们表达感受。"},{"meaning":"形容词·快速的、特快的","icon":"🚆","scene":"选择特快列车","en":"We took an express train.","zh":"我们乘坐了一班特快列车。"}]}]},{"id":"R_L7_U02","material":"Reach Higher","level":"7","no":2,"title":"Unit 2 · Animal Intelligence","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1（话题课1（第1循环））","Lesson 2（话题课2（第1循环））","Lesson 3（话题课3（第1循环））","Lesson 4（话题课4（第2循环））","Lesson 5（话题课5（第2循环））","Lesson 6（话题课6（第2循环））","Lesson 7（写作训练课）"],"grammar":[{"profile":"compound","title":"连接词：让两个想法有清楚的关系","rule":"and连接并列信息，but表示转折，so表示结果；because引导原因。根据意思选择，不只是把句子接长。","scene":"用证据讨论动物智力","examples":[{"en":"The animal faces a problem, but it finds a solution.","zh":"这只动物遇到了问题，但它找到了解决办法。"},{"en":"I agree because its behavior shows a useful strategy.","zh":"我赞同，因为它的行为展示了一种有用的策略。"}],"task":"用so连接The prey hides和The predator cannot see it。","answer":"The prey hides, so the predator cannot see it.","correct":"Water is scarce, so animals move away.","incorrect":"Because water is scarce, so animals move away.","reason":"同一因果结构通常选because或so其中一种。"},{"profile":"sentencetypes","title":"不同句式：陈述、询问、指令与感叹","rule":"陈述句提供信息，问句索取信息，祈使句给指令，感叹句表达强烈感受。语序和标点与目的对应。","scene":"用不同句式介绍同一种动物","examples":[{"en":"The animal can solve a problem.","zh":"这种动物能够解决问题。"},{ "routine","title":"一般现在时：介绍习惯、工作与作息","rule":"I/you/we/they用动词原形；he/she/it用第三人称单数形式。问句用Do/Does，后接动词原形。","scene":"解释可再生能源的工作方式","examples":[{"en":"The wind turns the blades and generates electricity.","zh":"风带动叶片转动并产生电能。"},{"en":"Wind turbines convert wind energy into electrical energy.","zh":"风力涡轮机把风能转化为电能。"}],"task":"把A turbine generates electricity改成Turbines开头。","answer":"Turbines generate electricity.","correct":"He goes to school at seven.","incorrect":"He go to school at seven.","reason":"第三人称单数肯定句需要goes；Does he go中的go仍用原形。"}],"senses":[{"word":"power","meanings":[{"meaning":"名词·动力、电力","icon":"⚡","scene":"风提供电力","en":"Wind can provide power.","zh":"风可以提供动力。"},{"meaning":"名词·权力","icon":"👑","scene":"统治者的权力","en":"The ruler had great power.","zh":"这位统治者拥有很大的权力。"}]},{"word":"current","meanings":[{"meaning":"名词·水流、电流","icon":"🌊","scene":"河里的水流","en":"The river current is strong.","zh":"河里的水流很急。"},{"meaning":"形容词·当前的","icon":"🕐","scene":"谈论当前的计划","en":"What is your current plan?","zh":"你目前的计划是什么？"}]}]},{"id":"R_L7_U05","material":"Reach Higher","level":"7","no":5,"title":"Unit 5 · Invaders!","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1（话题课1（第1循环））","Lesson 2（话题课2（第1循环））","Lesson 3（话题课3（第1循环））","Lesson 4（话题课4（第2循环））","Lesson 5（话题课5（第2循环））","Lesson 6（话题课6（第2循环））","Lesson 7（写作训练课）"],"grammar":[{"profile":"possess","title":"名词所有格：说明东西属于谁","rule":"人名后加's表示所属；Whose ...?询问主人。所有格后可以接物品，也可在语境明确时省略物品。","scene":"记录实验中的霉菌样本","examples":[{"en":"The scientist's experiment compares two environments.","zh":"这位科学家的实验比较了两种环境。"},{"en":"The students' samples are in separate containers.","zh":"学生们的样本放在不同容器中。"}],"task":"用scientists'说科学家们的记录展示了变化。","answer":"The scientists' records show changes.","correct":"It is Jim's bike.","incorrect":"It is Jim bike.","reason":"表示吉姆的自行车，需要Jim's。复数s结尾名词用s'，children用children's。"}],"senses":[{"word":"contain","meanings":[{"meaning":"动词·包含","icon":"📦","scene":"盒子里装有样本","en":"The box contains two samples.","zh": ,{"id":"R_L7_U07","material":"Reach Higher","level":"7","no":7,"title":"Unit 7 · Moving Through Space","low":false,"note":"本单元原记录侧重词义学习；以下语法为配合主题新增的应用句型。","kind":"主题拓展","lessons":["Lesson 1（话题课1（第1循环））","Lesson 2（话题课2（第1循环））","Lesson 3（话题课3（第1循环））","Lesson 4（话题课4（第2循环））","Lesson 5（话题课5（第2循环））","Lesson 6（话题课6（第2循环））","Lesson 7（写作训练课）"],"grammar":[{"profile":"measure","title":"How + 形容词与数量单位：解释测量结果","rule":"How long询问长度，How large询问范围大小，How fast询问速度；数值后接对应单位，多个可数单位用复数。","scene":"解释运动测量结果：句型拓展","examples":[{"en":"The car travels ten meters in two seconds.","zh":"这辆车在两秒内行驶了十米。"},{"en":"Its average speed is five meters per second.","zh":"它的平均速度是每秒五米。"}],"task":"路程为十二米、时间为三秒，用average speed说结果。","answer":"Its average speed is four meters per second.","correct":"The average speed is five meters per second.","incorrect":"The average speed is five meter per seconds.","reason":"five meters用复数；per second中的second按一个单位用单数。"}],"senses":[{"word":"scale","meanings":[{"meaning":"名词·鳞片","icon":"🐟","scene":"鱼身上的鳞片","en":"Fish have scales.","zh":"鱼有鳞片。"},{"meaning":"名词·比例尺","icon":"🗺️","scene":"根据地图计算距离","en":"Use the map scale to find the distance.","zh":"用地图比例尺计算距离。"}]}]},{"id":"R_L7_U08","material":"Reach Higher","level":"7","no":8,"title":"Unit 8 · Saving a Piece of the World","low":false,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["Lesson 1（话题课1（第1循环））","Lesson 2（话题课2（第1循环））","Lesson 3（话题课3（第1循环））","Lesson 4（话题课4（第2循环））","Lesson 5（话题课5（第2循环））","Lesson 6（话题课6（第2循环））","Lesson 7（写作训练课）"],"grammar":[{"profile":"pastfuture","title":"过去与将来：把时间线说清楚","rule":"已经发生的事用过去式；计划用be going to + 原形；将来预测、承诺等可用will + 原形。通过时间词判断。","scene":"回顾保护行动并提出新计划","examples":[{"en":"The volunteers protected the ancient site.","zh":"志愿者们保护了这处古迹。"},{"en":"They will record its history for the next generation.","zh":"他们将为下一代记录它的历史。"}],"task":"用didn't说志愿者们没有移动那些物件。","answer":"The volunteers didn't move the objects.","correct":"We will visit the site tomorrow.","incorrect":"We will visited the site tomorrow.","reason":"will后面接动词原形visit。"}],"senses":[{"word":"value","meanings":[{"meaning":"名词·价值","icon":"💎","scene":"评估一件文物","en":"What is the value of this artifact?","zh":"这件文物的价值是多少？"},{"meaning":"动词·珍视","icon":"🤝","scene":"珍惜朋友的帮助","en":"I value your help.","zh":"我很珍惜你的帮助。"}]},{"word":"object","meanings":[{"meaning":"名词·物品","icon":"🏺","scene":"博物馆里陈列的物品","en":"This ancient object is made of clay.","zh":"这件古代物品是黏土做的。"},{"meaning":"动词·反对","icon":"🙋","scene":"对一个计划提出反对","en":"Some people object to the plan.","zh":"有些人反对这个计划。"}]}]},{"id":"A_L0_U01","material":"LingoAce（自研）","level":"0","no":1,"title":"Unit 1 · Hello!","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"be","title":"am / is / are：介绍身份、年龄与状态","rule":"I用am；he/she/it和单数用is；you/we/they和复数用are。年龄直接用I am five，不用I have five。","scene":"初次见面介绍自己","examples":[{"en":"Hello! I am Mia.","zh":"你好！我是米娅。"},{"en":"How old are you? I am five.","zh":"你几岁？我五岁。"}],"task":"把名字换成Ben、年龄换成four，介绍自己。","answer":"Hello! I am Ben. I am four.","correct":"I am five years old.","incorrect":"I have five years old.","reason":"英语介绍年龄用be动词。"}],"senses":[]},{"id":"A_L0_U02","material":"LingoAce（自研）","level":"0","no":2,"title":"Unit 2 · My Face","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"imperative","title":"祈使句：听懂并发出动作指令","rule":"用动词原形开头；通常省略you。Don't + 动词原形表示不要做某事；加please更礼貌。","scene":"和玩偶一起认识五官","examples":[{"en":"Touch your nose.","zh":"摸摸你的鼻子。"},{"en":"Touch your ears, then touch your mouth.","zh":"摸摸你的耳朵，再摸摸你的嘴。"}],"task":"请朋友摸摸眼睛，用Touch开头。","answer":"Touch your eyes.","correct":"Open your book, please.","incorrect":"Opens your book, please.","reason":"指令开头使用动词原形open。"},{"profile":"has","title":"have / has与Does ... have：说明特征","rule":"单数第三人称肯定句用has；其他主语常用have。Does问句及doesn't否定句后用have。","scene":"为怪物画五官并介绍","examples":[{"en":"She has six eyes.","zh":"她有六只眼睛。"},{"en":"He has two mouths.","zh":"他有两张嘴。"}],"task":"介绍一个有八只耳朵的怪物，用It开头。","answer":"It has eight ears.","correct":"Does it have wings?","incorrect":"Does it has wings?","reason":"Does后恢复为have。"}],"senses":[{"word":"mouth","meanings":[{"meaning":"名词·嘴","icon":"🙂","scene":"张开嘴巴","en":"Open your mouth.","zh":"张开你的嘴。"},{"meaning":"名词·河口","icon":"🏞️","scene":"河流流入大海","en":"The river mouth is near the coast.","zh":"河口在海岸附近。"}]}]},{"id":"A_L0_U03","material":"LingoAce（自研）","level":"0","no":3,"title":"Unit 3 · Yummy Fruit","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"adjective","title":"形容词：把颜色、大小和状态说具体","rule":"形容词可以放在名词前，也可以放在be动词后；英语形容词本身通常不随名词复数变化。","scene":"给水果画涂颜色","examples":[{"en":"It is a yellow pear.","zh":"这是一个黄色的梨。"},{"en":"It is a green kiwi.","zh":"这是一个绿色的猕猴桃。"}],"task":"用red和watermelon介绍一个红色的西瓜。","answer":"It is a red watermelon.","correct":"The plants are green.","incorrect":"The plants are greens.","reason":"描述颜色时形容词green不加-s。greens另有绿叶蔬菜的名词用法。"}],"senses":[{"word":"blue","meanings":[{"meaning":"形容词·蓝色的","icon":"🔵","scene":"蓝色的天空","en":"The sky is blue.","zh":"天空是蓝色的。"},{"meaning":"形容词·忧伤的，非正式","icon":"😔","scene":"想念朋友而难过","en":"I feel blue because I miss my friend.","zh":"我因为想念朋友而感到忧伤。"}]},{"word":"green","meanings":[{"meaning":"形容词·绿色的","icon":"🟢","scene":"绿色的书包","en":"My bag is green.","zh":"我的书包是绿色的。"},{"meaning":"形容词·未成熟的","icon":"🍌","scene":"还未成熟的香蕉","en":"These bananas are still green.","zh":"这些香蕉还没熟。"}]}]},{"id":"A_L0_U04","material":"LingoAce（自研）","level":"0","no":4,"title":"Unit 4 · My Online Class","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"imperative","title":"祈使句：听懂并发出动作指令","rule":"用动词原形开头；通常省略you。Don't + 动词原形表示不要做某事；加please更礼貌。","scene":"跟随指令准备线上课堂","examples":[{"en":"Open your book.","zh":"打开你的书。"},{"en":"Take out your pencil, then close your book.","zh":"拿出铅笔，然后合上书。"}],"task":"请朋友拿出蜡笔。","answer":"Take out your crayon.","correct":"Open your book, please.","incorrect":"Opens your book, please.","reason":"指令开头使用动词原形open。"}],"senses":[{"word":"book","meanings":[{"meaning":"名词·书","icon":"📖","scene":"桌上放着一本书","en":"This is my English book.","zh":"这是我的英语书。"},{"meaning":"动词·预订","icon":"🎫","scene":"出行前订车票","en":"We need to book our tickets.","zh":"我们需要预订车票。"}]},{"word":"pen","meanings":[{"meaning":"名词·笔","icon":"🖊️","scene":"孩子拿笔写名字","en":"Please write your name with a pen.","zh":"请用笔写下你的名字。"},{"meaning":"名词·围栏圈地","icon":"🐑","scene":"绵羊待在围栏中","en":"The sheep are in a pen.","zh":"绵羊在围栏里。"}]}]},{"id":"A_L0_U05","material":"LingoAce（自研）","level":"0","no":5,"title":"Unit 5 · My Toybox","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"article","title":"a / an / the：首次介绍与再次指代","rule":"首次介绍一个可数事物常用a/an；元音音素前用an；再次提到明确的同一事物常用the。看发音，不只看字母。","scene":"从玩具盒里猜玩具","examples":[{"en":"What's this? It is a ball.","zh":"这是什么？这是一个球。"},{"en":"It is an alien. Let's find the alien.","zh":"这是一个外星人。我们来找那个外星人吧。"}],"task":"用a介绍一只泰迪熊。","answer":"It is a teddy bear.","correct":"It is an alien.","incorrect":"It is a alien.","reason":"alien以元音音素开头，用an。"}],"senses":[{"word":"play","meanings":[{"meaning":"动词·玩耍","icon":"🧸","scene":"孩子和玩具一起玩","en":"The children play with their toys.","zh":"孩子们玩玩具。"},{"meaning":"搭配·演奏乐器","icon":"🎹","scene":"孩子弹钢琴","en":"She plays the piano.","zh":"她弹钢琴。"},{"meaning":"名词·戏剧","icon":"🎭","scene":"观众看舞台剧","en":"We watched a school play.","zh":"我们看了一出校园剧。"}]},{"word":"game","meanings":[{"meaning":"名词·游戏","icon":"🎲","scene":"朋友玩桌游","en":"Let's play a board game.","zh":"我们来玩桌游吧。"},{"meaning":"名词·一场比赛","icon":"⚽","scene":"球场上的足球赛","en":"We won the football game.","zh":"我们赢了这场足球比赛。"}]}]},{"id":"A_L0_U06","material":"LingoAce（自研）","level":"0","no":6,"title":"Unit 6 · Family","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"be","title":"am / is / are：介绍身份、年龄与状态","rule":"I用am；he/she/it和单数用is；you/we/they和复数用are。年龄直接用I am five，不用I have five。","scene":"介绍家人和他们的心情","examples":[{"en":"She is my grandma. She is happy.","zh":"她是我的奶奶。她很开心。"},{"en":"He is my brother. He is sad.","zh":"他是我的哥哥。他很难过。"}],"task":"介绍爸爸很开心，用He开头。","answer":"He is my dad. He is happy.","correct":"I am five years old.","incorrect":"I have five years old.","reason":"英语介绍年龄用be动词。"}],"senses":[]},{"id":"A_L0_U07","material":"LingoAce（自研）","level":"0","no":7,"title":"Unit 7 · Get Dressed","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"have","title":"have / don't have：介绍拥有与缺少的东西","rule":"I have后接物品；否定为I don't have。单数可数名词常需a/an，pants/shoes等常用复数形式。","scene":"收拾出门要穿的衣服","examples":[{"en":"I have a white shirt.","zh":"我有一件白衬衫。"},{"en":"I don't have black shoes.","zh":"我没有黑色的鞋子。"}],"task":"说自己有一条粉色连衣裙。","answer":"I have a pink dress.","correct":"I have a white shirt.","incorrect":"I have white shirt.","reason":"shirt是单数可数名词，此处需a。"}],"senses":[{"word":"dress","meanings":[{"meaning":"名词·连衣裙","icon":"👗","scene":"穿一条新裙子","en":"She has a new dress.","zh":"她有一条新连衣裙。"},{"meaning":"动词·穿衣","icon":"🧥","scene":"为天气选择穿着","en":"We dress warmly in winter.","zh":"冬天我们穿得暖和。"}]},{"word":"orange","meanings":[{"meaning":"名词·橙子","icon":"🍊","scene":"孩子剥一个橙子","en":"I am eating an orange.","zh":"我正在吃一个橙子。"},{"meaning":"形容词·橙色的","icon":"🟠","scene":"一辆橙色自行车","en":"My bike is orange.","zh":"我的自行车是橙色的。"}]}]},{"id":"A_L0_U08","material":"LingoAce（自研）","level":"0","no":8,"title":"Unit 8 · My Pets","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["句型1","句型2"],"grammar":[{"profile":"can","title":"can / can't：表达能力或许可","rule":"can表示能、会，也可在场景中表示允许；can't表示不能或不允许。后接动词原形；Can ...?用于提问，简答用can/can't。","scene":"给宠物展示动作","examples":[{"en":"The dog can run.","zh":"狗会跑。"},{"en":"The fish can swim, but it can't fly.","zh":"鱼会游泳，但不会飞。"}],"task":"说青蛙会跳。","answer":"The frog can jump.","correct":"She can swim.","incorrect":"She can swims.","reason":"can后面用动词原形。"}],"senses":[{"word":"fish","meanings":[{"meaning":"名词·鱼","icon":"🐟","scene":"水里游动的鱼","en":"The fish is swimming.","zh":"这条鱼正在游泳。"},{"meaning":"动词·钓鱼","icon":"🎣","scene":"在湖边钓鱼","en":"We fish by the lake.","zh":"我们在湖边钓鱼。"}]},{"word":"run","meanings":[{"meaning":"动词·跑","icon":"🏃","scene":"孩子在操场跑步","en":"I run in the playground.","zh":"我在操场跑步。"},{"meaning":"动词·经营、管理","icon":"🏪","scene":"一家人经营小商店","en":"My aunt runs a small shop.","zh":"我的阿姨经营一家小商店。"}]}]},{"id":"A_L1_U01","material":"LingoAce（自研）","level":"1","no":1,"title":"Unit 1 · Hello Friends!","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"question","title":"疑问句：把想了解的信息问出来","rule":"be动词问句把am/is/are提前；一般现在时行为动词常用Do/Does；What/Where/How等放在问题开头。","scene":"认识新同学","examples":[{"en":"What's your name? My name is Mia.","zh":"你叫什么名字？我叫米娅。"},{"en":"How old are you? I am seven.","zh":"你几岁？我七岁。"}],"task":"询问朋友的名字，再用自己的名字回答。","answer":"What's your name? My name is Ben.","correct":"Is it a pencil?","incorrect":"It is a pencil?","reason":"规范的一般疑问句把is移到主语it之前。"}],"senses":[{"word":"stand","meanings":[{"meaning":"动词·站立","icon":"🧍","scene":"孩子站起来","en":"Stand up, please.","zh":"请站起来。"},{"meaning":"名词·摊位","icon":"🍓","scene":"市场里的水果摊","en":"We bought fruit at the stand.","zh":"我们在摊位上买了水果。"}]}]},{"id":"A_L1_U02","material":"LingoAce（自研）","level":"1","no":2,"title":"Unit 2 · Our New School","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"question","title":"疑问句：把想了解的信息问出来","rule":"be动词问句把am/is/are提前；一般现在时行为动词常用Do/Does；What/Where/How等放在问题开头。","scene":"摸袋子猜文具","examples":[{"en":"What's this? It is a pencil.","zh":"这是什么？这是一支铅笔。"},{"en":"Is it a pen? No, it isn't. It is a pencil.","zh":"这是一支钢笔吗？不，它不是。它是一支铅笔。"}],"task":"猜到尺子，用Is it提问。","answer":"Is it a ruler?","correct":"Is it a pencil?","incorrect":"It is a pencil?","reason":"规范的一般疑问句把is移到主语it之前。"}],"senses":[{"word":"book","meanings":[{"meaning":"名词·书","icon":"📖","scene":"桌上放着一本书","en":"This is my English book.","zh":"这是我的英语书。"},{"meaning":"动词·预订","icon":"🎫","scene":"出行前订车票","en":"We need to book our tickets.","zh":"我们需要预订车票。"}]},{"word":"pen","meanings":[{"meaning":"名词·笔","icon":"🖊️","scene":"孩子拿笔写名字","en":"Please write your name with a pen.","zh":"请用笔写下你的名字。"},{"meaning":"名词·围栏圈地","icon":"🐑","scene":"绵羊待在围栏中","en":"The sheep are in a pen.","zh":"绵羊在围栏里。"}]}]},{"id":"A_L1_U03","material":"LingoAce（自研）","level":"1","no":3,"title":"Unit 3 · Let's Play!","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"possessiveadj","title":"his / her / your：介绍谁的名字和喜好","rule":"his表示他的，her表示她的，your表示你的；在这些表达中后接name、toy等名词。","scene":"介绍朋友最喜欢的玩具","examples":[{"en":"What is her name? Her name is Mia.","zh":"她叫什么名字？她叫米娅。"},{"en":"What is his favorite toy? His favorite toy is a train.","zh":"他最喜欢的玩具是什么？他最喜欢的玩具是火车。"}],"task":"用Her说她最喜欢的玩具是风筝。","answer":"Her favorite toy is a kite.","correct":"Her name is Mia.","incorrect":"She name is Mia.","reason":"she是主格代词；修饰name要用her。"}],"senses":[{"word":"train","meanings":[{"meaning":"名词·火车","icon":"🚆","scene":"火车驶入车站","en":"The train is at the station.","zh":"火车在车站。"},{"meaning":"动词·训练","icon":"🏃","scene":"运动员每天练习","en":"The athletes train every day.","zh":"运动员每天训练。"}]},{"word":"long","meanings":[{"meaning":"形容词·长的","icon":"🦒","scene":"长长的脖子","en":"The giraffe has a long neck.","zh":"长颈鹿有长长的脖子。"},{"meaning":"动词·渴望，常用long for","icon":"🏠","scene":"旅行很久后想回家","en":"After the long trip, I long for home.","zh":"长途旅行后，我渴望回家。"}]}]},{"id":"A_L1_U04","material":"LingoAce（自研）","level":"1","no":4,"title":"Unit 4 · Pet Show","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"place","title":"位置介词：用句子说明在哪里","rule":"用Where is询问一个物品；用in、on、under、next to说明位置。多个物品用Where are ...? / They are ...。","scene":"寻找躲起来的宠物","examples":[{"en":"The lizard is in the bag.","zh":"蜥蜴在包里。"},{"en":"The spider is under the bag, but the rat is on it.","zh":"蜘蛛在包下面，而老鼠在包上面。"}],"task":"把狗放在桌子下面，描述它的位置。","answer":"The dog is under the table.","correct":"The crayon is under the desk.","incorrect":"The crayon under the desk.","reason":"描述位置也需要is或are，不能只写物品和介词。"},{"profile":"likes","title":"一般现在时：表达喜好与询问喜好","rule":"I like；he/she/it likes。问句用Do/Does ... like；否定用don't/doesn't like。","scene":"分享宠物喜好","examples":[{"en":"I like dogs, but I don't like spiders.","zh":"我喜欢狗，但不喜欢蜘蛛。"},{"en":"Do you like cats? Yes, I do.","zh":"你喜欢猫吗？是的。"}],"task":"说自己也喜欢狗。","answer":"I like dogs, too.","correct":"Does he like apples?","incorrect":"Does he likes apples?","reason":"Does已经承担人称变化，后面的like要用原形。"}],"senses":[{"word":"duck","meanings":[{"meaning":"名词·鸭子","icon":"🦆","scene":"鸭子在水中游泳","en":"The duck is swimming.","zh":"鸭子正在游泳。"},{"meaning":"动词·迅速低头、俯身","icon":"🙇","scene":"低头躲开球","en":"Duck! A ball is coming!","zh":"快低头！球飞过来了！"}]}]},{"id":"A_L1_U05","material":"LingoAce（自研）","level":"1","no":5,"title":"Unit 5 · Shopping List","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"any","title":"some / any：检查有没有物品","rule":"any常见于疑问、否定句，后接可数复数或不可数名词；some常见于肯定句以及期待肯定回答的请求、提议。","scene":"购物前检查食物","examples":[{"en":"Do we have any carrots? Yes, we do.","zh":"我们有胡萝卜吗？是的，有。"},{"en":"We have twelve carrots, but we don't have any apples.","zh":"我们有十二根胡萝卜，但没有苹果。"}],"task":"用Do we have any询问家里有没有香蕉。","answer":"Do we have any bananas?","correct":"We don't have any apples.","incorrect":"We don't have any apple.","reason":"询问或否定有无苹果时一般用可数复数apples。"}],"senses":[{"word":"chicken","meanings":[{"meaning":"名词·鸡，可数","icon":"🐔","scene":"农场里有三只鸡","en":"There are three chickens on the farm.","zh":"农场里有三只鸡。"},{"meaning":"名词·鸡肉，通常不可数","icon":"🍽️","scene":"盘子里的一些鸡肉","en":"I would like some chicken.","zh":"我想要一些鸡肉。"}]}]},{"id":"A_L1_U06","material":"LingoAce（自研）","level":"1","no":6,"title":"Unit 6 · Free Time","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"routine","title":"一般现在时：介绍习惯、工作与作息","rule":"I/you/we/they用动词原形；he/she/it用第三人称单数形式。问句用Do/Does，后接动词原形。","scene":"安排一周的课外活动","examples":[{"en":"I play soccer on Saturdays.","zh":"我每周六踢足球。"},{"en":"Do you go swimming on Sundays? Yes, I do.","zh":"你每周日去游泳吗？是的。"}],"task":"说自己每周五唱歌。","answer":"I sing on Fridays.","correct":"He goes to school at seven.","incorrect":"He go to school at seven.","reason":"第三人称单数肯定句需要goes；Does he go中的go仍用原形。"}],"senses":[{"word":"play","meanings":[{"meaning":"动词·玩耍","icon":"🧸","scene":"孩子和玩具一起玩","en":"The children play with their toys.","zh":"孩子们玩玩具。"},{"meaning":"搭配·演奏乐器","icon":"🎹","scene":"孩子弹钢琴","en":"She plays the piano.","zh":"她弹钢琴。"},{"meaning":"名词·戏剧","icon":"🎭","scene":"观众看舞台剧","en":"We watched a school play.","zh":"我们看了一出校园剧。"}]}]},{"id":"A_L1_U07","material":"LingoAce（自研）","level":"1","no":7,"title":"Unit 7 · House","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"there","title":"There be：介绍有、没有与数量","rule":"一个或不可数事物用There is；多个用There are。提问用Is/Are there；否定用isn't/aren't。","scene":"当小导游介绍房间","examples":[{"en":"There is a sofa in the living room.","zh":"客厅里有一张沙发。"},{"en":"Are there any chairs? Yes, there are four chairs.","zh":"有椅子吗？有，有四把椅子。"}],"task":"用How many询问卧室里有多少盏灯。","answer":"How many lamps are there in the bedroom?","correct":"There are two chairs.","incorrect":"There is two chairs.","reason":"two chairs是复数，搭配are。"}],"senses":[{"word":"bed","meanings":[{"meaning":"名词·床","icon":"🛏️","scene":"睡在床上","en":"I sleep in my bed.","zh":"我睡在床上。"},{"meaning":"名词·花坛、种植床","icon":"🌷","scene":"花坛里开着花","en":"The flowers grow in a garden bed.","zh":"这些花长在花坛里。"}]}]},{"id":"A_L1_U08","material":"LingoAce（自研）","level":"1","no":8,"title":"Unit 8 · Get Dressed","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"progressive","title":"现在进行时：描述此刻正在做什么","rule":"结构是am/is/are + 动词-ing；疑问句把be动词提前。根据主语选择am、is或are。","scene":"根据穿着找到朋友","examples":[{"en":"Tom is wearing a red sweater.","zh":"汤姆正穿着一件红毛衣。"},{"en":"Is he wearing blue shoes? No, he isn't.","zh":"他正穿着蓝色的鞋子吗？不，他没有。"}],"task":"介绍Mia正穿着黄色T恤。","answer":"Mia is wearing a yellow T-shirt.","correct":"She is swimming.","incorrect":"She swimming.","reason":"进行时不能漏掉be动词；不是把每个动词加-ing就成句。"},{"profile":"demonstrative","title":"this / that / these / those：区分远近与数量","rule":"近处单个this，远处单个that；近处多个these，远处多个those。跟随其后的名词要匹配单复数。","scene":"挑选一件与多件衣物","examples":[{"en":"Do you like this hat? Yes, I do.","zh":"你喜欢这顶帽子吗？是的。"},{"en":"Do you like these shoes? No, I don't.","zh":"你喜欢这些鞋子吗？不，我不喜欢。"}],"task":"询问对方喜不喜欢近处的这条裙子。","answer":"Do you like this skirt?","correct":"Put those shoes in the closet.","incorrect":"Put that shoes in the closet.","reason":"shoes为复数，用those。"}],"senses":[{"word":"short","meanings":[{"meaning":"形容词·短的","icon":"📏","scene":"一支很短的铅笔","en":"This pencil is short.","zh":"这支铅笔很短。"},{"meaning":"形容词·个子矮的","icon":"🧍","scene":"比较两个人的身高","en":"The boy is short, but his brother is tall.","zh":"这个男孩个子矮，但他哥哥很高。"}]},{"word":"blue","meanings":[{"meaning":"形容词·蓝色的","icon":"🔵","scene":"蓝色的天空","en":"The sky is blue.","zh":"天空是蓝色的。"},{"meaning":"形容词·忧伤的，非正式","icon":"😔","scene":"想念朋友而难过","en":"I feel blue because I miss my friend.","zh":"我因为想念朋友而感到忧伤。"}]}]},{"id":"A_L2_U01","material":"LingoAce（自研）","level":"2","no":1,"title":"Unit 1 · Head to Toes","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"can","title":"can / can't：表达能力或许可","rule":"can表示能、会，也可在场景中表示允许；can't表示不能或不允许。后接动词原形；Can ...?用于提问，简答用can/can't。","scene":"玩身体动作挑战","examples":[{"en":"I can touch my toes.","zh":"我能摸到自己的脚趾。"},{"en":"Can she jump rope? Yes, she can.","zh":"她会跳绳吗？是的，她会。"}],"task":"说自己不会单脚站立。","answer":"I can't stand on one leg.","correct":"She can swim.","incorrect":"She can swims.","reason":"can后面用动词原形。"}],"senses":[{"word":"head","meanings":[{"meaning":"名词·头","icon":"🙂","scene":"孩子摸摸头部","en":"Touch your head.","zh":"摸摸你的头。"},{"meaning":"动词·朝某方向前进","icon":"🚶","scene":"一家人向公园走去","en":"We are heading to the park.","zh":"我们正前往公园。"}]},{"word":"hand","meanings":[{"meaning":"名词·手","icon":"✋","scene":"孩子举起手","en":"Raise your hand, please.","zh":"请举手。"},{"meaning":"动词·递交","icon":"📄","scene":"学生递给老师作品","en":"Please hand me the paper.","zh":"请把那张纸递给我。"}]}]},{"id":"A_L2_U02","material":"LingoAce（自研）","level":"2","no":2,"title":"Unit 2 · Back to School","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"there","title":"There be：介绍有、没有与数量","rule":"一个或不可数事物用There is；多个用There are。提问用Is/Are there；否定用isn't/aren't。","scene":"介绍新教室里的摆设","examples":[{"en":"There is a bookcase in the classroom.","zh":"教室里有一个书柜。"},{"en":"How many chairs are there? There are eleven chairs.","zh":"有多少把椅子？有十一把椅子。"}],"task":"说教室里没有钟。","answer":"There isn't a clock in the classroom.","correct":"There are two chairs.","incorrect":"There is two chairs.","reason":"two chairs是复数，搭配are。"}],"senses":[{"word":"board","meanings":[{"meaning":"名词·板、黑板","icon":"📝","scene":"老师在板上写字","en":"Write your name on the board.","zh":"把你的名字写在板上。"},{"meaning":"动词·登上交通工具","icon":"✈️","scene":"乘客准备登机","en":"We are ready to board the plane.","zh":"我们准备登机了。"}]}]},{"id":"A_L2_U03","material":"LingoAce（自研）","level":"2","no":3,"title":"Unit 3 · Have Fun at the Beach!","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"lets","title":"Let's + 动词：提出共同活动并回应","rule":"Let's后接动词原形。Good idea表示接受；也可礼貌表达不想参加，再提出替代活动。","scene":"和朋友商量海边活动","examples":[{"en":"Let's make a sandcastle. Good idea!","zh":"我们来堆沙堡吧。好主意！"},{"en":"Let's read a book. Sorry, I don't want to.","zh":"我们来读书吧。抱歉，我不想。"}],"task":"邀请朋友听音乐。","answer":"Let's listen to music.","correct":"Let's make a sandcastle.","incorrect":"Let's making a sandcastle.","reason":"Let's后用make，不用making。"},{"profile":"place","title":"位置介词：用句子说明在哪里","rule":"用Where is询问一个物品；用in、on、under、next to说明位置。多个物品用Where are ...? / They are ...。","scene":"在海滩寻找玩具","examples":[{"en":"Where is the kite? It is in the tree.","zh":"风筝在哪里？在树上。"},{"en":"Where are the balls? They are on the sand.","zh":"球在哪里？在沙地上。"}],"task":"询问一本书在哪里，再说在树下。","answer":"Where is the book? It is under the tree.","correct":"The crayon is under the desk.","incorrect":"The crayon under the desk.","reason":"描述位置也需要is或are，不能只写物品和介词。"}],"senses":[{"word":"take","meanings":[{"meaning":"动词·拿走、带走","icon":"🎒","scene":"出门时带伞","en":"Take your umbrella with you.","zh":"带上你的雨伞。"},{"meaning":"动词·花费时间","icon":"🕐","scene":"钟表显示路程用时","en":"The trip takes two hours.","zh":"这段旅程需要两小时。"},{"meaning":"搭配·乘坐","icon":"🚌","scene":"孩子坐公交上学","en":"I take the bus to school.","zh":"我乘公共汽车上学。"}]}]},{"id":"A_L2_U04","material":"LingoAce（自研）","level":"2","no":4,"title":"Unit 4 · The Zoo","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"likes","title":"一般现在时：表达喜好与询问喜好","rule":"I like；he/she/it likes。问句用Do/Does ... like；否定用don't/doesn't like。","scene":"介绍动物的食物喜好","examples":[{"en":"The monkey likes bananas.","zh":"这只猴子喜欢香蕉。"},{"en":"Does the tiger like carrots? No, it doesn't.","zh":"这只老虎喜欢胡萝卜吗？不，它不喜欢。"}],"task":"说鹦鹉不喜欢胡萝卜。","answer":"The parrot doesn't like carrots.","correct":"Does he like apples?","incorrect":"Does he likes apples?","reason":"Does已经承担人称变化，后面的like要用原形。"}],"senses":[{"word":"bear","meanings":[{"meaning":"名词·熊","icon":"🐻","scene":"熊在森林里","en":"The bear lives in the forest.","zh":"这只熊生活在森林里。"},{"meaning":"动词·忍受","icon":"🔊","scene":"响声让人受不了","en":"I can't bear the loud noise.","zh":"我受不了这巨大的噪声。"}]}]},{"id":"A_L2_U05","material":"LingoAce（自研）","level":"2","no":5,"title":"Unit 5 · My Day","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"routine","title":"一般现在时：介绍习惯、工作与作息","rule":"I/you/we/they用动词原形；he/she/it用第三人称单数形式。问句用Do/Does，后接动词原形。","scene":"分享家人的一天","examples":[{"en":"I get up at six o'clock.","zh":"我六点起床。"},{"en":"Melinda gets dressed at seven and watches TV at four.","zh":"梅琳达七点穿衣服，四点看电视。"}],"task":"用He说他九点睡觉。","answer":"He goes to bed at nine o'clock.","correct":"He goes to school at seven.","incorrect":"He go to school at seven.","reason":"第三人称单数肯定句需要goes；Does he go中的go仍用原形。"}],"senses":[{"word":"play","meanings":[{"meaning":"动词·玩耍","icon":"🧸","scene":"孩子和玩具一起玩","en":"The children play with their toys.","zh":"孩子们玩玩具。"},{"meaning":"搭配·演奏乐器","icon":"🎹","scene":"孩子弹钢琴","en":"She plays the piano.","zh":"她弹钢琴。"},{"meaning":"名词·戏剧","icon":"🎭","scene":"观众看舞台剧","en":"We watched a school play.","zh":"我们看了一出校园剧。"}]},{"word":"take","meanings":[{"meaning":"动词·拿走、带走","icon":"🎒","scene":"出门时带伞","en":"Take your umbrella with you.","zh":"带上你的雨伞。"},{"meaning":"动词·花费时间","icon":"🕐","scene":"钟表显示路程用时","en":"The trip takes two hours.","zh":"这段旅程需要两小时。"},{"meaning":"搭配·乘坐","icon":"🚌","scene":"孩子坐公交上学","en":"I take the bus to school.","zh":"我乘公共汽车上学。"}]}]},{"id":"A_L2_U06","material":"LingoAce（自研）","level":"2","no":6,"title":"Unit 6 · Where We Live","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"does","title":"Does问句：询问单数主语的需求、愿望或拥有","rule":"单数主语用Does + 主语 + 动词原形；回答Yes, ... does或No, ... doesn't。陈述句中的has/wants在Does问句中恢复have/want。","scene":"查看社区设施","examples":[{"en":"Does your town have a library? Yes, it does.","zh":"你的镇上有图书馆吗？是的，有。"},{"en":"Does your town have a hospital? No, it doesn't.","zh":"你的镇上有医院吗？不，没有。"}],"task":"询问朋友的镇上有没有公园。","answer":"Does your town have a park?","correct":"Does he want a robot?","incorrect":"Does he wants a robot?","reason":"Does后面使用动词原形want。"},{"profile":"place","title":"位置介词：用句子说明在哪里","rule":"用Where is询问一个物品；用in、on、under、next to说明位置。多个物品用Where are ...? / They are ...。","scene":"给朋友指路","examples":[{"en":"The library is between the school and the store.","zh":"图书馆在学校和商店之间。"},{"en":"The hospital is behind the park.","zh":"医院在公园后面。"}],"task":"用next to说商店在学校旁边。","answer":"The store is next to the school.","correct":"The crayon is under the desk.","incorrect":"The crayon under the desk.","reason":"描述位置也需要is或are，不能只写物品和介词。"}],"senses":[{"word":"park","meanings":[{"meaning":"名词·公园","icon":"🌳","scene":"一家人在公园野餐","en":"We have a picnic in the park.","zh":"我们在公园野餐。"},{"meaning":"动词·停车","icon":"🚗","scene":"把车停在图书馆外","en":"Please park the car near the library.","zh":"请把车停在图书馆附近。"}]},{"word":"store","meanings":[{"meaning":"名词·商店","icon":"🏪","scene":"去商店买东西","en":"She goes to the store.","zh":"她去商店。"},{"meaning":"动词·储存","icon":"📦","scene":"把食物存放在盒子里","en":"We store food in these boxes.","zh":"我们把食物储存在这些盒子里。"}]}]},{"id":"A_L2_U07","material":"LingoAce（自研）","level":"2","no":7,"title":"Unit 7 · The Market","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"price","title":"How much / How many：区分价格与数量","rule":"询问价格用How much is/are ...；单数或不可数用is，复数用are；询问可数物品数量用How many。","scene":"在市场购买水果","examples":[{"en":"How much is the fish? It is twenty-eight dollars.","zh":"这条鱼多少钱？二十八美元。"},{"en":"How much are the mangoes? They are twenty-two dollars.","zh":"这些芒果多少钱？二十二美元。"}],"task":"询问这些鸡蛋多少钱。","answer":"How much are the eggs?","correct":"How much are the eggs?","incorrect":"How many are the eggs?","reason":"询问鸡蛋的价格用How much；数量问题应为How many eggs ...?。"},{"profile":"politerequest","title":"Could you与would like：礼貌请求和点餐","rule":"Could you please + 动词原形用于请求；I would like + 名词用于点餐或表达想要；I'd是I would缩写。","scene":"在市场礼貌选择食物","examples":[{"en":"What would you like? I'd like some tomatoes.","zh":"你想要什么？我想要一些番茄。"},{"en":"Would you like some bread? Yes, please.","zh":"你想要一些面包吗？好的，谢谢。"}],"task":"礼貌表示自己想要一些芒果。","answer":"I would like some mangoes, please.","correct":"Could you bring me a fork?","incorrect":"Could you to bring me a fork?","reason":"Could you后直接接bring。"}],"senses":[{"word":"fish","meanings":[{"meaning":"名词·鱼","icon":"🐟","scene":"水里游动的鱼","en":"The fish is swimming.","zh":"这条鱼正在游泳。"},{"meaning":"动词·钓鱼","icon":"🎣","scene":"在湖边钓鱼","en":"We fish by the lake.","zh":"我们在湖边钓鱼。"}]}]},{"id":"A_L2_U08","material":"LingoAce（自研）","level":"2","no":8,"title":"Unit 8 · Off We Go!","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"progressive","title":"现在进行时：描述此刻正在做什么","rule":"结构是am/is/are + 动词-ing；疑问句把be动词提前。根据主语选择am、is或are。","scene":"给交通出行照片配音","examples":[{"en":"What are you doing? I am waiting for a bus.","zh":"你正在做什么？我正在等公共汽车。"},{"en":"My dad is driving a car, and my sister is taking the train.","zh":"爸爸正在开车，姐姐正在乘火车。"}],"task":"介绍自己正在骑摩托车。","answer":"I am riding a motorcycle.","correct":"She is swimming.","incorrect":"She swimming.","reason":"进行时不能漏掉be动词；不是把每个动词加-ing就成句。"},{"profile":"wouldlike","title":"would like to与by：表达想去哪里以及交通方式","rule":"would like to + 动词原形；I'd是I would。交通方式常用by plane/train/boat，不在by后加a/the。","scene":"表达出行愿望与交通方式","examples":[{"en":"I'd like to go to Africa by plane.","zh":"我想坐飞机去非洲。"},{"en":"I'd like to go to the jungle by train.","zh":"我想坐火车去丛林。"}],"task":"说你想乘船去小岛。","answer":"I'd like to go to the island by boat.","correct":"I'd like to go by plane.","incorrect":"I'd like go by a plane.","reason":"like后接to go；交通方式用by plane。"}],"senses":[{"word":"train","meanings":[{"meaning":"名词·火车","icon":"🚆","scene":"火车驶入车站","en":"The train is at the station.","zh":"火车在车站。"},{"meaning":"动词·训练","icon":"🏃","scene":"运动员每天练习","en":"The athletes train every day.","zh":"运动员每天训练。"}]},{"word":"fly","meanings":[{"meaning":"动词·飞","icon":"🐦","scene":"鸟飞过树梢","en":"Birds can fly.","zh":"鸟会飞。"},{"meaning":"名词·苍蝇","icon":"🪰","scene":"一只苍蝇落在窗上","en":"There is a fly on the window.","zh":"窗户上有一只苍蝇。"}]}]},{"id":"A_L3_U01","material":"LingoAce（自研）","level":"3","no":1,"title":"Unit 1 · Look at My Face!","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"has","title":"have / has与Does ... have：说明特征","rule":"单数第三人称肯定句用has；其他主语常用have。Does问句及doesn't否定句后用have。","scene":"设计并描述一个外星人","examples":[{"en":"The alien has long, curly hair.","zh":"这个外星人长着长长的卷发。"},{"en":"Does it have sharp teeth? Yes, it does.","zh":"它有锋利的牙齿吗？是的，有。"}],"task":"用has描述它有一条长脖子。","answer":"It has a long neck.","correct":"Does it have wings?","incorrect":"Does it has wings?","reason":"Does后恢复为have。"},{"profile":"be","title":"am / is / are：介绍身份、年龄与状态","rule":"I用am；he/she/it和单数用is；you/we/they和复数用are。年龄直接用I am five，不用I have five。","scene":"根据表情说心情","examples":[{"en":"Are you tired? Yes, I am.","zh":"你累了吗？是的。"},{"en":"I am hungry, but I am not angry.","zh":"我饿了，但我没有生气。"}],"task":"用She说她既激动又惊讶。","answer":"She is excited and surprised.","correct":"I am five years old.","incorrect":"I have five years old.","reason":"英语介绍年龄用be动词。"}],"senses":[{"word":"sharp","meanings":[{"meaning":"形容词·锋利的","icon":"🦷","scene":"动物锋利的牙齿","en":"The shark has sharp teeth.","zh":"鲨鱼有锋利的牙齿。"},{"meaning":"形容词·敏锐的","icon":"💡","scene":"很会发现问题的孩子","en":"She has a sharp mind.","zh":"她思维敏锐。"}]}]},{"id":"A_L3_U02","material":"LingoAce（自研）","level":"3","no":2,"title":"Unit 2 · Around My Room","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"demonstrative","title":"this / that / these / those：区分远近与数量","rule":"近处单个this，远处单个that；近处多个these，远处多个those。跟随其后的名词要匹配单复数。","scene":"整理房间并找物品主人","examples":[{"en":"Whose pillows are these? They are Melinda's.","zh":"这些是谁的枕头？它们是梅琳达的。"},{"en":"Put this rug under your bed. Put those shoes in the closet.","zh":"把这块地毯放在床下。把那些鞋放进衣柜。"}],"task":"把近处的一个枕头称为this pillow，放到床上。","answer":"Put this pillow on the bed.","correct":"Put those shoes in the closet.","incorrect":"Put that shoes in the closet.","reason":"shoes为复数，用those。"},{"profile":"imperative","title":"祈使句：听懂并发出动作指令","rule":"用动词原形开头；通常省略you。Don't + 动词原形表示不要做某事；加please更礼貌。","scene":"发出整理房间的指令","examples":[{"en":"Tidy your room up.","zh":"整理你的房间。"},{"en":"Put those dirty shoes in the closet.","zh":"把那些脏鞋放进衣柜。"}],"task":"请朋友把这些枕头收好。","answer":"Put these pillows away, please.","correct":"Open your book, please.","incorrect":"Opens your book, please.","reason":"指令开头使用动词原形open。"}],"senses":[{"word":"table","meanings":[{"meaning":"名词·桌子","icon":"🪑","scene":"桌上的书","en":"The book is on the table.","zh":"书在桌子上。"},{"meaning":"名词·表格","icon":"📊","scene":"用表格整理信息","en":"Put the numbers in the table.","zh":"把数字填入表格。"}]}]},{"id":"A_L3_U03","material":"LingoAce（自研）","level":"3","no":3,"title":"Unit 3 · Sports Day","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"gerund","title":"like + doing：表达喜欢的活动","rule":"like后可接动词-ing形式描述喜好，也常可接to do；球类通常play football，乐器通常play the guitar。 enjoy后只能接doing，不能接to do。","scene":"采访朋友的运动喜好","examples":[{"en":"I like playing badminton.","zh":"我喜欢打羽毛球。"},{"en":"Do you like watching football? Yes, I do. It is exciting.","zh":"你喜欢看足球吗？是的。我觉得它很精彩。"}],"task":"用like doing说自己喜欢打乒乓球。","answer":"I like playing table tennis.","correct":"I like playing football.","incorrect":"I like play football.","reason":"like后的活动用playing football或to play football。"}],"senses":[{"word":"table","meanings":[{"meaning":"名词·桌子","icon":"🪑","scene":"桌上的书","en":"The book is on the table.","zh":"书在桌子上。"},{"meaning":"名词·表格","icon":"📊","scene":"用表格整理信息","en":"Put the numbers in the table.","zh":"把数字填入表格。"}]},{"word":"great","meanings":[{"meaning":"形容词·很棒的","icon":"👍","scene":"称赞一个想法","en":"That is a great idea!","zh":"那是个很棒的主意！"},{"meaning":"形容词·伟大的","icon":"🏅","scene":"介绍伟大的科学家","en":"She was a great scientist.","zh":"她是一位伟大的科学家。"}]}]},{"id":"A_L3_U04","material":"LingoAce（自研）","level":"3","no":4,"title":"Unit 4 · Let's Study","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"why","title":"Why / because：提问原因并给出解释","rule":"Why引导原因问句；because后接主语和谓语构成的完整从句。可以先问答，再合成一个句子。","scene":"解释最喜欢的学科","examples":[{"en":"Why do you like science? Because it is interesting.","zh":"你为什么喜欢科学？因为它很有趣。"},{"en":"I like art because I am good at drawing.","zh":"我喜欢美术，因为我擅长画画。"}],"task":"用because说你喜欢数学，因为你擅长数学。","answer":"I like math because I am good at it.","correct":"I like art because it is fun.","incorrect":"Because it is fun, so I like art.","reason":"标准英语中because和so不在同一句中成对引导同一因果关系。"},{"profile":"goodat","title":"be good at：说明擅长的学科与活动","rule":"am/is/are good at + 名词或动词-ing；at是介词，后面的动作用-ing形式。否定时在be后加not。","scene":"说明自己擅长的学科与活动","examples":[{"en":"I am good at math.","zh":"我擅长数学。"},{"en":"She is good at learning languages.","zh":"她擅长学习语言。"}],"task":"说自己不擅长画画。","answer":"I am not good at drawing.","correct":"She is good at drawing.","incorrect":"She is good at draw.","reason":"介词at后用drawing。"}],"senses":[{"word":"subject","meanings":[{"meaning":"名词·学科","icon":"📚","scene":"选择学校课程","en":"Science is my favorite subject.","zh":"科学是我最喜欢的学科。"},{"meaning":"名词·主语","icon":"✏️","scene":"标出句子主语","en":"In \"Birds fly,\" the subject is \"Birds.\"","zh":"在“Birds fly”中，主语是“Birds”。"}]},{"word":"cool","meanings":[{"meaning":"形容词·凉爽的","icon":"🍃","scene":"凉爽的秋日","en":"It is cool today.","zh":"今天很凉爽。"},{"meaning":"动词·使冷却","icon":"🧪","scene":"实验液体降温","en":"Let the liquid cool.","zh":"让液体冷却。"},{"meaning":"非正式形容词·很棒的、酷的","icon":"😎","scene":"欣赏朋友的创意","en":"That is a cool idea!","zh":"那个主意真棒！"}]}]},{"id":"A_L3_U05","material":"LingoAce（自研）","level":"3","no":5,"title":"Unit 5 · All about My Family","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"howmany","title":"How many：询问家庭人数与亲属数量","rule":"How many后接可数复数；How many ... are there询问有多少；How many ... do you have询问你拥有多少。","scene":"用全家福介绍家庭人数","examples":[{"en":"How many people are in your family? There are six.","zh":"你家有几口人？有六口人。"},{"en":"How many sisters do you have? I have two sisters.","zh":"你有几个姐妹？我有两个姐妹。"}],"task":"询问朋友有几个兄弟。","answer":"How many brothers do you have?","correct":"How many sisters do you have?","incorrect":"How many sister do you have?","reason":"many后接复数sisters。"}],"senses":[{"word":"little","meanings":[{"meaning":"形容词·小的","icon":"🧒","scene":"介绍年幼的弟弟","en":"This is my little brother.","zh":"这是我的小弟弟。"},{"meaning":"数量词·少量的；a little表示有一点","icon":"💧","scene":"杯中少量的水","en":"There is a little water in the cup.","zh":"杯子里有一点水。"}]}]},{"id":"A_L3_U06","material":"LingoAce（自研）","level":"3","no":6,"title":"Unit 6 · Making Plans","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"shouldpermission","title":"should与Can I：区分建议和征求许可","rule":"We should + 原形提出建议；Can I + 原形询问是否允许自己做某事；回答用Yes, you can或No, you can't。","scene":"商量周末计划并征求许可","examples":[{"en":"What should we do today? We should go hiking.","zh":"我们今天应该做什么？我们应该去远足。"},{"en":"Can I visit my cousins tomorrow? Yes, you can.","zh":"我明天可以去看望堂表兄弟姐妹吗？可以。"}],"task":"征求明天下午去露营的许可。","answer":"Can I go camping tomorrow afternoon?","correct":"Can I go camping?","incorrect":"Can I going camping?","reason":"Can I后接go；go camping是活动表达。"}],"senses":[{"word":"build","meanings":[{"meaning":"动词·建造","icon":"🏠","scene":"建造树屋","en":"We build a tree house.","zh":"我们建造一座树屋。"},{"meaning":"动词·逐步建立、增强","icon":"💪","scene":"通过练习增强信心","en":"Practice helps build confidence.","zh":"练习有助于增强信心。"}]}]},{"id":"A_L3_U07","material":"LingoAce（自研）","level":"3","no":7,"title":"Unit 7 · How's the Weather?","low":true,"note":"依据本包已有单元课序与句型编写；以下例句、任务与答案均为新增教学拓展。","kind":"课序对应","lessons":["语法1","语法2"],"grammar":[{"profile":"weather","title":"It is ...与Let's ...：描述天气并安排活动","rule":"天气用It is + 形容词，如sunny、rainy、cold；季节前常用in；Let's后接动词原形提出共同活动。","scene":"看天气决定今天做什么","examples":[{"en":"How is the weather? It is snowy.","zh":"天气怎么样？下雪了。"},{"en":"It is snowy outside. Let's make a snowman.","zh":"外面下雪了。我们来堆雪人吧。"}],"task":"今天下雨，建议带上雨伞。","answer":"It is rainy today. Let's take our umbrella.","correct":"It is rainy today.","incorrect":"It rainy to
