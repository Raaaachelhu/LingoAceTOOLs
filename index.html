<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingoAce · 教学工具中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E2A3A;
  --navy-deep:#0F1620;
  --amber:#C97A2B;
  --amber-light:#D9A66B;
  --teal:#2E6B62;
  --brick:#A24A3D;
  --cream:#F4F1E8;
  --cream-soft:#C7CCD6;
  --glass:rgba(244,241,232,0.05);
  --glass-strong:rgba(244,241,232,0.09);
  --glass-border:rgba(244,241,232,0.13);
  --radius-lg:22px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
body{
  font-family:'Inter',system-ui,sans-serif;
  color:var(--cream);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{ font-family:'Fraunces',serif; margin:0; }
.mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-feature-settings:"tnum"; }
a{ color:inherit; text-decoration:none; }

/* ===================== BACKGROUND ===================== */
.bg-scene{ position:fixed; inset:0; z-index:0; background:var(--navy-deep); overflow:hidden; }
.bg-blob{ position:absolute; border-radius:50%; filter:blur(90px); opacity:0.55; will-change:transform; }
.blob-1{ width:56vw; height:56vw; left:-16vw; top:-18vw; background:radial-gradient(circle at 30% 30%, var(--amber), transparent 68%); animation:drift1 34s ease-in-out infinite; }
.blob-2{ width:46vw; height:46vw; right:-14vw; top:-10vw; background:radial-gradient(circle at 60% 40%, var(--teal), transparent 68%); animation:drift2 40s ease-in-out infinite; }
.blob-3{ width:50vw; height:50vw; left:18vw; bottom:-22vw; background:radial-gradient(circle at 50% 50%, var(--brick), transparent 70%); animation:drift3 46s ease-in-out infinite; }
.blob-4{ width:34vw; height:34vw; right:12vw; bottom:-12vw; background:radial-gradient(circle at 50% 50%, var(--navy), transparent 65%); opacity:0.7; }
@keyframes drift1{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(4vw,3vw) scale(1.08); } }
@keyframes drift2{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-3vw,4vw) scale(1.05); } }
@keyframes drift3{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(3vw,-3vw) scale(1.1); } }
.bg-vignette{ position:absolute; inset:0; background:radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(8,11,16,0.55) 100%); }
.bg-grain{ position:absolute; inset:0; opacity:0.05; mix-blend-mode:overlay; pointer-events:none; }
@media (prefers-reduced-motion: reduce){ .bg-blob{ animation:none !important; } }

/* ===================== LAYOUT SHELL ===================== */
.shell{ position:relative; z-index:1; height:100vh; display:grid; grid-template-columns:112px 1fr 300px; }

/* ===================== LEFT RAIL ===================== */
.rail-left{
  background:var(--glass); backdrop-filter:blur(24px) saturate(140%); -webkit-backdrop-filter:blur(24px) saturate(140%);
  border-right:1px solid var(--glass-border);
  display:flex; flex-direction:column; align-items:center;
  padding:26px 0 20px;
}
.rail-logo{
  width:42px; height:42px; border-radius:12px; background:rgba(255,255,255,0.08); border:1px solid var(--glass-border);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; color:var(--cream);
  margin-bottom:34px; flex-shrink:0;
}
.nav-list{ display:flex; flex-direction:column; gap:16px; flex:1; justify-content:center; }
.nav-item{
  position:relative; width:68px; height:60px; border-radius:16px;
  background:rgba(255,255,255,0.03); border:1px solid var(--glass-border);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer;
  transition:background .2s ease, transform .2s ease, border-color .2s ease;
}
.nav-item::before{
  content:""; position:absolute; left:-1px; top:12px; bottom:12px; width:3px; border-radius:2px;
  background:var(--dot-color, var(--amber)); opacity:0.85;
}
.nav-item .ni-num{ font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:rgba(244,241,232,0.4); letter-spacing:0.02em; line-height:1; }
.nav-item .ni-label{ font-size:11.5px; font-weight:600; color:var(--cream-soft); margin-top:1px; letter-spacing:0.01em; line-height:1.2; white-space:nowrap; }
.nav-item:hover, .nav-item.active{ background:rgba(255,255,255,0.09); border-color:rgba(255,255,255,0.22); transform:translateX(2px); }
.nav-item:hover .ni-num, .nav-item.active .ni-num{ color:var(--dot-color, var(--amber-light)); }
.nav-item:hover .ni-label, .nav-item.active .ni-label{ color:#fff; }
.rail-foot{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:rgba(244,241,232,0.35); writing-mode:vertical-rl; letter-spacing:0.12em; margin-top:20px; }

/* ===================== DEV BADGE ===================== */
.dev-badge{
  position:fixed; top:20px; right:316px; z-index:60;
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.03em; color:rgba(244,241,232,0.55);
  background:var(--glass); border:1px solid var(--glass-border); backdrop-filter:blur(12px);
  padding:6px 13px; border-radius:20px;
}
.dev-badge b{ color:var(--cream); font-weight:600; }
@media (max-width:980px){ .dev-badge{ position:static; display:inline-block; margin:14px 0 0 16px; } }

/* ===================== FAN FLYOUT ===================== */
.flyout{
  position:fixed; left:104px; width:430px; max-width:calc(100vw - 436px);
  z-index:50; pointer-events:none; opacity:0;
  transform:scaleX(0.35) translateX(-14px); transform-origin:0% 50%;
  transition:opacity .32s cubic-bezier(.22,1,.36,1), transform .38s cubic-bezier(.22,1,.36,1);
}
.flyout.show{ opacity:1; pointer-events:auto; transform:scaleX(1) translateX(0); }
.flyout-inner{
  clip-path: polygon(0% 50%, 4% 32%, 10% 17%, 20% 7%, 34% 2%, 52% 0%, 100% 0%, 100% 100%, 52% 100%, 34% 98%, 20% 93%, 10% 83%, 4% 68%);
  background:linear-gradient(155deg, rgba(30,42,58,0.92), rgba(15,22,32,0.94));
  border:1px solid rgba(255,255,255,0.14);
  padding:30px 34px 26px 46px;
  filter:drop-shadow(0 24px 50px rgba(0,0,0,0.5)) drop-shadow(0 2px 10px rgba(0,0,0,0.35));
}
.flyout-tag{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--fy-color, var(--amber-light)); margin-bottom:10px; font-weight:600; }
.flyout h3{ font-size:20px; color:#fff; line-height:1.25; margin-bottom:10px; }
.flyout p{ font-size:12.8px; line-height:1.7; color:var(--cream-soft); margin:0 0 14px; }
.flyout ul{ margin:0 0 20px; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; }
.flyout li{ font-size:12px; line-height:1.6; color:var(--cream-soft); padding-left:14px; position:relative; }
.flyout li::before{ content:""; position:absolute; left:0; top:7px; width:5px; height:5px; border-radius:50%; background:var(--fy-color, var(--amber-light)); }
.flyout-btn{
  display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--navy-deep);
  background:var(--fy-color, var(--amber-light)); padding:10px 20px; border-radius:9px;
  transition:filter .15s ease, transform .15s ease;
}
.flyout-btn:hover{ filter:brightness(1.1); transform:translateX(2px); }

/* ===================== CENTER STAGE ===================== */
.stage{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 40px; text-align:center; overflow-y:auto; max-height:100vh; }
.stage-badge{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:0.22em; text-transform:uppercase;
  color:var(--amber-light); display:flex; align-items:center; gap:10px; margin-bottom:14px;
}
.stage-badge .dot{ width:6px; height:6px; border-radius:50%; background:#6FBF8B; box-shadow:0 0 0 4px rgba(111,191,139,0.18); }
.stage h1{ font-size:clamp(17px,1.7vw,21px); font-weight:500; color:rgba(244,241,232,0.82); line-height:1.3; margin-bottom:8px; letter-spacing:0.01em; }
.stage h1 em{ font-style:italic; font-weight:600; color:var(--amber-light); }
.stage p.sub{ font-size:12.5px; color:var(--cream-soft); max-width:52ch; line-height:1.6; margin-bottom:14px; opacity:0.75; }

.fun-tagline{
  display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:#fff;
  padding:8px 18px; border-radius:20px; margin-bottom:18px;
  background:linear-gradient(120deg, var(--accent) 0%, var(--navy) 120%);
  box-shadow:0 8px 20px rgba(201,122,43,0.28);
  transition:opacity .3s ease;
}
.fun-tagline .emoji{ font-size:14px; }

.globe-wrap{ position:relative; width:100%; max-width:560px; height:280px; margin-bottom:14px; }
.globe-blob{ position:absolute; border-radius:48% 52% 55% 45% / 45% 48% 52% 55%; }
.globe-blob.gb1{ width:210px; height:150px; left:2%; top:18%; background:radial-gradient(circle at 35% 30%, rgba(217,166,107,0.28), rgba(217,166,107,0.06) 70%); }
.globe-blob.gb2{ width:260px; height:190px; left:28%; top:2%; background:radial-gradient(circle at 40% 35%, rgba(127,217,196,0.22), rgba(127,217,196,0.05) 70%); }
.globe-blob.gb3{ width:190px; height:170px; right:4%; top:24%; background:radial-gradient(circle at 45% 30%, rgba(201,122,43,0.24), rgba(201,122,43,0.05) 70%); }
.globe-dots{ position:absolute; inset:0; background-image: radial-gradient(rgba(244,241,232,0.5) 1px, transparent 1.5px); background-size:14px 14px; -webkit-mask-image: radial-gradient(ellipse 260px 130px at 22% 45%, black 60%, transparent 100%), radial-gradient(ellipse 280px 150px at 52% 30%, black 60%, transparent 100%), radial-gradient(ellipse 220px 140px at 82% 48%, black 60%, transparent 100%); -webkit-mask-composite: source-over; mask-image: radial-gradient(ellipse 260px 130px at 22% 45%, black 60%, transparent 100%), radial-gradient(ellipse 280px 150px at 52% 30%, black 60%, transparent 100%), radial-gradient(ellipse 220px 140px at 82% 48%, black 60%, transparent 100%); }
.globe-marker{ position:absolute; width:9px; height:9px; margin:-4.5px; cursor:pointer; }
.globe-marker::before{
  content:""; position:absolute; inset:0; border-radius:50%; background:var(--amber-light);
  box-shadow:0 0 0 3px rgba(217,166,107,0.25);
}
.globe-marker::after{
  content:""; position:absolute; inset:-6px; border-radius:50%; border:1px solid rgba(217,166,107,0.5);
  animation:markerPulse 2.2s ease-out infinite;
}
@keyframes markerPulse{ 0%{ transform:scale(0.6); opacity:0.9; } 100%{ transform:scale(2.1); opacity:0; } }
@media (prefers-reduced-motion: reduce){ .globe-marker::after{ animation:none; } }
.globe-tip{
  position:absolute; bottom:16px; left:50%; transform:translateX(-50%) translateY(6px); opacity:0; pointer-events:none;
  white-space:nowrap; background:rgba(15,22,32,0.95); border:1px solid rgba(255,255,255,0.15);
  padding:7px 14px; border-radius:10px; font-size:12.5px; color:#fff; transition:opacity .18s ease, transform .18s ease;
  box-shadow:0 10px 24px rgba(0,0,0,0.4);
}
.globe-tip .gt-word{ font-family:'Fraunces',serif; font-style:italic; font-weight:600; color:var(--amber-light); margin-right:6px; }
.globe-tip::after{ content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:rgba(15,22,32,0.95); }
.globe-marker:hover .globe-tip{ opacity:1; transform:translateX(-50%) translateY(-4px); }
.globe-caption{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(244,241,232,0.32); margin-bottom:16px; }

.stage-hint{
  display:inline-flex; align-items:center; gap:10px; font-size:12.5px; color:rgba(244,241,232,0.55);
  padding:11px 20px; border-radius:30px; border:1px solid var(--glass-border); background:var(--glass);
}
.stage-hint .arrow-left{ animation:nudge 1.6s ease-in-out infinite; }
@keyframes nudge{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(-4px); } }
@media (prefers-reduced-motion: reduce){ .stage-hint .arrow-left{ animation:none; } }
.stage{ transition:opacity .3s ease, filter .3s ease; }
.shell.flyout-active .stage{ opacity:0.28; filter:blur(1px); }
.stage-footnote{ margin-top:14px; font-size:10.5px; color:rgba(244,241,232,0.32); letter-spacing:0.02em; }

/* ===================== WORD OF THE DAY ===================== */
.wod-card{
  margin:0 0 16px; padding:14px 24px; border-radius:16px; max-width:560px;
  display:flex; align-items:center; gap:16px; text-align:left;
  background:linear-gradient(155deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:
    inset 1px 1px 1px rgba(255,255,255,0.07),
    inset -2px -2px 8px rgba(0,0,0,0.35),
    0 14px 34px rgba(0,0,0,0.3);
}
.wod-label{ font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--amber-light); margin-bottom:4px; }
.wod-word{ font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size:22px; color:#fff; line-height:1.1; flex-shrink:0; }
.wod-body{ min-width:0; }
.wod-sentence{ font-size:12.5px; color:var(--cream-soft); line-height:1.5; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wod-source{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:rgba(244,241,232,0.4); }

/* ===================== RIGHT RAIL ===================== */
.rail-right{
  background:var(--glass); backdrop-filter:blur(24px) saturate(140%); -webkit-backdrop-filter:blur(24px) saturate(140%);
  border-left:1px solid var(--glass-border);
  padding:26px 22px; display:flex; flex-direction:column; gap:18px; overflow-y:auto;
}
.widget{
  border-radius:16px; padding:18px 19px; background:rgba(255,255,255,0.035);
  box-shadow:
    inset 1px 1px 1px rgba(255,255,255,0.06),
    inset -2px -2px 6px rgba(0,0,0,0.35),
    0 8px 20px rgba(0,0,0,0.25);
  border:1px solid rgba(255,255,255,0.07);
}
.widget-label{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(244,241,232,0.4); margin-bottom:10px; }

/* clock */
.clock-time{ font-family:'Fraunces',serif; font-size:36px; font-weight:600; color:#fff; letter-spacing:0.01em; line-height:1; text-shadow:0 1px 0 rgba(255,255,255,0.08), 0 2px 6px rgba(0,0,0,0.4); }
.clock-time .sec{ font-size:16px; color:var(--amber-light); font-family:'IBM Plex Mono',monospace; margin-left:4px; }
.clock-date{ margin-top:8px; font-size:12px; color:var(--cream-soft); }
.clock-tz{ margin-top:2px; font-size:10.5px; color:rgba(244,241,232,0.4); font-family:'IBM Plex Mono',monospace; }

/* quote */
.quote-text{ font-family:'Fraunces',serif; font-style:italic; font-size:15px; line-height:1.6; color:#fff; min-height:76px; transition:opacity .4s ease; }
.quote-cn{ margin-top:10px; font-size:11.5px; color:var(--cream-soft); line-height:1.6; }

/* calendar */
.cal-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
.cal-month{ font-family:'Fraunces',serif; font-size:15px; color:#fff; }
.cal-year{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:rgba(244,241,232,0.4); }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-dow{ font-size:9px; text-align:center; color:rgba(244,241,232,0.35); font-family:'IBM Plex Mono',monospace; padding-bottom:4px; }
.cal-day{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--cream-soft); border-radius:8px; font-family:'IBM Plex Mono',monospace; }
.cal-day.empty{ visibility:hidden; }
.cal-day.today{ background:var(--amber); color:#fff; font-weight:700; box-shadow:0 2px 8px rgba(201,122,43,0.5); }
.cal-day.weekend{ color:rgba(217,166,107,0.6); }

/* responsive fallback (basic) */
@media (max-width:980px){
  body{ overflow:auto; }
  .shell{ grid-template-columns:1fr; grid-template-rows:auto auto auto; height:auto; min-height:100vh; }
  .rail-left{ flex-direction:row; padding:16px; border-right:none; border-bottom:1px solid var(--glass-border); }
  .nav-list{ flex-direction:row; flex-wrap:wrap; }
  .rail-logo{ margin-bottom:0; margin-right:16px; }
  .rail-foot{ display:none; }
  .flyout{ position:static; width:auto; max-width:none; transform:none; opacity:1; pointer-events:auto; display:none; margin:12px 16px; }
  .flyout.show{ display:block; }
  .flyout-inner{ clip-path:none; padding:22px; border-radius:16px; }
  .stage{ padding:40px 24px; }
  .rail-right{ flex-direction:row; flex-wrap:wrap; border-left:none; border-top:1px solid var(--glass-border); }
  .widget{ flex:1; min-width:200px; }
}
</style>
</head>
<body>
<div id="gatedContent" style="display:none">

<div class="bg-scene">
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
  <div class="bg-blob blob-4"></div>
  <div class="bg-vignette"></div>
  <svg class="bg-grain" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>

<div class="dev-badge">Developer：<b>Rachel Hu（Shumin）</b></div>

<div class="shell">
  <nav class="rail-left">
    <div class="rail-logo">⌃</div>
    <div class="nav-list" id="navList"></div>
    <div class="rail-foot">LINGOACE TOOLS</div>
  </nav>

  <main class="stage">
    <div class="stage-badge"><span class="dot"></span>教学工具中心</div>
    <h1>一站式 <em>教学 &amp; 学习</em> 工具合集</h1>
    <p class="sub">覆盖学习规划报告、教材速查、学员画像、课后练习与课程凭证生成</p>

    <div class="fun-tagline" id="funTagline"><span class="emoji">🎯</span><span id="funTaglineText">今天开单，每天开单</span></div>

    <div class="globe-wrap" id="globeWrap">
      <div class="globe-blob gb1"></div>
      <div class="globe-blob gb2"></div>
      <div class="globe-blob gb3"></div>
      <div class="globe-dots"></div>
      <div id="globeMarkers"></div>
      <div class="globe-tip" id="globeTip"><span class="gt-word" id="globeTipWord"></span><span id="globeTipLang"></span></div>
    </div>
    <div class="globe-caption">世界各地打招呼的方式 · 悬停查看</div>

    <div class="wod-card" id="wodCard">
      <div class="wod-word" id="wodWord">—</div>
      <div class="wod-body">
        <div class="wod-label">每日单词</div>
        <div class="wod-sentence" id="wodSentence"></div>
        <div class="wod-source" id="wodSource"></div>
      </div>
    </div>

    <div class="stage-hint"><span class="arrow-left">←</span> 移到左侧图标查看工具介绍</div>
    <div class="stage-footnote">首次使用请将全部工具文件保存在同一文件夹内，再打开本页</div>
  </main>

  <aside class="rail-right">
    <div class="widget" id="clockWidget">
      <div class="widget-label">北京时间 · Beijing Time</div>
      <div class="clock-time"><span id="clockHM">--:--</span><span class="sec" id="clockSec">--</span></div>
      <div class="clock-date" id="clockDate">—</div>
      <div class="clock-tz">UTC+8 · Asia/Shanghai</div>
    </div>

    <div class="widget" id="quoteWidget">
      <div class="widget-label">每日一句 · Daily Line</div>
      <div class="quote-text" id="quoteText">Loading…</div>
      <div class="quote-cn" id="quoteCn"></div>
    </div>

    <div class="widget" id="calWidget">
      <div class="cal-head"><span class="cal-month" id="calMonth">—</span><span class="cal-year" id="calYear">—</span></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </aside>
</div>

<div class="flyout" id="flyout">

const navList = document.getElementById('navList');
const flyout = document.getElementById('flyout');
const flyoutInner = document.getElementById('flyoutInner');
let hideTimer = null;

TOOLS.forEach((t, i) => {
  const item = document.createElement('div');
  item.className = 'nav-item';
  item.style.setProperty('--dot-color', t.color);
  item.innerHTML = `<span class="ni-num">${String(i+1).padStart(2,'0')}</span><span class="ni-label">${t.label}</span>`;
  item.addEventListener('mouseenter', () => showFlyout(item, t));
  item.addEventListener('mouseleave', scheduleHide);
  item.addEventListener('click', () => window.open(t.href, '_blank'));
  navList.appendChild(item);
});

function showFlyout(item, t){
  clearTimeout(hideTimer);
  document.querySelector('.shell').classList.add('flyout-active');
  const rect = item.getBoundingClientRect();
  flyout.style.top = Math.max(16, rect.top + rect.height/2 - 140) + 'px';
  flyoutInner.style.setProperty('--fy-color', t.color);
  flyoutInner.innerHTML = `
    <div class="flyout-tag">${t.tag}</div>
    <h3>${t.title}</h3>
    <p>${t.desc}</p>
    <ul>${t.features.map(f => `<li>${f}</li>`).join('')}</ul>
    <a class="flyout-btn" href="${t.href}" target="_blank">打开工具 →</a>
  `;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  item.classList.add('active');
  flyout.classList.add('show');
}
function scheduleHide(){
  hideTimer = setTimeout(() => {
    flyout.classList.remove('show');
    document.querySelector('.shell').classList.remove('flyout-active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  }, 220);
}
flyout.addEventListener('mouseenter', () => clearTimeout(hideTimer));
flyout.addEventListener('mouseleave', scheduleHide);

/* ---------------- clock ---------------- */
function updateClock(){
  const now = new Date();
  const parts = new Intl.DateTimeFormat('zh-CN', { timeZone:'Asia/Shanghai', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }).formatToParts(now);
  const get = (type) => parts.find(p => p.type === type).value;
  document.getElementById('clockHM').textContent = `${get('hour')}:${get('minute')}`;
  document.getElementById('clockSec').textContent = get('second');
  const dateFmt = new Intl.DateTimeFormat('zh-CN', { timeZone:'Asia/Shanghai', year:'numeric', month:'long', day:'numeric', weekday:'long' });
  document.getElementById('clockDate').textContent = dateFmt.format(now);
}
updateClock();

/* ---------------- calendar ---------------- */
function renderCalendar(){
  const now = new Date();
  const shanghaiNow = new Date(now.toLocaleString('en-US', { timeZone:'Asia/Shanghai' }));
  const y = shanghaiNow.getFullYear(), m = shanghaiNow.getMonth(), today = shanghaiNow.getDate();
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('calMonth').textContent = monthNames[m];
  document.getElementById('calYear').textContent = y;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  ['日','一','二','三','四','五','六'].forEach(d => {
    const el = document.createElement('div'); el.className = 'cal-dow'; el.textContent = d; grid.appendChild(el);
  });
  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  for (let i=0;i<firstDow;i++){ const el = document.createElement('div'); el.className='cal-day empty'; grid.appendChild(el); }
  for (let d=1; d<=daysInMonth; d++){
    const el = document.createElement('div');
    const dow = new Date(y,m,d).getDay();
    el.className = 'cal-day' + (d===today ? ' today' : '') + ((dow===0||dow===6) ? ' weekend' : '');
    el.textContent = d;
    grid.appendChild(el);
  }
}
renderCalendar();

<script>
(function(){
  var PASSWORD = "lyp82nlf";
  var STORAGE_KEY = "la_tools_auth_v2";
  var VALID_HOURS = 168;
  function unlock(){
    var g = document.getElementById('authGate');
    var c = document.getElementById('gatedContent');
    if (g) g.style.display = 'none';
    if (c) c.style.display = '';
  }
  try{
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && saved.ok && (Date.now() - saved.ts) < VALID_HOURS*3600*1000){
      unlock();
    }
  }catch(e){}
  var btn = document.getElementById('authGateBtn');
  var input = document.getElementById('authGateInput');
  var err = document.getElementById('authGateError');
  function tryLogin(){
    if (input.value === PASSWORD){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ok:true, ts:Date.now()})); }catch(e){}
      unlock();
    } else {
      err.style.display = 'block';
      input.value = '';
      input.focus();
    }
  }
  if (btn) btn.addEventListener('click', tryLogin);
  if (input) input.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryLogin(); });
  setTimeout(function(){ if (input) input.focus(); }, 50);
})();
