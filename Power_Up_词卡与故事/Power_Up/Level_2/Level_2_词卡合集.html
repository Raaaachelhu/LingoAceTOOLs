逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 3 · Party time!", "context": "Power Up Level 2 · Unit 3 · Party time!", "theme": {"key": "farm", "title_cn": "农场假日", "title_en": "Holiday on the Farm", "subject": "Amy", "opening": "\u003cp>During the summer holiday, \u003cb>Amy\u003c/b> went to visit her grandpa's farm. There was so much to see and do every single day.\u003c/p>", "closing": "\u003cp>On her last evening at the farm, Amy watched the sunset and thought about all the wonderful things she had seen that week.\u003c/p>", "moral": "走进真实的生活去观察和体验，是记住新单词最好的方法之一。"}, "bodyHtml": "\u003cp>During the summer holiday, \u003cb>Amy\u003c/b> went to visit her grandpa's farm. There was so much to see and do every single day.\u003c/p>\u003cp>A friendly \u003cspan class=\"story-hl\">clown\u003cspan class=\"gloss\">小丑\u003c/span>\u003c/span> appeared, and Amy could not stop smiling. Amy pointed at the \u003cspan class=\"story-hl\">pop star\u003cspan class=\"gloss\">流行歌星\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">treasure\u003cspan class=\"gloss\">宝藏\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Suddenly, Amy found a \u003cspan class=\"story-hl\">dentist\u003cspan class=\"gloss\">牙医\u003c/span>\u003c/span>. It was a truly \u003cspan class=\"story-hl\">tall\u003cspan class=\"gloss\">高的\u003c/span>\u003c/span> moment for Amy. Everything around Amy looked \u003cspan class=\"story-hl\">thin\u003cspan class=\"gloss\">瘦的\u003c/span>\u003c/span>.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">blonde\u003cspan class=\"gloss\">金色的\u003c/span>\u003c/span>!\" said Amy with a big smile. Amy carefully put the \u003cspan class=\"story-hl\">fair\u003cspan class=\"gloss\">浅色的\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">a police officer\u003cspan class=\"gloss\">一名警察\u003c/span>\u003c/span> appeared, and Amy could not stop smiling.\u003c/p>\u003cp>Amy pointed at the \u003cspan class=\"story-hl\">fire station\u003cspan class=\"gloss\">消防站\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>On her last evening at the farm, Amy watched the sunset and thought about all the wonderful things she had seen that week.\u003c/p>", "words": ["clown", "pop star", "treasure", "dentist", "tall", "thin", "blonde", "fair", "a police officer", "fire station"]}}, {"id": "P_L2_U04", "material": "Power Up", "level": "2", "no": 4, "title": "Unit 4 · The Family at Home", "low": true, "words": [{"en": "parents", "say": "parents", "key": "parents", "zh": "父母", "emoji": "👨‍👩‍👧", "pattern": "The parents are standing behind Jenny.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“父母”，再跟读英文。", "visual": "词义图标场景"}, {"en": "uncle", "say": "uncle", "key": "uncle", "zh": "叔叔", "emoji": "👨", "pattern": "Jenny's aunt is sitting between her mum and uncle.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“叔叔”，再跟读英文。", "visual": "词义图标场景"}, {"en": "aunt", "say": "aunt", "key": "aunt", "zh": "阿姨", "emoji": "👩", "pattern": "Jenny's aunt is sitting between her mum and uncle.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“阿姨”，再跟读英文。", "visual": "词义图标场景"}, {"en": "cousin", "say": "cousin", "key": "cousin", "zh": "表兄弟姐妹", "emoji": "", "pattern": "The parents are standing behind Jenny.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“表兄弟姐妹”，再跟读英文。", "visual": "词义情境分镜"}, {"en": "grandparents", "say": "grandparents", "key": "grandparents", "zh": "祖父母", "emoji": "👴", "pattern": "___ is …ing behind/between/in front of ___.", "sources": ["Lesson 2 · Vocabulary & Expressions 2"], "task": "观察图片，用动作或中文解释“祖父母”，再跟读英文。", "visual": "词义图标场景"}, {"en": "daughter", "say": "daughter", "key": "daughter", "zh": "女儿", "emoji": "👧", "pattern": "___ is …ing behind/between/in front of ___.", "sources aining": ["parents", "uncle", "daughter", "son", "grandson", "granddaughter", "basement", "roof", "first floor", "second floor", "third floor", "inside", "outside", "upstairs", "food mixer", "washing machine", "dishwasher", "hair dryer", "vacuum cleaner", "camera", "text", "speaker", "ring"], "guide": "本篇围绕“The Family at Home”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "The family gathers at home."}, {"q": "What happens next? 后来发生了什么？", "a": "An aunt and a cousin wait on the balcony while Dad meets the grandparents downstairs."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "Everyone makes room at the table so the whole family can sit together."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 4 · The Family at Home", "context": "Power Up Level 2 · Unit 4 · The Family at Home", "theme": {"key": "farm", "title_cn": "农场假日", "title_en": "Holiday on the Farm", "subject": "Amy", "opening": "\u003cp>During the summer holiday, \u003cb>Amy\u003c/b> went to visit her grandpa's farm. There was so much to see and do every single day.\u003c/p>", "closing": "\u003cp>On her last evening at the farm, Amy watched the sunset and thought about all the wonderful things she had seen that week.\u003c/p>", "moral": "走进真实的生活去观察和体验，是记住新单词最好的方法之一。"}, "bodyHtml": "\u003cp>During the summer holiday, \u003cb>Amy\u003c/b> went to visit her grandpa's farm. There was so much to see and do every single day.\u003c/p>\u003cp>A friendly \u003cspan class=\"story-hl\">parents\u003cspan class=\"gloss\">父母\u003c/span>\u003c/span> appeared, and Amy could not stop smiling. Amy pointed at the \u003cspan class=\"story-hl\">cousin\u003cspan class=\"gloss\">表兄弟姐妹\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">son\u003cspan class=\"gloss\">儿子\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Suddenly, Amy found a \u003cspan class=\"story-hl\">basement\u003cspan class=\"gloss\">地下室\u003c/span>\u003c/span>. There, Amy noticed a \u003cspan class=\"story-hl\">roof\u003cspan class=\"gloss\">屋顶\u003c/span>\u003c/span> nearby. Amy picked up the \u003cspan class=\"story-hl\">third floor\u003cspan class=\"gloss\">三楼\u003c/span>\u003c/span> and smiled.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">stairs\u003cspan class=\"gloss\">楼梯\u003c/span>\u003c/span>!\" said Amy with a big smile. Amy carefully put the \u003cspan class=\"story-hl\">food mixer\u003cspan class=\"gloss\">搅拌机\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">hair dryer\u003cspan class=\"gloss\">吹风机\u003c/span>\u003c/span> appeared, and Amy could not stop smiling.\u003c/p>\u003cp>Amy pointed at the \u003cspan class=\"story-hl\">text\u003cspan class=\"gloss\">短信\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>On her last evening at the farm, Amy watched the sunset and thought about all the wonderful things she had seen that week.\u003c/p>", "words": ["parents", "cousin", "son", "basement", "roof", "third floor", "stairs", "food mixer", "hair dryer", "text"]}}, {"id": "P_L2_U05", "material": "Power Up", "level": "2", "no": 5, "title": "Unit 5 · Animal World", "low": true, "words": [{"en": "parrot", "say": "parrot", "key": "parrot", "zh": "鹦鹉", "emoji": "🦜", "pattern": "… is/are …ing.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“鹦鹉”，再跟读英文。", "visual": "词义图标场景"}, {"en": "rabbit", "say": "rabbit", "key": "rabbit", "zh": "兔子", "emoji": "🐰", "pattern": "… is/are …ing.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“兔子”，再跟读英文。", "visual": "词义图标场景"}, {"en": "kangaroo", "say": "kangaroo", "key": "kangaroo", "zh": "袋鼠", "emoji": "🦘", "pattern": "… is/are …ing.", "sources": ["Lesson 1 · an class=\"story-hl\">hide\u003cspan class=\"gloss\">躲藏\u003c/span>\u003c/span>.\u003c/p>\u003cp>\"Let's \u003cspan class=\"story-hl\">fall\u003cspan class=\"gloss\">跌落\u003c/span>\u003c/span> together!\" said Emma. Every morning, Emma liked to \u003cspan class=\"story-hl\">walk\u003cspan class=\"gloss\">走\u003c/span>\u003c/span>. There, Emma noticed a \u003cspan class=\"story-hl\">fish\u003cspan class=\"gloss\">鱼\u003c/span>\u003c/span> nearby.\u003c/p>\u003cp>Emma picked up the \u003cspan class=\"story-hl\">wombat\u003cspan class=\"gloss\">袋熊\u003c/span>\u003c/span> and smiled.\u003c/p>\u003cp>As the sun set over the water, Emma waved goodbye to her new friends. \"I can't wait to come back tomorrow!\" she said happily.\u003c/p>", "words": ["parrot", "kangaroo", "lion", "whale", "run", "hide", "fall", "walk", "fish", "wombat"]}}, {"id": "P_L2_U06", "material": "Power Up", "level": "2", "no": 6, "title": "Unit 6 · Our Weather", "low": true, "words": [{"en": "snow", "say": "snow", "key": "snow", "zh": "雪", "emoji": "❄️", "pattern": "What's the weather like? It's _______.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“雪”，再跟读英文。", "visual": "天气变化"}, {"en": "sunny", "say": "sunny", "key": "sunny", "zh": "晴朗的", "emoji": "☀️", "pattern": "What's the weather like? It's _______.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“晴朗的”，再跟读英文。", "visual": "天气变化"}, {"en": "cloud", "say": "cloud", "key": "cloud", "zh": "云", "emoji": "☁️", "pattern": "What's the weather like? It's _______.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“云”，再跟读英文。", "visual": "天气变化"}, {"en": "wind", "say": "wind", "key": "wind", "zh": "风", "emoji": "💨", "pattern": "What's the weather like? It's _______.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“风”，再跟读英文。", "visual": "天气变化"}, {"en": "hot", "say": "hot", "key": "hot", "zh": "热", "emoji": "🥵", "pattern": "Is it _______ (cold ": {"title": "After the Rain", "text": "A cloud covers the sun as the children leave home. They put on scarves because the wind feels cold. Rain falls, and they wait indoors. Later, a rainbow appears. They change into lighter clothes and enjoy the sunny afternoon.", "used": ["sunny", "cloud", "wind", "rainbow", "cold", "rain", "put on"], "remaining": ["snow", "hot", "T-shirt", "shorts", "sweater", "scarf", "boots", "coat", "take off", "rain gauge", "weather vane", "thermometer", "imagine", "splash", "blow"], "guide": "本篇围绕“Our Weather”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "A cloud covers the sun as the children leave home."}, {"q": "What happens next? 后来发生了什么？", "a": "They put on scarves because the wind feels cold."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "They change into lighter clothes and enjoy the sunny afternoon."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 6 · Our Weather", "context": "Power Up Level 2 · Unit 6 · Our Weather", "theme": {"key": "zoo", "title_cn": "动物园惊喜", "title_en": "A Surprise at the Zoo", "subject": "Zoe", "opening": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>", "closing": "\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "moral": "保护动物、爱护自然，是每个小朋友都可以从小做起的事情。"}, "bodyHtml": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>\u003cp>Zoe pointed at the \u003cspan class=\"story-hl\">snow\u003cspan class=\"gloss\">雪\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">cloud\u003cspan class=\"gloss\">云\u003c/span>\u003c/span> waiting to be discovered. Zoe felt very \u003cspan class=\"story-hl\">hot\u003cspan class=\"gloss\">热\u003c/span>\u003c/span> at that moment.\u003c/p>\u003cp>It was a truly \u003cspan class=\"story-hl\">cold\u003cspan class=\"gloss\">冷\u003c/span>\u003c/span> moment for Zoe. Zoe picked up the \u003cspan class=\"story-hl\">T-shirt\u003cspan class=\"gloss\">T恤\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">scarf\u003cspan class=\"gloss\">围巾\u003c/span>\u003c/span>!\" said Zoe with a big smile.\u003c/p>\u003cp>Zoe carefully put the \u003cspan class=\"story-hl\">coat\u003cspan class=\"gloss\">外套\u003c/span>\u003c/span> into a small bag. \"Let's \u003cspan class=\"story-hl\">take off\u003cspan class=\"gloss\">脱下/起飞\u003c/span>\u003c/span> together!\" said Zoe. Zoe pointed at the \u003cspan class=\"story-hl\">weather vane\u003cspan class=\"gloss\">风向标\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">imagine\u003cspan class=\"gloss\">想象\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "words": ["snow", "cloud", "hot", "cold", "T-shirt", "scarf", "coat", "take off", "weather vane", "imagine"]}}, {"id": "P_L2_U07", "material": "Power Up", "level": "2", "no": 7, "title": "Unit 7 · Let's Cook!", "low": true, "words": [{"en": "soup", "say": "soup", "key": "soup", "zh": "汤", "emoji": "🥣", "pattern": "—What … have you got?", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“汤”，再跟读英文。", "visual": "词义图标场景"}, {"en": "bowl", "say": "bowl", "key": "bowl", "zh": "碗", "emoji": "🥣", "pattern": "—What … have you got?", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“碗”，再跟读英文。", "visual": "词义图标场景"}, {"en": "vegeta ma decided to \u003cspan class=\"story-hl\">cook\u003cspan class=\"gloss\">做饭\u003c/span>\u003c/span>. Emma pointed at the \u003cspan class=\"story-hl\">drop\u003cspan class=\"gloss\">掉落\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">fry\u003cspan class=\"gloss\">煎/炸\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Emma found a \u003cspan class=\"story-hl\">kiwi\u003cspan class=\"gloss\">猕猴桃\u003c/span>\u003c/span>. There, Emma noticed a \u003cspan class=\"story-hl\">lettuce\u003cspan class=\"gloss\">生菜\u003c/span>\u003c/span> nearby.\u003c/p>\u003cp>Emma picked up the \u003cspan class=\"story-hl\">wash the dishes\u003cspan class=\"gloss\">洗碗\u003c/span>\u003c/span> and smiled.\u003c/p>\u003cp>As the sun set over the water, Emma waved goodbye to her new friends. \"I can't wait to come back tomorrow!\" she said happily.\u003c/p>", "words": ["soup", "vegetable", "sandwich", "cup", "cook", "drop", "fry", "kiwi", "lettuce", "wash the dishes"]}}, {"id": "P_L2_U08", "material": "Power Up", "level": "2", "no": 8, "title": "Unit 8 · Around Town", "low": true, "words": [{"en": "city centre", "say": "city centre", "key": "city centre", "zh": "市中心", "emoji": "🏙️", "pattern": "Can we …?", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“市中心”，再跟读英文。", "visual": "词义图标场景"}, {"en": "funfair", "say": "funfair", "key": "funfair", "zh": "游乐场", "emoji": "🎡", "pattern": "Can we …?", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“游乐场”，再跟读英文。", "visual": "词义图标场景"}, {"en": "map", "say": "map", "key": "map", "zh": "地图", "emoji": "🗺️", "pattern": "Can we …?", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“地图”，再跟读英文。", "visual": "路线示意"}, {"en": "ticket", "say": "ticket", "key": "ticket", "zh": "票", "emoji": "🎫", "pattern": "Can we …?", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“票”，再跟读英 cks the map before buying a ticket, so she knows how to get home after the ride.", "used": ["city centre", "funfair", "map", "ticket", "ride", "station", "café", "square", "library"], "remaining": ["car park", "road", "cinema", "hospital", "shopping centre", "supermarket", "sports centre", "swimming pool", "market", "bus station", "street lamp", "litter bin", "pedestrian crossing", "traffic lights", "pavement", "road sign", "bench", "bus stop", "seat", "driver"], "guide": "本篇围绕“Around Town”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "Ella takes a map to the city centre."}, {"q": "What happens next? 后来发生了什么？", "a": "She finds the library, the station and a café."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "She checks the map before buying a ticket, so she knows how to get home after the ride."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 8 · Around Town", "context": "Power Up Level 2 · Unit 8 · Around Town", "theme": {"key": "garden", "title_cn": "魔法花园", "title_en": "The Magic Garden", "subject": "Lily", "opening": "\u003cp>\u003cb>Lily\u003c/b> opened the little wooden gate and stepped into her grandmother's magic garden, where anything seemed possible.\u003c/p>", "closing": "\u003cp>When it was time to go home, Lily looked back at the garden one more time. \"I'll take good care of everything here,\" she promised.\u003c/p>", "moral": "用心照顾身边的小事物，就像用心记住每一个新单词一样，慢慢就会开花结果。"}, "bodyHtml": "\u003cp>\u003cb>Lily\u003c/b> opened the little wooden gate and stepped into her grandmother's magic garden, where anything seemed possible.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">city centre\u003cspan class=\"gloss\">市中心\u003c/span>\u003c/span>!\" said Lily with a big smile. Lily carefully put the \u003cspan class=\"story-hl\">map\u003cspan class=\"gloss\">地图\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">car park\u003cspan class=\"gloss\">停车场\u003c/span>\u003c/span> appeared, and Lily could not stop smiling.\u003c/p>\u003cp>Lily pointed at the \u003cspan class=\"story-hl\">café\u003cspan class=\"gloss\">咖啡馆\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">library\u003cspan class=\"gloss\">图书馆\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Lily found a \u003cspan class=\"story-hl\">supermarket\u003cspan class=\"gloss\">超市\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Lily noticed a \u003cspan class=\"story-hl\">market\u003cspan class=\"gloss\">市场\u003c/span>\u003c/span> nearby. Lily picked up the \u003cspan class=\"story-hl\">litter bin\u003cspan class=\"gloss\">垃圾桶\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">pavement\u003cspan class=\"gloss\">人行道\u003c/span>\u003c/span>!\" said Lily with a big smile.\u003c/p>\u003cp>Lily carefully put the \u003cspan class=\"story-hl\">bus stop\u003cspan class=\"gloss\">公交站\u003c/span>\u003c/span> into a small bag.\u003c/p>\u003cp>When it was time to go home, Lily looked back at the garden one more time. \"I'll take good care of everything here,\" she promised.\u003c/p>", "words": ["city centre", "map", "car park", "café", "library", "supermarket", "market", "litter bin", "pavement", "bus stop"]}}, {"id": "P_L2_U09", "material": "Power Up", "level": "2", "no": 9, "title": "Unit 9 · A Big Change", "low": true, "words": [{"en": "surprised", "say": "surprised", "key": "surprised", "zh": "惊讶的", "emoji": "😲", "pattern": "I'm/He's/She's ___.（adj.）", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“惊讶的”，再跟读英文。", "visual": "表情线索"}, {"en": "frightened", "say": "frightened", "key": "frightened", "zh": "害怕的", "emoji": "😨", "pattern": "I'm/He's/She's ___.（adj.）", "sources": ["Lesson 1 · Vocabu ening": "\u003cp>\u003cb>Alex\u003c/b> put on his space suit and climbed into his shiny rocket. \"Three, two, one, blast off!\" he shouted, and off they flew into space.\u003c/p>", "closing": "\u003cp>After a long journey through the stars, Alex landed safely back on Earth. He couldn't wait to tell everyone about his amazing trip.\u003c/p>", "moral": "太空探索需要勇气和耐心，正如学习新知识一样，一步一步来，就能到达远方。"}, "bodyHtml": "\u003cp>\u003cb>Alex\u003c/b> put on his space suit and climbed into his shiny rocket. \"Three, two, one, blast off!\" he shouted, and off they flew into space.\u003c/p>\u003cp>Everything around Alex looked \u003cspan class=\"story-hl\">surprised\u003cspan class=\"gloss\">惊讶的\u003c/span>\u003c/span>. Alex's new friend was \u003cspan class=\"story-hl\">dangerous\u003cspan class=\"gloss\">危险的\u003c/span>\u003c/span> and kind. Alex felt very \u003cspan class=\"story-hl\">exciting\u003cspan class=\"gloss\">令人兴奋的\u003c/span>\u003c/span> at that moment.\u003c/p>\u003cp>It was a truly \u003cspan class=\"story-hl\">thirsty\u003cspan class=\"gloss\">渴的\u003c/span>\u003c/span> moment for Alex. Alex pointed at the \u003cspan class=\"story-hl\">apartment\u003cspan class=\"gloss\">公寓\u003c/span>\u003c/span> and asked lots of questions. With a big smile, Alex began to \u003cspan class=\"story-hl\">travel\u003cspan class=\"gloss\">旅行\u003c/span>\u003c/span>.\u003c/p>\u003cp>Suddenly, Alex found a \u003cspan class=\"story-hl\">busy\u003cspan class=\"gloss\">忙碌的\u003c/span>\u003c/span>. There, Alex noticed a \u003cspan class=\"story-hl\">North America\u003cspan class=\"gloss\">北美洲\u003c/span>\u003c/span> nearby. Alex picked up the \u003cspan class=\"story-hl\">Asia\u003cspan class=\"gloss\">亚洲\u003c/span>\u003c/span> and smiled.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">Antarctica\u003cspan class=\"gloss\">南极洲\u003c/span>\u003c/span>!\" said Alex with a big smile.\u003c/p>\u003cp>After a long journey through the stars, Alex landed safely back on Earth. He couldn't wait t else if(/^(in|on|under|behind|beside|next to|between|in front of|above|below)$/.test(k)){let p={in:[100,95],on:[100,40],under:[100,137],behind:[137,63],beside:[160,92],'next to':[160,92],between:[100,90],'in front of':[100,113],above:[100,24],below:[100,147]}[k];a='<rect x="60" y="65" width="80" height="60" rx="7" fill="#CCD9F0" stroke="#7189CA" stroke-width="4"/>';if(k==='between')a='<rect x="25" y="65" width="35" height="60" rx="5" fill="#CCD9F0"/><rect x="140" y="65" width="35" height="60" rx="5" fill="#CCD9F0"/>';a+=`<circle cx="${p[0]}" cy="${p[1]}" r="12" fill="#E98888" stroke="white" stroke-width="3"/>`;kind='空间关系';motion='pulse'}
else if(/^(sun|sunny|rain|rainy|snow|snowy|cloud|cloudy|wind|windy|rainbow|storm|foggy|hot|cold|warm|cool)$/.test(k)){a='<circle cx="62" cy="61" r="26" fill="#F0CE6D"/><path d="M83 85q-22-40-42-6-30 0-24 24h132q20-34-12-32-8-26-32-8" fill="#C0D8EC"/>';if(/rain|storm/.test(k))a+='<g class="rain" stroke="#74A8DA" stroke-width="5"><path d="M48 117l-8 15m40-15l-8 15m40-15l-8 15m40-15l-8 15"/></g>';if(/snow|cold/.test(k))a+='<text x="48" y="142" font-size="25" fill="#74A8DA">❄ ❄ ❄</text>';if(/wind/.test(k))a+='<path d="M30 125h120m-105 16h85" stroke="#88BFAE" stroke-width="5"/>';kind='天气变化';motion='sway'}
else if(/^(seed|root|leaf|leaves|flower|grow|growth|sprout|plant|cycle|life cycle|hatch|pupa|caterpillar|butterfly)$/.test(k)){a='<path d="M28 143h146" stroke="#B1997F" stroke-width="9"/><g class="plant"><path d="M100 142V73" stroke="#639D83" stroke-width="7"/><path d="M100 108Q55 53 56 100q5 24 44 8M100 94q44-59 47-15-3 24-47 15" fill="#8BC5A0"/><circle cx="100" cy="59" r="18" fill="#EBA2B5"/><circle cx="100" cy="59" r="7" fill="#F4D577"/></g>';kind='生长过程';motion='pulse'}
else if(/^(map|compass|direction|navigation|route|distance|kilometer|meter|measurement)$/.test(k)){a='<path d="M30 55l45-16 48 15 45-15v98l-45 16-48-15-45 16z" fill="#E1EED8" stroke="#90B697" stroke-width="3"/><path d="M48 121q13-66 48-26t53-30" fill="none" stroke="#DE9A7B" stroke-width="5" stroke-dasharray="6 6"/><circle class="target" cx="149" cy="65" r="11" fill="#DE9A7B"/>';kind='路线示意';motion='none'}
else if(/^(solid|liquid|melt|freeze|temperature|heat|heat up|cool|water cycle|evaporation)$/.test(k)){a='<rect x="25" y="71" width="45" height="45" rx="8" fill="#A5CFEC"/><path d="M86 92h25m-8-8l9 8-9 8" stroke="#DFAC80" stroke-width="4"/><path d="M142 52q-50 61 0 80 50-19 0-80" fill="#80B6DD"/>';kind='物态转换';motion='pulse'}
else if(CONCEPTS[k]){let c=CONCEPTS[k];a=c.icons.map((icon,i)=>`<rect x="${6+i*65}" y="46" width="59" height="83" rx="10" fill="white" stroke="#D0DAEB"/><text x="${35+i*65}" y="87" text-anchor="middle" font-size="30">${esc(icon)}</text><text x="${35+i*65}" y="113" text-anchor="middle" font-size="8" fill="#40516A">${esc(c.labels[i])}</text>`).join('');a+='<path d="M62 35h72m-8-6l8 6-8 6" stroke="#B2A0D0" stroke-width="3" fill="none"/>';kind='词义情境分镜';motion='pulse'}
else if(e){a=`<path d="M20 148q75-25 160 0v25H20" fill="#DDEDDC"/><text x="100" y="116" font-size="78" text-anchor="middle">${esc(e)}</text>`;kind='词义图标场景';motion=/fish|dolphin|whale|boat|shark|seal|octopus/.test(k)?'travel':/bird|parrot|plane|rocket|butterfly/.test(k)?'sway':/food|bread|milk|cake|apple|banana/.test(k)?'none':'float'}
else{a=`<rect x="18" y="41" width="164" height="103" rx="18" fill="#fff" stroke="#B8C8E7" stroke-width="3"/><circle cx="50" cy="77" r="14" fill="#EAB783"/><path d="M75 77h91m-118 31h118" stroke="#9CB2D4" stroke-width="5"/><text x="100" y="132" text-anchor="middle" font-size="13" fill="#40516A">${esc(z)}</text>`;kind='词义关系图';motion='pulse'}
return `<svg class="scene" viewBox="0 0 200 180" role="img" aria-label="${esc(w.en+'：'+z+'；'+kind)}"><rect width="200" height="180" rx="22" fill="#F1F6FC"/><g class="${motion}">${a}</g></svg>`}
function mark(t,words){let safe=esc(t);const ks=[...new Set(words.map(x=>x.key).filter(x=>/^[a-z][a-z\s'-]*$/i.test(x)))].sort((a,b)=>b.length-a.length);if(!ks.length)return safe;return safe.replace(new RegExp('\\b('+ks.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi'),'<mark>$1</mark>')}
function card(w,i,low){return `<article class="card"><div class="card-top"><span>${String(i+1).padStart(2,'0')}</span><button class="sound" data-say="${esc(w.say)}" aria-label="朗读 ${esc(w.say)}">♪</button></div>${svg(w)}<h3>${esc(w.en)}</h3><p class="meaning">${esc(w.zh)}</p>${w.pattern?`<p class="example"><b>课中句型</b>${esc(w.pattern)}</p>`:''}<p class="task"><b>${low?'玩一玩':'表达挑战'}</b>${esc(w.task)}</p><details><summary>查看来源</summary>${w.sources.map(esc).join('<br>')}<br>图像：${esc(w.visual)}</details></article>`}
function story(u){return `<section class="story"><div class="story-heading"><span>THE READING CORNER</span><button data-say="${esc(u.story.text)}">♪ 朗读故事</button></div><h2>${esc(u.story.title)}</h2><p class="small">单元主题补充故事 · 编写内容，非教材原文 · ${u.story.text.split(/\s+/).length} words</p>${u.story.text.split('\n').map(p=>`<p class="reading">${mark(p,u.words)}</p>`).join('')}<div class="coach"><b>中文导读</b><p>${esc(u.story.guide)}</p></div><h3>读后说一说</h3>${u.story.questions.map((q,i)=>`<p>${i+1}. ${esc(q.q)}</p><details><summary>参考回应</summary>${esc(q.a)}</details>`).join('')}<div class="extension"><h3>${u.low?'亲子小任务':'阅读与表达延伸'}</h3>${u.extensions.map(x=>`<p>${esc(x)}</p>`).join('')}</div><details class="source-story"><summary>原 HTML 生成的小故事（保留原文）</summary><p class="small">原程序随机选择主题、词性句框；最多抽取 10 个词。部分表达可能不自然，建议仅用于核对。</p><h3>${esc(u.original?.theme.title_en||'无故事')}</h3>${u.original?.bodyHtml||''}<p>原故事选词：${u.original?.words.map(esc).join(' · ')||''}</p></details><div class="coverage"><b>故事中的单元词：</b>${u.story.used.map(esc).join(' · ')||'见主题与读后任务'}<br><b>其余词汇：</b>${u.story.remaining.map(esc).join(' · ')||'已全部覆盖'}<p>故事优先保证连贯；全部词汇均已在词卡中保留。任选 3 个剩余词，补写一句或补画一幕。</p></div></section>`}
function unitHTML(u,type='all'){return `<section class="unit" id="${u.id}"><header class="unit-head"><span>${esc(u.material)} / LEVEL ${u.level} / UNIT ${u.no}</span><h1>${esc(u.title)}</h1><p>${u.words.length} 条词汇 · ${u.low?'看图 · 做动作 · 亲子共读':'观察 · 推理 · 表达'}</p><div class="actions"><button data-export="${u.id}" data-kind="cards">下载本 Unit 词卡</button><button data-export="${u.id}" data-kind="story">下载本 Unit 故事</button></div></header>${type!=='story'?`<div class="cards">${u.words.map((w,i)=>card(w,i,u.low)).join('')}</div>`:''}${type!=='cards'?story(u):''}</section>`}
function render(){const q=($('#search')?.value||'').toLowerCase(),m=$('#material')?.value||'',l=$('#level')?.value||'';const rows=DATA.filter(u=>(!m||u.material===m)&&(!l||u.level===l)&&(!q||JSON.stringify([u.title,u.words.map(w=>[w.en,w.zh])]).toLowerCase().includes(q)));$('#content').innerHTML=rows.map(u=>unitHTML(u,TYPE)).join('')||'<p>未找到对应单元，请调整条件。</p>';$('#count').textContent=`${rows.length} 个 Unit · ${rows.reduce((n,u)=>n+u.words.length,0)} 条单元词汇`}
function exportUnit(u,type){let h=document.documentElement.cloneNode(true);h.querySelector('#content').innerHTML=unitHTML(u,type);h.querySelector('#dataset').textContent=JSON.stringify([u]).replace(/</g,'\\u003c');h.querySelector('#type').textContent=JSON.stringify(type);let blob=new Blob(['<!doctype html>'+h.outerHTML],{type:'text/html;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${u.id}_${type}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const DATA=JSON.parse($('#dataset').textContent),TYPE=JSON.parse($('#type').textContent);
$('#material').innerHTML='<option value="">全部教材</option>'+[...new Set(DATA.map(u=>u.material))].map(m=>`<option>${esc(m)}</option>`).join('');
function levels(){let m=$('#material').value;$('#level').innerHTML='<option value="">全部 Level</option>'+[...new Set(DATA.filter(u=>!m||u.material===m).map(u=>u.level))].sort((a,b)=>+a-+b).map(l=>`<option value="${l}">Level ${l}</option>`).join('')}
levels();render();$('#material').onchange=()=>{levels();render()};$('#level').onchange=render;$('#search').oninput=()=>{clearTimeout(window.searchTimer);window.searchTimer=setTimeout(render,180)};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.say)speak(b.dataset.say);if(b.dataset.export)exportUnit(DATA.find(u=>u.id===b.dataset.export),b.dataset.kind);if(b.id==='pause'){document.body.classList.toggle('paused');b.textContent=document.body.classList.contains('paused')?'继续动画':'暂停动画'}if(b.id==='print')window.print()});
</script></body></html>
