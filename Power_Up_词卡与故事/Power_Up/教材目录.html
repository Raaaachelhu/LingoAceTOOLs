e_cn": "动物园惊喜", "title_en": "A Surprise at the Zoo", "subject": "Zoe", "opening": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>", "closing": "\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "moral": "保护动物、爱护自然，是每个小朋友都可以从小做起的事情。"}, "bodyHtml": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>\u003cp>Zoe pointed at the \u003cspan class=\"story-hl\">bag\u003cspan class=\"gloss\">书包\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">chair\u003cspan class=\"gloss\">椅子\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Zoe found a \u003cspan class=\"story-hl\">teacher\u003cspan class=\"gloss\">老师\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Zoe noticed a \u003cspan class=\"story-hl\">pencil\u003cspan class=\"gloss\">铅笔\u003c/span>\u003c/span> nearby. Zoe picked up the \u003cspan class=\"story-hl\">pencil case\u003cspan class=\"gloss\">铅笔盒\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">paper\u003cspan class=\"gloss\">纸\u003c/span>\u003c/span>!\" said Zoe with a big smile.\u003c/p>\u003cp>Zoe carefully put the \u003cspan class=\"story-hl\">playground\u003cspan class=\"gloss\">操场\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">wall\u003cspan class=\"gloss\">墙\u003c/span>\u003c/span> appeared, and Zoe could not stop smiling. With a big smile, Zoe began to \u003cspan class=\"story-hl\">help\u003cspan class=\"gloss\">帮助\u003c/span>\u003c/span>.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">work together\u003cspan class=\"gloss\">一起工作/合作\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "words": ["bag", "chair", "teacher", "pencil", "pencil case", "paper", "playground", "wall", "help", "work together"]}}, {"id": "P_L1_U02", "material": "Power Up", "level": "1", "no": 2, "title": "Unit 2 · All About Us", "low": true, "words": [{"en": "family", "say": "family", "key": "family", "zh": "家庭", "emoji": "👨‍👩‍👧‍👦", "pattern": "This is Mr Friendly. He is Jenny and Jim's father.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“家庭”，再跟读英文。", "visual": "词义情境分镜"}, {"en": "mother (mum)", "say": "mother", "key": "mother", "zh": "妈妈", "emoji": "👩", "pattern": "This is Mrs Friendly. She is Jenny and Jim's mother.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“妈妈”，再跟读英文。", "visual": "词义图标场景"}, {"en": "father (dad)", "say": "father", "key": "father", "zh": "爸爸", "emoji": "👨", "pattern": "This is Mr Friendly. He is Jenny and Jim's father.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“爸爸”，再跟读英文。", "visual": "词义图标场景"}, {"en": "grandfather (grandpa)", "say": "grandfather", "key": "grandfather", "zh": "爷爷/外公", "emoji": "👴", "pattern": "Are you...? Yes, I'm your.../No, it isn't...", "sources": ["Lesson 2 · Vocabulary & Expressions 2"], "task": "观察图片，用动作或中文解释“爷爷/外公”，再跟读英文。", "visual": "词义图标场景"}, {"en": "grandmother (grandma)", "say": "grandmother", "key": "grandmother", "zh": "奶奶/外婆", "emoji": "👵", "pattern": "Are you...? Yes, I'm your.../No, it isn't...", "sources": ["Lesson 2 · Vocabulary & Expressions 2"], "task": "观察图片，用动作或中文解释“奶奶/外婆”，再跟读英文。", "visual": "词义图标场景"}, {"en": "brother", "say": "brother", "key": "brother", "zh": "兄弟", "emoji": "👦", "pattern": "Are you...? Yes, I'm your.../No, it isn't...", "sources": ["Lesson 2 · Vocabulary & Expressions 2"], "task": "观察图片，用动作或中文解释“兄弟”，再跟读英文。", "visual": "词义图标场景"}, {"en": "sister", "say": "sister", "key": "sister", "zh": "姐妹", "emoji": "👧", " 整句。"], "original": {"title": "Unit 2 · All About Us", "context": "Power Up Level 1 · Unit 2 · All About Us", "theme": {"key": "garden", "title_cn": "魔法花园", "title_en": "The Magic Garden", "subject": "Lily", "opening": "\u003cp>\u003cb>Lily\u003c/b> opened the little wooden gate and stepped into her grandmother's magic garden, where anything seemed possible.\u003c/p>", "closing": "\u003cp>When it was time to go home, Lily looked back at the garden one more time. \"I'll take good care of everything here,\" she promised.\u003c/p>", "moral": "用心照顾身边的小事物，就像用心记住每一个新单词一样，慢慢就会开花结果。"}, "bodyHtml": "\u003cp>\u003cb>Lily\u003c/b> opened the little wooden gate and stepped into her grandmother's magic garden, where anything seemed possible.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">family\u003cspan class=\"gloss\">家庭\u003c/span>\u003c/span>!\" said Lily with a big smile. Lily carefully put the \u003cspan class=\"story-hl\">grandfather (grandpa)\u003cspan class=\"gloss\">爷爷/外公\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">sister\u003cspan class=\"gloss\">姐妹\u003c/span>\u003c/span> appeared, and Lily could not stop smiling.\u003c/p>\u003cp>Lily pointed at the \u003cspan class=\"story-hl\">tail\u003cspan class=\"gloss\">尾巴\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">feet\u003cspan class=\"gloss\">脚\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Lily found a \u003cspan class=\"story-hl\">hair\u003cspan class=\"gloss\">头发\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Lily noticed a \u003cspan class=\"story-hl\">ear\u003cspan class=\"gloss\">耳朵\u003c/span>\u003c/span> nearby. Lily picked up the \u003cspan class=\"story-hl\">hand\u003cspan class=\"gloss\">手\u003c/span>\u003c/span> and smiled. Lily decided to \u003cspan class=\"story-hl\">taste\u003cspan class=\"gloss\">品尝\u003c/span>\u003c/span>.\u003c/p>\u003cp>Lily carefully put the \u003cspan class=\"sto ch."}, {"q": "What happens next? 后来发生了什么？", "a": "His friend brings a burger and a mango."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "Everyone eats together, and a small lunch becomes a happy picnic."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 4 · Food with Friends", "context": "Power Up Level 1 · Unit 4 · Food with Friends", "theme": {"key": "zoo", "title_cn": "动物园惊喜", "title_en": "A Surprise at the Zoo", "subject": "Zoe", "opening": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>", "closing": "\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "moral": "保护动物、爱护自然，是每个小朋友都可以从小做起的事情。"}, "bodyHtml": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>\u003cp>Zoe pointed at the \u003cspan class=\"story-hl\">burger\u003cspan class=\"gloss\">汉堡\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">chicken\u003cspan class=\"gloss\">小鸡\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Zoe found a \u003cspan class=\"story-hl\">water\u003cspan class=\"gloss\">水\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Zoe noticed a \u003cspan class=\"story-hl\">banana\u003cspan class=\"gloss\">香蕉\u003c/span>\u003c/span> nearby. Zoe picked up the \u003cspan class=\"story-hl\">fruit\u003cspan class=\"gloss\">水果\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">grapes\u003cspan class=\"gloss\">葡萄\u003c/span>\u003c/span>!\" said Zoe with a big smile.\u003c/p>\u003cp>Zoe carefully put the \u003cspan class=\"story-hl\">meat\u003cspan class=\"gloss\">肉\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">beans\u003cspan class=\"gloss\">豆子\u003c/span>\u003c/span> appeared, and Zoe could not stop smiling. Zoe pointed at the \u003cspan class=\"story-hl\">onion\u003cspan class=\"gloss\">洋葱\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">picnic\u003cspan class=\"gloss\">野餐\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "words": ["burger", "chicken", "water", "banana", "fruit", "grapes", "meat", "beans", "onion", "picnic"]}}, {"id": "P_L1_U05", "material": "Power Up", "level": "1", "no": 5, "title": "Unit 5 · Happy Birthday!", "low": true, "words": [{"en": "bike", "say": "bike", "key": "bike", "zh": "自行车", "emoji": "🚲", "pattern": "It's a kite.", "sources": ["Lesson 1 · Listening & Vocabulary 1"], "task": "观察图片，用动作或中文解释“自行车”，再跟读英文。", "visual": "词义图标场景"}, {"en": "kite", "say": "kite", "key": "kite", "zh": "风筝", "emoji": "🪁", "pattern": "It's a kite.", "sources": ["Lesson 1 · Listening & Vocabulary 1"], "task": "观察图片，用动作或中文解释“风筝”，再跟读英文。", "visual": "词义图标场景"}, {"en": "robot", "say": "robot", "key": "robot", "zh": "机器人", "emoji": "🤖", "pattern": "It's a kite.", "sources": ["Lesson 1 · Listening & Vocabulary 1"], "task": "观察图片，用动作或中文解释“机器人”，再跟读英文。", "visual": "词义图标场景"}, {"en": "plane", "say": "plane", "key": "plane", "zh": "飞机", "emoji": "✈️", "pattern": "It's a kite.", "sources": ["Lesson 1 · Listening & Vocabulary 1"], "task": "观察图片，用动作或中文解释“飞机”，再跟读英文。", "visual": "词义图标场景"}, {"en": "car", "say": "car", "key": "car", "zh": "汽车", "emoji": "🚗", "pattern": "Look at Eva! She is playing the toy house.", "sources": ["Lesson 2 · Vocabulary & Expressions 2"], "task": "观察图片，用动作或中文解释“汽车”，再跟读英文。", "visual": "词义图标场景"}, {"en": "ball", "say": "ball", "key": "ball", "zh": "球", "emoji": "⚽", "pattern": "Look at Eva! She i se", "computer", "keyboard", "mouse", "balloon", "box", "radio", "helicopter", "teddy", "ship", "board game", "circle", "square", "rectangle", "triangle"], "guide": "本篇围绕“Happy Birthday!”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "Ava gets a kite for her birthday."}, {"q": "What happens next? 后来发生了什么？", "a": "Her brother brings a ball and a toy robot."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "Up goes the kite!"}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 5 · Happy Birthday!", "context": "Power Up Level 1 · Unit 5 · Happy Birthday!", "theme": {"key": "space", "title_cn": "太空之旅", "title_en": "The Space Journey", "subject": "Alex", "opening": "\u003cp>\u003cb>Alex\u003c/b> put on his space suit and climbed into his shiny rocket. \"Three, two, one, blast off!\" he shouted, and off they flew into space.\u003c/p>", "closing": "\u003cp>After a long journey through the stars, Alex landed safely back on Earth. He couldn't wait to tell everyone about his amazing trip.\u003c/p>", "moral": "太空探索需要勇气和耐心，正如学习新知识一样，一步一步来，就能到达远方。"}, "bodyHtml": "\u003cp>\u003cb>Alex\u003c/b> put on his space suit and climbed into his shiny rocket. \"Three, two, one, blast off!\" he shouted, and off they flew into space.\u003c/p>\u003cp>Alex picked up the \u003cspan class=\"story-hl\">bike\u003cspan class=\"gloss\">自行车\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">robot\u003cspan class=\"gloss\">机器人\u003c/span>\u003c/span>!\" said Alex with a big smile. Alex carefully put the \u003cspan class=\"story-hl\">car\u003cspan class=\"gloss\">汽车\u003c/span>\u003c/span> into a small bag.\u003c/p>\u003cp>A friendly \u003cspan class=\"story-hl\">doll\u003cspan class=\"gloss\">玩偶\u003c/span>\u003c/span> appeared, and Alex could not stop smiling. Alex pointed at the \u003cspan class=\"story-hl\">computer\u003cspan class=\"gloss\">电脑\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">balloon\u003cspan class=\"gloss\">气球\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Suddenly, Alex found a \u003cspan class=\"story-hl\">radio\u003cspan class=\"gloss\">收音机\u003c/span>\u003c/span>. There, Alex noticed a \u003cspan class=\"story-hl\">teddy\u003cspan class=\"gloss\">泰迪熊\u003c/span>\u003c/span> nearby. Alex picked up the \u003cspan class=\"story-hl\">board game\u003cspan class=\"gloss\">桌游\u003c/span>\u003c/span> and smiled.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">square\u003cspan class=\"gloss\">正方形\u003c/span>\u003c/span>!\" said Alex with a big smile.\u003c/p>\u003cp>After a long journey through the stars, Alex landed safely back on Earth. He couldn't wait to tell everyone about his amazing trip.\u003c/p>", "words": ["bike", "robot", "car", "doll", "computer", "balloon", "radio", "teddy", "board game", "square"]}}, {"id": "P_L1_U06", "material": "Power Up", "level": "1", "no": 6, "title": "Unit 6 · A Day Out", "low": true, "words": [{"en": "car", "say": "car", "key": "car", "zh": "汽车", "emoji": "🚗", "pattern": "It's got some flowers in the park.", "sources": ["Lesson 1 · Vocabulary and Expression 1"], "task": "观察图片，用动作或中文解释“汽车”，再跟读英文。", "visual": "词义图标场景"}, {"en": "lorry", "say": "lorry", "key": "lorry", "zh": "卡车", "emoji": "🚚", "pattern": "It's got some flowers in the park.", "sources": ["Lesson 1 · Vocabulary and Expression 1"], "task": "观察图片，用动作或中文解释“卡车”，再跟读英文。", "visual": "词义图标场景"}, {"en": "garden", "say": "garden", "key": "garden", "zh": "花园", "emoji": "🌷", "pattern": "It's got some flowers in the park.", "sources": ["Lesson 1 · Vocabulary and Expression 1"], "task": "观察图片，用动作或中文解释“花园”，再跟读英文。", "visual": "词义图标场景"}, {"en": "park", "say": "park", "key": "park", "zh": "公园", "emoji": "🌳", "pattern": "It's , Leo uses the map to find the bus stop.", "used": ["park", "flower", "tree", "bus", "bus stop", "shop"], "remaining": ["car", "lorry", "garden", "train", "motorbike", "bear", "snake", "crocodile", "monkey", "tiger", "elephant", "hippo", "polar bear", "zebra", "lizard", "giraffe", "Arctic", "grassland", "jungle", "whale", "sea", "swing", "bamboo", "flamingos"], "guide": "本篇围绕“A Day Out”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "Leo takes a bus to the park."}, {"q": "What happens next? 后来发生了什么？", "a": "He sees a flower beside a tree and a shop near the bus stop."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "When it is time to go home, Leo uses the map to find the bus stop."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 6 · A Day Out", "context": "Power Up Level 1 · Unit 6 · A Day Out", "theme": {"key": "zoo", "title_cn": "动物园惊喜", "title_en": "A Surprise at the Zoo", "subject": "Zoe", "opening": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>", "closing": "\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "moral": "保护动物、爱护自然，是每个小朋友都可以从小做起的事情。"}, "bodyHtml": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>\u003cp>Zoe pointed at the \u003cspan class=\"story-hl\">car\u003cspan class=\"gloss\">汽车\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">park\u003cspan class=\"gloss\">公园\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Zoe found a \u003cspan class=\"story-hl\">train\u003cspan class=\"gloss\">火车\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Zoe noticed a \u003cspan class=\"story-hl\">motorbike\u003cspan class=\"gloss\">摩托车\u003c/span>\u003c/span> nearby. Zoe picked up the \u003cspan class=\"story-hl\">snake\u003cspan class=\"gloss\">蛇\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">tiger\u003cspan class=\"gloss\">老虎\u003c/span>\u003c/span>!\" said Zoe with a big smile.\u003c/p>\u003cp>Zoe carefully put the \u003cspan class=\"story-hl\">polar bear\u003cspan class=\"gloss\">北极熊\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">giraffe\u003cspan class=\"gloss\">长颈鹿\u003c/span>\u003c/span> appeared, and Zoe could not stop smiling. Zoe pointed at the \u003cspan class=\"story-hl\">jungle\u003cspan class=\"gloss\">丛林\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">swing\u003cspan class=\"gloss\">荡秋千\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "words": ["car", "park", "train", "motorbike", "snake", "tiger", "polar bear", "giraffe", "jungle", "swing"]}}, {"id": "P_L1_U07", "material": "Power Up", "level": "1", "no": 7, "title": "Unit 7 · Let's Play!", "low": true, "words": [{"en": "play tennis", "say": "play tennis", "key": "play tennis", "zh": "打网球", "emoji": "🎾", "pattern": "Let's play tennis!", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“打网球”，再跟读英文。", "visual": "词义图标场景"}, {"en": "play football", "say": "play football", "key": "play football", "zh": "踢足球", "emoji": "⚽", "pattern": "Let's play tennis!", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“踢足球”，再跟读英文。", "visual": "词义图标场景"}, {"en": "play basketball", "say": "play basketball", "key": "play basketball", "zh": "打篮球", "emoji": "🏀", "patt nds it on the sofa in the living room. Teddy is ready for a story.", "used": ["bedroom", "bed", "kitchen", "bathroom", "living room", "sofa", "lamp"], "remaining": ["radio", "dining room", "bath", "mirror", "armchair", "painting", "phone", "clock", "rug", "floor", "hall", "hut", "ranch", "houseboat", "flats", "stilt-house", "detached-house", "bounce", "worry"], "guide": "本篇围绕“At Home”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "Nina looks for her teddy in the bedroom."}, {"q": "What happens next? 后来发生了什么？", "a": "It is not on the bed or behind the lamp."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "Teddy is ready for a story."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 8 · At Home", "context": "Power Up Level 1 · Unit 8 · At Home", "theme": {"key": "farm", "title_cn": "农场假日", "title_en": "Holiday on the Farm", "subject": "Amy", "opening": "\u003cp>During the summer holiday, \u003cb>Amy\u003c/b> went to visit her grandpa's farm. There was so much to see and do every single day.\u003c/p>", "closing": "\u003cp>On her last evening at the farm, Amy watched the sunset and thought about all the wonderful things she had seen that week.\u003c/p>", "moral": "走进真实的生活去观察和体验，是记住新单词最好的方法之一。"}, "bodyHtml": "\u003cp>During the summer holiday, \u003cb>Amy\u003c/b> went to visit her grandpa's farm. There was so much to see and do every single day.\u003c/p>\u003cp>A friendly \u003cspan class=\"story-hl\">bedroom\u003cspan class=\"gloss\">卧室\u003c/span>\u003c/span> appeared, and Amy could not stop smiling. Amy pointed at the \u003cspan class=\"story-hl\">bed\u003cspan class=\"gloss\">床\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">bath\u003cspan class=\"gloss\">浴缸\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Suddenly, Amy found a \u003cspan class=\"story-hl\">bathroom\u003cspan class=\"gloss\">浴室\u003c/span>\u003c/span>. There, Amy noticed a \u003cspan class=\"story-hl\">lamp\u003cspan class=\"gloss\">台灯\u003c/span>\u003c/span> nearby. Amy picked up the \u003cspan class=\"story-hl\">phone\u003cspan class=\"gloss\">电话\u003c/span>\u003c/span> and smiled.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">rug\u003cspan class=\"gloss\">地毯\u003c/span>\u003c/span>!\" said Amy with a big smile. Amy carefully put the \u003cspan class=\"story-hl\">hut\u003cspan class=\"gloss\">小屋\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">houseboat\u003cspan class=\"gloss\">船屋\u003c/span>\u003c/span> appeared, and Amy could not stop smiling.\u003c/p>\u003cp>Amy pointed at the \u003cspan class=\"story-hl\">detached-house\u003cspan class=\"gloss\">独栋房屋\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>On her last evening at the farm, Amy watched the sunset and thought about all the wonderful things she had seen that week.\u003c/p>", "words": ["bedroom", "bed", "bath", "bathroom", "lamp", "phone", "rug", "hut", "houseboat", "detached-house"]}}, {"id": "P_L1_U09", "material": "Power Up", "level": "1", "no": 9, "title": "Unit 9 · Happy Holidays", "low": true, "words": [{"en": "sunglasses", "say": "sunglasses", "key": "sunglasses", "zh": "太阳镜", "emoji": "🕶️", "pattern": "What are you wearing?", "sources": ["Lesson 1 · Vocabulary & Expression 1"], "task": "观察图片，用动作或中文解释“太阳镜”，再跟读英文。", "visual": "词义图标场景"}, {"en": "hat", "say": "hat", "key": "hat", "zh": "帽子", "emoji": "🧢", "pattern": "What are you wearing?", "sources": ["Lesson 1 · Vocabulary & Expression 1"], "task": "观察图片，用动作或中文解释“帽子”，再跟读英文。", "visual": "词义图标场景"}, {"en": "boots", "say": "boots", "key": "boots", "zh": "靴子", "emoji": "👢", "pattern": "I'm wearing green boots.", "sources": ["Lesson 1 · Vocabulary & Expression 1"], "task": "观 ed. She offers him a chair and water. The best present at the party turns out to be a little kindness.", "used": ["clown", "pirate", "present", "treasure", "doctor"], "remaining": ["pop star", "film star", "nurse", "dentist", "cook", "farmer", "tall", "short", "fat", "thin", "straight", "blonde", "beard", "moustache", "fair", "curly", "a firefighter", "a police officer", "police station", "hospital", "fire station", "superhero", "good at"], "guide": "本篇围绕“Party time!”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "At the party, a clown meets a pirate beside a box of treasure."}, {"q": "What happens next? 后来发生了什么？", "a": "A child dressed as a doctor notices that the clown looks tired."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "The best present at the party turns out to be a little kindness."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 3 · Party time!", "context": "Power Up Level 2 · Unit 3 · Party time!", "theme": {"key": "farm", "title_cn": "农场假日", "title_en": "Holiday on the Farm", "subject": "Amy", "opening": "\u003cp>During the summer holiday, \u003cb>Amy\u003c/b> went to visit her grandpa's farm. There was so much to see and do every single day.\u003c/p>", "closing": "\u003cp>On her last evening at the farm, Amy watched the sunset and thought about all the wonderful things she had seen that week.\u003c/p>", "moral": "走进真实的生活去观察和体验，是记住新单词最好的方法之一。"}, "bodyHtml": "\u003cp>During the summer holiday, \u003cb>Amy\u003c/b> went to visit her grandpa's farm. There was so much to see and do every single day.\u003c/p>\u003cp>A friendly \u003cspan class=\"story-hl\">clown\u003cspan class=\"gloss\">小丑\u003c/span>\u003c/span> appeared, and Amy could not stop smiling. Amy pointed at the \u003cspan class=\"story-hl\">pop star\u003cspan class=\"gloss\">流行歌星\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">treasure\u003cspan class=\"gloss\">宝藏\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Suddenly, Amy found a \u003cspan class=\"story-hl\">dentist\u003cspan class=\"gloss\">牙医\u003c/span>\u003c/span>. It was a truly \u003cspan class=\"story-hl\">tall\u003cspan class=\"gloss\">高的\u003c/span>\u003c/span> moment for Amy. Everything around Amy looked \u003cspan class=\"story-hl\">thin\u003cspan class=\"gloss\">瘦的\u003c/span>\u003c/span>.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">blonde\u003cspan class=\"gloss\">金色的\u003c/span>\u003c/span>!\" said Amy with a big smile. Amy carefully put the \u003cspan class=\"story-hl\">fair\u003cspan class=\"gloss\">浅色的\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">a police officer\u003cspan class=\"gloss\">一名警察\u003c/span>\u003c/span> appeared, and Amy could not stop smiling.\u003c/p>\u003cp>Amy pointed at the \u003cspan class=\"story-hl\">fire station\u003cspan class=\"gloss\">消防站\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>On her last evening at the farm, Amy watched the sunset and thought about all the wonderful things she had seen that week.\u003c/p>", "words": ["clown", "pop star", "treasure", "dentist", "tall", "thin", "blonde", "fair", "a police officer", "fire station"]}}, {"id": "P_L2_U04", "material": "Power Up", "level": "2", "no": 4, "title": "Unit 4 · The Family at Home", "low": true, "words": [{"en": "parents", "say": "parents", "key": "parents", "zh": "父母", "emoji": "👨‍👩‍👧", "pattern": "The parents are standing behind Jenny.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“父母”，再跟读英文。", "visual": "词义图标场景"}, {"en": "uncle", "say": "uncle", "key": "uncle", "zh": "叔叔", "emoji": "👨", "pattern": "Jenny's aunt is sitting between her mum and uncle.", "sources": ["Lesson 1 · Vo  · The Family at Home", "theme": {"key": "farm", "title_cn": "农场假日", "title_en": "Holiday on the Farm", "subject": "Amy", "opening": "\u003cp>During the summer holiday, \u003cb>Amy\u003c/b> went to visit her grandpa's farm. There was so much to see and do every single day.\u003c/p>", "closing": "\u003cp>On her last evening at the farm, Amy watched the sunset and thought about all the wonderful things she had seen that week.\u003c/p>", "moral": "走进真实的生活去观察和体验，是记住新单词最好的方法之一。"}, "bodyHtml": "\u003cp>During the summer holiday, \u003cb>Amy\u003c/b> went to visit her grandpa's farm. There was so much to see and do every single day.\u003c/p>\u003cp>A friendly \u003cspan class=\"story-hl\">parents\u003cspan class=\"gloss\">父母\u003c/span>\u003c/span> appeared, and Amy could not stop smiling. Amy pointed at the \u003cspan class=\"story-hl\">cousin\u003cspan class=\"gloss\">表兄弟姐妹\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">son\u003cspan class=\"gloss\">儿子\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Suddenly, Amy found a \u003cspan class=\"story-hl\">basement\u003cspan class=\"gloss\">地下室\u003c/span>\u003c/span>. There, Amy noticed a \u003cspan class=\"story-hl\">roof\u003cspan class=\"gloss\">屋顶\u003c/span>\u003c/span> nearby. Amy picked up the \u003cspan class=\"story-hl\">third floor\u003cspan class=\"gloss\">三楼\u003c/span>\u003c/span> and smiled.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">stairs\u003cspan class=\"gloss\">楼梯\u003c/span>\u003c/span>!\" said Amy with a big smile. Amy carefully put the \u003cspan class=\"story-hl\">food mixer\u003cspan class=\"gloss\">搅拌机\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">hair dryer\u003cspan class=\"gloss\">吹风机\u003c/span>\u003c/span> appeared, and Amy could not stop smiling.\u003c/p>\u003cp>Amy pointed at the \u003cspan class=\"story-hl\">text\u003cspan class=\"gloss\">短信\u003c/span>\u003c/span> ater, Emma waved goodbye to her new friends. \"I can't wait to come back tomorrow!\" she said happily.\u003c/p>", "moral": "大海里藏着许多惊喜——就像学习新单词一样，每一次探索都会带来新的发现。"}, "bodyHtml": "\u003cp>Deep under the blue ocean, \u003cb>Emma\u003c/b> the little mermaid swam past colorful coral reefs, looking for her next adventure.\u003c/p>\u003cp>There, Emma noticed a \u003cspan class=\"story-hl\">parrot\u003cspan class=\"gloss\">鹦鹉\u003c/span>\u003c/span> nearby. Emma picked up the \u003cspan class=\"story-hl\">kangaroo\u003cspan class=\"gloss\">袋鼠\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">lion\u003cspan class=\"gloss\">狮子\u003c/span>\u003c/span>!\" said Emma with a big smile.\u003c/p>\u003cp>Emma carefully put the \u003cspan class=\"story-hl\">whale\u003cspan class=\"gloss\">鲸鱼\u003c/span>\u003c/span> into a small bag. With a big smile, Emma began to \u003cspan class=\"story-hl\">run\u003cspan class=\"gloss\">跑\u003c/span>\u003c/span>. Emma decided to \u003cspan class=\"story-hl\">hide\u003cspan class=\"gloss\">躲藏\u003c/span>\u003c/span>.\u003c/p>\u003cp>\"Let's \u003cspan class=\"story-hl\">fall\u003cspan class=\"gloss\">跌落\u003c/span>\u003c/span> together!\" said Emma. Every morning, Emma liked to \u003cspan class=\"story-hl\">walk\u003cspan class=\"gloss\">走\u003c/span>\u003c/span>. There, Emma noticed a \u003cspan class=\"story-hl\">fish\u003cspan class=\"gloss\">鱼\u003c/span>\u003c/span> nearby.\u003c/p>\u003cp>Emma picked up the \u003cspan class=\"story-hl\">wombat\u003cspan class=\"gloss\">袋熊\u003c/span>\u003c/span> and smiled.\u003c/p>\u003cp>As the sun set over the water, Emma waved goodbye to her new friends. \"I can't wait to come back tomorrow!\" she said happily.\u003c/p>", "words": ["parrot", "kangaroo", "lion", "whale", "run", "hide", "fall", "walk", "fish", "wombat"]}}, {"id": "P_L2_U06", "material": "Power Up", "level": "2", "no": 6, "title": "Unit 6 · Our Weather", "low": true, "words": [{"en": "snow", "say": "snow", "key": "snow 到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 6 · Our Weather", "context": "Power Up Level 2 · Unit 6 · Our Weather", "theme": {"key": "zoo", "title_cn": "动物园惊喜", "title_en": "A Surprise at the Zoo", "subject": "Zoe", "opening": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>", "closing": "\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "moral": "保护动物、爱护自然，是每个小朋友都可以从小做起的事情。"}, "bodyHtml": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>\u003cp>Zoe pointed at the \u003cspan class=\"story-hl\">snow\u003cspan class=\"gloss\">雪\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">cloud\u003cspan class=\"gloss\">云\u003c/span>\u003c/span> waiting to be discovered. Zoe felt very \u003cspan class=\"story-hl\">hot\u003cspan class=\"gloss\">热\u003c/span>\u003c/span> at that moment.\u003c/p>\u003cp>It was a truly \u003cspan class=\"story-hl\">cold\u003cspan class=\"gloss\">冷\u003c/span>\u003c/span> moment for Zoe. Zoe picked up the \u003cspan class=\"story-hl\">T-shirt\u003cspan class=\"gloss\">T恤\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">scarf\u003cspan class=\"gloss\">围巾\u003c/span>\u003c/span>!\" said Zoe with a big smile.\u003c/p>\u003cp>Zoe carefully put the \u003cspan class=\"story-hl\">coat\u003cspan class=\"gloss\">外套\u003c/span>\u003c/span> into a small bag. \"Let's \u003cspan class=\"story-hl\">take off\u003cspan class=\"gloss\">脱下/起飞\u003c/span>\u003c/span> together!\" said Zoe. Zoe pointed at the \u003cspan class=\"story-hl\">weather vane\u003cspan class=\"gloss\">风向标\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">imagine\u003cspan class=\"gloss\">想象\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "words": ["snow", "cloud", "hot", "cold", "T-shirt", "scarf", "coat", "take off", "weather vane", "imagine"]}}, {"id": "P_L2_U07", "material": "Power Up", "level": "2", "no": 7, "title": "Unit 7 · Let's Cook!", "low": true, "words": [{"en": "soup", "say": "soup", "key": "soup", "zh": "汤", "emoji": "🥣", "pattern": "—What … have you got?", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“汤”，再跟读英文。", "visual": "词义图标场景"}, {"en": "bowl", "say": "bowl", "key": "bowl", "zh": "碗", "emoji": "🥣", "pattern": "—What … have you got?", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“碗”，再跟读英文。", "visual": "词义图标场景"}, {"en": "vegetable", "say": "vegetable", "key": "vegetable", "zh": "蔬菜", "emoji": "🥦", "pattern": "—What … have you got?", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“蔬菜”，再跟读英文。", "visual": "词义图标场景"}, {"en": "plate", "say": "plate", "key": "plate", "zh": "盘子", "emoji": "🍽️", "pattern": "—What … have you got?", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“盘子”，再跟读英文。", "visual": "词义图标场景"}, {"en": "cheese", "say": "cheese", "key": "cheese", "zh": "奶酪", "emoji": "🧀", "pattern": "—What … have you got?", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“奶酪”，再跟读英文。", "visual": "词义图标场景"}, {"en": "sandwich", "say": "sandwich", "key": "sandwich", "zh": "三明治", "emoji": "🥪", "pattern": "—What … have you got?", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“三明治”，再跟读英文。", "visual": "词义图标场景"}, {"en": "pasta", "say": "pasta", "key": "pasta", "zh": "意大利面", "emoji": "🍝", "pattern": "Here are some ________ 卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 8 · Around Town", "context": "Power Up Level 2 · Unit 8 · Around Town", "theme": {"key": "garden", "title_cn": "魔法花园", "title_en": "The Magic Garden", "subject": "Lily", "opening": "\u003cp>\u003cb>Lily\u003c/b> opened the little wooden gate and stepped into her grandmother's magic garden, where anything seemed possible.\u003c/p>", "closing": "\u003cp>When it was time to go home, Lily looked back at the garden one more time. \"I'll take good care of everything here,\" she promised.\u003c/p>", "moral": "用心照顾身边的小事物，就像用心记住每一个新单词一样，慢慢就会开花结果。"}, "bodyHtml": "\u003cp>\u003cb>Lily\u003c/b> opened the little wooden gate and stepped into her grandmother's magic garden, where anything seemed possible.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">city centre\u003cspan class=\"gloss\">市中心\u003c/span>\u003c/span>!\" said Lily with a big smile. Lily carefully put the \u003cspan class=\"story-hl\">map\u003cspan class=\"gloss\">地图\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">car park\u003cspan class=\"gloss\">停车场\u003c/span>\u003c/span> appeared, and Lily could not stop smiling.\u003c/p>\u003cp>Lily pointed at the \u003cspan class=\"story-hl\">café\u003cspan class=\"gloss\">咖啡馆\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">library\u003cspan class=\"gloss\">图书馆\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Lily found a \u003cspan class=\"story-hl\">supermarket\u003cspan class=\"gloss\">超市\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Lily noticed a \u003cspan class=\"story-hl\">market\u003cspan class=\"gloss\">市场\u003c/span>\u003c/span> nearby. Lily picked up the \u003cspan class=\"story-hl\">litter bin\u003cspan class=\"gloss\">垃圾桶\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">pavement\u003cspan class=\"gloss\">人行道\u003c/span>\u003c/spa ", "apartment", "adventure", "world tour", "travel", "round", "blanket", "busy", "text", "call", "North America", "South America", "Europe", "Asia", "Africa", "Australia", "Antarctica", "wood", "mystery", "clue"], "guide": "本篇围绕“A Big Change”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "Noah is excited about a new club, but he feels afraid at the door."}, {"q": "What happens next? 后来发生了什么？", "a": "The first activity looks difficult."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "Later, he writes an email about his day."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 9 · A Big Change", "context": "Power Up Level 2 · Unit 9 · A Big Change", "theme": {"key": "space", "title_cn": "太空之旅", "title_en": "The Space Journey", "subject": "Alex", "opening": "\u003cp>\u003cb>Alex\u003c/b> put on his space suit and climbed into his shiny rocket. \"Three, two, one, blast off!\" he shouted, and off they flew into space.\u003c/p>", "closing": "\u003cp>After a long journey through the stars, Alex landed safely back on Earth. He couldn't wait to tell everyone about his amazing trip.\u003c/p>", "moral": "太空探索需要勇气和耐心，正如学习新知识一样，一步一步来，就能到达远方。"}, "bodyHtml": "\u003cp>\u003cb>Alex\u003c/b> put on his space suit and climbed into his shiny rocket. \"Three, two, one, blast off!\" he shouted, and off they flew into space.\u003c/p>\u003cp>Everything around Alex looked \u003cspan class=\"story-hl\">surprised\u003cspan class=\"gloss\">惊讶的\u003c/span>\u003c/span>. Alex's new friend was \u003cspan class=\"story-hl\">dangerous\u003cspan class=\"gloss\">危险的\u003c/span>\u003c/span> and kind. Alex felt very \u003cspan class=\"story-hl\">exciting\u003cspan class=\"gloss\">令人兴奋的\u003c/span>\u003c/span> at that moment.\u003c/p>\u003cp>It was a truly \u003cspan class=\"story-hl\">thirsty\u003cspan class=\"gloss\">渴的\u003c/span>\u003c/span> moment for Alex. Alex pointed at the \u003cspan class=\"story-hl\">apartment\u003cspan class=\"gloss\">公寓\u003c/span>\u003c/span> and asked lots of questions. With a big smile, Alex began to \u003cspan class=\"story-hl\">travel\u003cspan class=\"gloss\">旅行\u003c/span>\u003c/span>.\u003c/p>\u003cp>Suddenly, Alex found a \u003cspan class=\"story-hl\">busy\u003cspan class=\"gloss\">忙碌的\u003c/span>\u003c/span>. There, Alex noticed a \u003cspan class=\"story-hl\">North America\u003cspan class=\"gloss\">北美洲\u003c/span>\u003c/span> nearby. Alex picked up the \u003cspan class=\"story-hl\">Asia\u003cspan class=\"gloss\">亚洲\u003c/span>\u003c/span> and smiled.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">Antarctica\u003cspan class=\"gloss\">南极洲\u003c/span>\u003c/span>!\" said Alex with a big smile.\u003c/p>\u003cp>After a long journey through the stars, Alex landed safely back on Earth. He couldn't wait to tell everyone about his amazing trip.\u003c/p>", "words": ["surprised", "dangerous", "exciting", "thirsty", "apartment", "travel", "busy", "North America", "Asia", "Antarctica"]}}, {"id": "P_L3_U01", "material": "Power Up", "level": "3", "no": 1, "title": "Unit 1 · Practice Time", "low": false, "words": [{"en": "meal", "say": "meal", "key": "meal", "zh": "一餐", "emoji": "🍽️", "pattern": "What time do/does ___ have ___?", "sources": ["Lesson 1 · Vocabulary & Expressions", "Lesson 2 · Conversation & Story"], "task": "解释“一餐”与单元主题的联系，用 meal 口述或写一句自己的表达。", "visual": "词义图标场景"}, {"en": "snack", "say": "snack", "key": "snack", "zh": "零食", "emoji": "🍪", "pattern": "What time do/does ___ have ___?", "sources": ["Lesson 1 · Vocabulary & Expressions", "Lesson 2 · Conversation & Story"], "task": "解释“零食”与单元主题的联系，用 snack 口述或写一句自己的表达。", "visual": "词义图标场景"}, {"en": "lunch", "say": "lunch", "key": "lunch", "zh": "午餐", "emoji": "🍱", "pattern": "What time do/does ___ have ___?", "sources": ["Lesson 1 · Vocabula ctice ends with a meal and a proud smile.", "used": ["meal", "lunch", "midday", "dance", "laugh"], "remaining": ["snack", "dinner", "half past …", "midnight", "… o'clock", "o'clock", "shout", "hop", "skip", "dress up", "brain", "balance", "gymnastics", "control", "train", "perform", "gymnast", "gold medal", "silver medal", "stage", "come true", "support"], "guide": "本篇围绕“Practice Time”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "What is the main topic? Name one detail that supports your answer.", "a": "Topic: Practice Time. A supporting detail: At half past eleven, someone starts to laugh after a small mistake."}, {"q": "What action, observation or decision moves the story forward?", "a": "They try again instead of shouting at each other."}, {"q": "What can you conclude? Which part is evidence, and which part is your interpretation?", "a": "参考结尾：Their practice ends with a meal and a proud smile. 先引用原文，再解释自己的推断。开放题允许不同答案。"}]}, "extensions": ["画出“情境—行动—结果”关系图，用故事中的具体细节解释一个因果关系。", "词汇迁移：从本 Unit 选 5 个词，写一段与“Practice Time”有关的新情境；不用逐词硬塞，优先保证意思连贯。", "表达支架：I think ... because ... / The story shows ... / Another possibility is ...", "写作建议：先用 4–6 句表达清楚；高 Level 可扩为 80–120 词，增加证据、不同观点或局限。Level 是教材内等级，各教材不直接等同。"], "original": {"title": "Unit 1 · Practice Time", "context": "Power Up Level 3 · Unit 1 · Practice Time", "theme": {"key": "zoo", "title_cn": "动物园惊喜", "title_en": "A Surprise at the Zoo", "subject": "Zoe", "opening": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>", "closing": "\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "moral": "保护动物、爱护自然，是每个小朋友都可以从小做起的事情。"}, "bodyHtml": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>\u003cp>Zoe pointed at the \u003cspan class=\"story-hl\">meal\u003cspan class=\"gloss\">一餐\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">lunch\u003cspan class=\"gloss\">午餐\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Zoe found a \u003cspan class=\"story-hl\">midday\u003cspan class=\"gloss\">正午\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Zoe noticed a \u003cspan class=\"story-hl\">o'clock\u003cspan class=\"gloss\">……点钟\u003c/span>\u003c/span> nearby. \"Let's \u003cspan class=\"story-hl\">laugh\u003cspan class=\"gloss\">笑\u003c/span>\u003c/span> together!\" said Zoe. Every morning, Zoe liked to \u003cspan class=\"story-hl\">skip\u003cspan class=\"gloss\">跳绳/跳过\u003c/span>\u003c/span>.\u003c/p>\u003cp>Zoe carefully put the \u003cspan class=\"story-hl\">balance\u003cspan class=\"gloss\">平衡\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">control\u003cspan class=\"gloss\">控制\u003c/span>\u003c/span> appeared, and Zoe could not stop smiling. Zoe pointed at the \u003cspan class=\"story-hl\">gymnast\u003cspan class=\"gloss\">体操运动员\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">stage\u003cspan class=\"gloss\">舞台\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "words": ["meal", "lunch", "midday", "o'clock", "laugh", "skip", "balance", "control", "gymnast", "stage"]}}, {"id": "P_L3_U02", "material": "Power Up", "level": "3", "no": 2, "title": "Unit 2 · What's for Breakfast?", "low": false, "words": [{"en": "coffee", "say": "coffee", "key": "coffee", "zh": "咖啡", "emoji": "☕", "pattern": "What would you like for breakfast?", "sources": ["Lesson 1 · Vocabulary & Expressions", "Lesson 2 · Conversation & Story"], "task": "解释“咖啡”与单元主题的联系，用 coffee 口述或写一句自己的 hey compare their breakfasts and plan a meal with several kinds of food."}, {"q": "What can you conclude? Which part is evidence, and which part is your interpretation?", "a": "参考结尾：Nobody needs the same plate to enjoy breakfast together. 先引用原文，再解释自己的推断。开放题允许不同答案。"}]}, "extensions": ["画出“情境—行动—结果”关系图，用故事中的具体细节解释一个因果关系。", "词汇迁移：从本 Unit 选 5 个词，写一段与“What's for Breakfast?”有关的新情境；不用逐词硬塞，优先保证意思连贯。", "表达支架：I think ... because ... / The story shows ... / Another possibility is ...", "写作建议：先用 4–6 句表达清楚；高 Level 可扩为 80–120 词，增加证据、不同观点或局限。Level 是教材内等级，各教材不直接等同。"], "original": {"title": "Unit 2 · What's for Breakfast?", "context": "Power Up Level 3 · Unit 2 · What's for Breakfast?", "theme": {"key": "school", "title_cn": "校园的一天", "title_en": "A Day at School", "subject": "Tom", "opening": "\u003cp>It was a busy morning at school. \u003cb>Tom\u003c/b> walked into his classroom, said hello to his friends, and got ready for a fun day of learning.\u003c/p>", "closing": "\u003cp>When the bell rang at the end of the day, Tom packed up his things, feeling proud of everything he had learned.\u003c/p>", "moral": "每天在学校里认真学习一点点，日积月累就会有大大的进步。"}, "bodyHtml": "\u003cp>It was a busy morning at school. \u003cb>Tom\u003c/b> walked into his classroom, said hello to his friends, and got ready for a fun day of learning.\u003c/p>\u003cp>Tom carefully put the \u003cspan class=\"story-hl\">coffee\u003cspan class=\"gloss\">咖啡\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">milkshake\u003cspan class=\"gloss\">奶昔\u003c/span>\u003c/span> appeared, and Tom could not stop smiling. Tom pointed at the \u003cspan class=\"story-hl\">strawberry\u003cspan class=\"gloss\">草莓\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">yoghurt\u003cspan class=\"gloss\">酸奶\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Tom found a \u003cspan class=\"story-hl\">taught\u003cspan class=\"gloss\">教（过去式 taught）\u003c/span>\u003c/span>. There, Tom noticed a \u003cspan class=\"story-hl\">gave\u003cspan class=\"gloss\">给（过去式 gave）\u003c/span>\u003c/span> nearby.\u003c/p>\u003cp>Tom picked up the \u003cspan class=\"story-hl\">iron\u003cspan class=\"gloss\">铁\u003c/span>\u003c/span> and smiled. Tom's new friend was \u003cspan class=\"story-hl\">fat\u003cspan class=\"gloss\">胖的\u003c/span>\u003c/span> and kind. Tom carefully put the \u003cspan class=\"story-hl\">dip\u003cspan class=\"gloss\">蘸酱\u003c/span>\u003c/span> into a small bag.\u003c/p>\u003cp>A friendly \u003cspan class=\"story-hl\">different\u003cspan class=\"gloss\">不同的\u003c/span>\u003c/span> appeared, and Tom could not stop smiling.\u003c/p>\u003cp>When the bell rang at the end of the day, Tom packed up his things, feeling proud of everything he had learned.\u003c/p>", "words": ["coffee", "milkshake", "strawberry", "yoghurt", "taught", "gave", "iron", "fat", "dip", "different"]}}, {"id": "P_L3_U03", "material": "Power Up", "level": "3", "no": 3, "title": "Unit 3 · A Healthy Body", "low": false, "words": [{"en": "coffee*", "say": "coffee", "key": "coffee", "zh": "咖啡", "emoji": "☕", "pattern": "What are those red things? They're bandages.", "sources": ["Lesson 1 · Vocabulary & Expressions"], "task": "解释“咖啡”与单元主题的联系，用 coffee 口述或写一句自己的表达。", "visual": "词义图标场景"}, {"en": "shoulder", "say": "shoulder", "key": "shoulder", "zh": "肩膀", "emoji": "", "pattern": "What are those red things? They're bandages.", "sources": ["Lesson 1 · Vocabulary & Expressions", "Lesson 2 · Conversation & Story"], "task": "解释“肩膀”与单元主题的联系，用 shoulder 口述或写一句自己的表达。", "visual": "身体定位"}, {"en": "neck", "say": "neck", "key": "neck", "zh": "脖子", "emoji": "", "pattern": "What are those red things? They're bandages.", "sources": ["Lesson 1 · Vocabulary & Expressions", "Lesson 2 · Conversation & Story"], "task": "解释“脖子”与单元主题的联系，用 neck 口述或写一句自己的表达。", "visual": "身体定位"}, {"en": "finger", "say": "finger", "key": "finger", "zh": "手指", "emoji": "👆", "pattern": "Wh e help."}, {"q": "What can you conclude? Which part is evidence, and which part is your interpretation?", "a": "参考结尾：Taking care of his body matters more than finishing one game. 先引用原文，再解释自己的推断。开放题允许不同答案。"}]}, "extensions": ["画出“情境—行动—结果”关系图，用故事中的具体细节解释一个因果关系。", "词汇迁移：从本 Unit 选 5 个词，写一段与“A Healthy Body”有关的新情境；不用逐词硬塞，优先保证意思连贯。", "表达支架：I think ... because ... / The story shows ... / Another possibility is ...", "写作建议：先用 4–6 句表达清楚；高 Level 可扩为 80–120 词，增加证据、不同观点或局限。Level 是教材内等级，各教材不直接等同。"], "original": {"title": "Unit 3 · A Healthy Body", "context": "Power Up Level 3 · Unit 3 · A Healthy Body", "theme": {"key": "zoo", "title_cn": "动物园惊喜", "title_en": "A Surprise at the Zoo", "subject": "Zoe", "opening": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>", "closing": "\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "moral": "保护动物、爱护自然，是每个小朋友都可以从小做起的事情。"}, "bodyHtml": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>\u003cp>Zoe pointed at the \u003cspan class=\"story-hl\">coffee*\u003cspan class=\"gloss\">咖啡\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">finger\u003cspan class=\"gloss\">手指\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Zoe found a \u003cspan class=\"story-hl\">knee\u003cspan class=\"gloss\">膝盖\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Zoe noticed a \u003cspan class=\"story-hl\">stomach\u003cspan class=\"gloss\">肚子\u003c/span>\u003c/span> nearby. Zoe picked up the \u003cspan class=\"story-hl\">cough\u003cspan class=\"gloss\">咳嗽\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">stomach-ache\u003cspan class=\"gloss\">肚子痛\u003c/span>\u003c/span>!\" said Zoe with a big smile.\u003c/p> else if(/^(seed|root|leaf|leaves|flower|grow|growth|sprout|plant|cycle|life cycle|hatch|pupa|caterpillar|butterfly)$/.test(k)){a='<path d="M28 143h146" stroke="#B1997F" stroke-width="9"/><g class="plant"><path d="M100 142V73" stroke="#639D83" stroke-width="7"/><path d="M100 108Q55 53 56 100q5 24 44 8M100 94q44-59 47-15-3 24-47 15" fill="#8BC5A0"/><circle cx="100" cy="59" r="18" fill="#EBA2B5"/><circle cx="100" cy="59" r="7" fill="#F4D577"/></g>';kind='生长过程';motion='pulse'}
else if(/^(map|compass|direction|navigation|route|distance|kilometer|meter|measurement)$/.test(k)){a='<path d="M30 55l45-16 48 15 45-15v98l-45 16-48-15-45 16z" fill="#E1EED8" stroke="#90B697" stroke-width="3"/><path d="M48 121q13-66 48-26t53-30" fill="none" stroke="#DE9A7B" stroke-width="5" stroke-dasharray="6 6"/><circle class="target" cx="149" cy="65" r="11" fill="#DE9A7B"/>';kind='路线示意';motion='none'}
else if(/^(solid|liquid|melt|freeze|temperature|heat|heat up|cool|water cycle|evaporation)$/.test(k)){a='<rect x="25" y="71" width="45" height="45" rx="8" fill="#A5CFEC"/><path d="M86 92h25m-8-8l9 8-9 8" stroke="#DFAC80" stroke-width="4"/><path d="M142 52q-50 61 0 80 50-19 0-80" fill="#80B6DD"/>';kind='物态转换';motion='pulse'}
else if(CONCEPTS[k]){let c=CONCEPTS[k];a=c.icons.map((icon,i)=>`<rect x="${6+i*65}" y="46" width="59" height="83" rx="10" fill="white" stroke="#D0DAEB"/><text x="${35+i*65}" y="87" text-anchor="middle" font-size="30">${esc(icon)}</text><text x="${35+i*65}" y="113" text-anchor="middle" font-size="8" fill="#40516A">${esc(c.labels[i])}</text>`).join('');a+='<path d="M62 35h72m-8-6l8 6-8 6" stroke="#B2A0D0" stroke-width="3" fill="none"/>';kind='词义情境分镜';motion='pulse'}
else if(e){a=`<path d="M20 148q75-25 160 0v25H20" fill="#DDEDDC"/><text x="100" y="116" font-size="78" text-anchor="middle">${esc(e)}</text>`;kind='词义图标场景';motion=/fish|dolphin|whale|boat|shark|seal|octopus/.test(k)?'travel':/bird|parrot|plane|rocket|butterfly/.test(k)?'sway':/food|bread|milk|cake|apple|banana/.test(k)?'none':'float'}
else{a=`<rect x="18" y="41" width="164" height="103" rx="18" fill="#fff" stroke="#B8C8E7" stroke-width="3"/><circle cx="50" cy="77" r="14" fill="#EAB783"/><path d="M75 77h91m-118 31h118" stroke="#9CB2D4" stroke-width="5"/><text x="100" y="132" text-anchor="middle" font-size="13" fill="#40516A">${esc(z)}</text>`;kind='词义关系图';motion='pulse'}
return `<svg class="scene" viewBox="0 0 200 180" role="img" aria-label="${esc(w.en+'：'+z+'；'+kind)}"><rect width="200" height="180" rx="22" fill="#F1F6FC"/><g class="${motion}">${a}</g></svg>`}
function mark(t,words){let safe=esc(t);const ks=[...new Set(words.map(x=>x.key).filter(x=>/^[a-z][a-z\s'-]*$/i.test(x)))].sort((a,b)=>b.length-a.length);if(!ks.length)return safe;return safe.replace(new RegExp('\\b('+ks.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi'),'<mark>$1</mark>')}
function card(w,i,low){return `<article class="card"><div class="card-top"><span>${String(i+1).padStart(2,'0')}</span><button class="sound" data-say="${esc(w.say)}" aria-label="朗读 ${esc(w.say)}">♪</button></div>${svg(w)}<h3>${esc(w.en)}</h3><p class="meaning">${esc(w.zh)}</p>${w.pattern?`<p class="example"><b>课中句型</b>${esc(w.pattern)}</p>`:''}<p class="task"><b>${low?'玩一玩':'表达挑战'}</b>${esc(w.task)}</p><details><summary>查看来源</summary>${w.sources.map(esc).join('<br>')}<br>图像：${esc(w.visual)}</details></article>`}
function story(u){return `<section class="story"><div class="story-heading"><span>THE READING CORNER</span><button data-say="${esc(u.story.text)}">♪ 朗读故事</button></div><h2>${esc(u.story.title)}</h2><p class="small">单元主题补充故事 · 编写内容，非教材原文 · ${u.story.text.split(/\s+/).length} words</p>${u.story.text.split('\n').map(p=>`<p class="reading">${mark(p,u.words)}</p>`).join('')}<div class="coach"><b>中文导读</b><p>${esc(u.story.guide)}</p></div><h3>读后说一说</h3>${u.story.questions.map((q,i)=>`<p>${i+1}. ${esc(q.q)}</p><details><summary>参考回应</summary>${esc(q.a)}</details>`).join('')}<div class="extension"><h3>${u.low?'亲子小任务':'阅读与表达延伸'}</h3>${u.extensions.map(x=>`<p>${esc(x)}</p>`).join('')}</div><details class="source-story"><summary>原 HTML 生成的小故事（保留原文）</summary><p class="small">原程序随机选择主题、词性句框；最多抽取 10 个词。部分表达可能不自然，建议仅用于核对。</p><h3>${esc(u.original?.theme.title_en||'无故事')}</h3>${u.original?.bodyHtml||''}<p>原故事选词：${u.original?.words.map(esc).join(' · ')||''}</p></details><div class="coverage"><b>故事中的单元词：</b>${u.story.used.map(esc).join(' · ')||'见主题与读后任务'}<br><b>其余词汇：</b>${u.story.remaining.map(esc).join(' · ')||'已全部覆盖'}<p>故事优先保证连贯；全部词汇均已在词卡中保留。任选 3 个剩余词，补写一句或补画一幕。</p></div></section>`}
function unitHTML(u,type='all'){return `<section class="unit" id="${u.id}"><header class="unit-head"><span>${esc(u.material)} / LEVEL ${u.level} / UNIT ${u.no}</span><h1>${esc(u.title)}</h1><p>${u.words.length} 条词汇 · ${u.low?'看图 · 做动作 · 亲子共读':'观察 · 推理 · 表达'}</p><div class="actions"><button data-export="${u.id}" data-kind="cards">下载本 Unit 词卡</button><button data-export="${u.id}" data-kind="story">下载本 Unit 故事</button></div></header>${type!=='story'?`<div class="cards">${u.words.map((w,i)=>card(w,i,u.low)).join('')}</div>`:''}${type!=='cards'?story(u):''}</section>`}
function render(){const q=($('#search')?.value||'').toLowerCase(),m=$('#material')?.value||'',l=$('#level')?.value||'';const rows=DATA.filter(u=>(!m||u.material===m)&&(!l||u.level===l)&&(!q||JSON.stringify([u.title,u.words.map(w=>[w.en,w.zh])]).toLowerCase().includes(q)));$('#content').innerHTML=rows.map(u=>unitHTML(u,TYPE)).join('')||'<p>未找到对应单元，请调整条件。</p>';$('#count').textContent=`${rows.length} 个 Unit · ${rows.reduce((n,u)=>n+u.words.length,0)} 条单元词汇`}
function exportUnit(u,type){let h=document.documentElement.cloneNode(true);h.querySelector('#content').innerHTML=unitHTML(u,type);h.querySelector('#dataset').textContent=JSON.stringify([u]).replace(/</g,'\\u003c');h.querySelector('#type').textContent=JSON.stringify(type);let blob=new Blob(['<!doctype html>'+h.outerHTML],{type:'text/html;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${u.id}_${type}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const DATA=JSON.parse($('#dataset').textContent),TYPE=JSON.parse($('#type').textContent);
$('#material').innerHTML='<option value="">全部教材</option>'+[...new Set(DATA.map(u=>u.material))].map(m=>`<option>${esc(m)}</option>`).join('');
function levels(){let m=$('#material').value;$('#level').innerHTML='<option value="">全部 Level</option>'+[...new Set(DATA.filter(u=>!m||u.material===m).map(u=>u.level))].sort((a,b)=>+a-+b).map(l=>`<option value="${l}">Level ${l}</option>`).join('')}
levels();render();$('#material').onchange=()=>{levels();render()};$('#level').onchange=render;$('#search').oninput=()=>{clearTimeout(window.searchTimer);window.searchTimer=setTimeout(render,180)};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.say)speak(b.dataset.say);if(b.dataset.export)exportUnit(DATA.find(u=>u.id===b.dataset.export),b.dataset.kind);if(b.id==='pause'){document.body.classList.toggle('paused');b.textContent=document.body.classList.contains('paused')?'继续动画':'暂停动画'}if(b.id==='print')window.print()});
</script></body></html>
