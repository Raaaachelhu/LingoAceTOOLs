, "title_cn": "动物园惊喜", "title_en": "A Surprise at the Zoo", "subject": "Zoe", "opening": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>", "closing": "\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "moral": "保护动物、爱护自然，是每个小朋友都可以从小做起的事情。"}, "bodyHtml": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>\u003cp>Zoe pointed at the \u003cspan class=\"story-hl\">bag\u003cspan class=\"gloss\">书包\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">chair\u003cspan class=\"gloss\">椅子\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Zoe found a \u003cspan class=\"story-hl\">teacher\u003cspan class=\"gloss\">老师\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Zoe noticed a \u003cspan class=\"story-hl\">pencil\u003cspan class=\"gloss\">铅笔\u003c/span>\u003c/span> nearby. Zoe picked up the \u003cspan class=\"story-hl\">pencil case\u003cspan class=\"gloss\">铅笔盒\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">paper\u003cspan class=\"gloss\">纸\u003c/span>\u003c/span>!\" said Zoe with a big smile.\u003c/p>\u003cp>Zoe carefully put the \u003cspan class=\"story-hl\">playground\u003cspan class=\"gloss\">操场\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">wall\u003cspan class=\"gloss\">墙\u003c/span>\u003c/span> appeared, and Zoe could not stop smiling. With a big smile, Zoe began to \u003cspan class=\"story-hl\">help\u003cspan class=\"gloss\">帮助\u003c/span>\u003c/span>.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">work together\u003cspan class=\"gloss\">一起工作/合作\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "words": ["bag", "chair", "teacher", "pencil", "pencil case", "paper", "playground", "wall", "help", "work together"]}}, {"id": "P_L1_U02", "material": "Power Up", "level": "1", "no": 2, "title": "Unit 2 · All About Us", "low": true, "words": [{"en": "family", "say": "family", "key": "family", "zh": "家庭", "emoji": "👨‍👩‍👧‍👦", "pattern": "This is Mr Friendly. He is Jenny and Jim's father.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“家庭”，再跟读英文。", "visual": "词义情境分镜"}, {"en": "mother (mum)", "say": "mother", "key": "mother", "zh": "妈妈", "emoji": "👩", "pattern": "This is Mrs Friendly. She is Jenny and Jim's mother.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“妈妈”，再跟读英文。", "visual": "词义图标场景"}, {"en": "father (dad)", "say": "father", "key": "father", "zh": "爸爸", "emoji": "👨", "pattern": "This is Mr Friendly. He is Jenny and Jim's father.", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“爸爸”，再跟读英文。", "visual": "词义图标场景"}, {"en": "grandfather (grandpa)", "say": "grandfather", "key": "grandfather", "zh": "爷爷/外公", "emoji": "👴", "pattern": "Are you...? Yes, I'm your.../No, it isn't...", "sources": ["Lesson 2 · Vocabulary & Expressions 2"], "task": "观察图片，用动作或中文解释“爷爷/外公”，再跟读英文。", "visual": "词义图标场景"}, {"en": "grandmother (grandma)", "say": "grandmother", "key": "grandmother", "zh": "奶奶/外婆", "emoji": "👵", "pattern": "Are you...? Yes, I'm your.../No, it isn't...", "sources": ["Lesson 2 · Vocabulary & Expressions 2"], "task": "观察图片，用动作或中文解释“奶奶/外婆”，再跟读英文。", "visual": "词义图标场景"}, {"en": "brother", "say": "brother", "key": "brother", "zh": "兄弟", "emoji": "👦", "pattern": "Are you...? Yes, I'm your.../No, it isn't...", "sources": ["Lesson 2 · Vocabulary & Expressions 2"], "task": "观察图片，用动作或中文解释“兄弟”，再跟读英文。", "visual": "词义图标场景"}, {"en": "sister", "say": "sister", "key": "sister", "zh": "姐妹", "emoji": 愿意的话再说完整句。"], "original": {"title": "Unit 2 · All About Us", "context": "Power Up Level 1 · Unit 2 · All About Us", "theme": {"key": "garden", "title_cn": "魔法花园", "title_en": "The Magic Garden", "subject": "Lily", "opening": "\u003cp>\u003cb>Lily\u003c/b> opened the little wooden gate and stepped into her grandmother's magic garden, where anything seemed possible.\u003c/p>", "closing": "\u003cp>When it was time to go home, Lily looked back at the garden one more time. \"I'll take good care of everything here,\" she promised.\u003c/p>", "moral": "用心照顾身边的小事物，就像用心记住每一个新单词一样，慢慢就会开花结果。"}, "bodyHtml": "\u003cp>\u003cb>Lily\u003c/b> opened the little wooden gate and stepped into her grandmother's magic garden, where anything seemed possible.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">family\u003cspan class=\"gloss\">家庭\u003c/span>\u003c/span>!\" said Lily with a big smile. Lily carefully put the \u003cspan class=\"story-hl\">grandfather (grandpa)\u003cspan class=\"gloss\">爷爷/外公\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">sister\u003cspan class=\"gloss\">姐妹\u003c/span>\u003c/span> appeared, and Lily could not stop smiling.\u003c/p>\u003cp>Lily pointed at the \u003cspan class=\"story-hl\">tail\u003cspan class=\"gloss\">尾巴\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">feet\u003cspan class=\"gloss\">脚\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Lily found a \u003cspan class=\"story-hl\">hair\u003cspan class=\"gloss\">头发\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Lily noticed a \u003cspan class=\"story-hl\">ear\u003cspan class=\"gloss\">耳朵\u003c/span>\u003c/span> nearby. Lily picked up the \u003cspan class=\"story-hl\">hand\u003cspan class=\"gloss\">手\u003c/span>\u003c/span> and smiled. Lily decided to \u003cspan class=\"story-hl\">taste\u003cspan class=\"gloss\">品尝\u003c/span>\u003c/span>.\u003c/p>\u003cp>Lily carefully put the \u003cspan clas /span> waiting to be discovered. Suddenly, Sam found a \u003cspan class=\"story-hl\">cat\u003cspan class=\"gloss\">猫\u003c/span>\u003c/span>. There, Sam noticed a \u003cspan class=\"story-hl\">horse\u003cspan class=\"gloss\">马\u003c/span>\u003c/span> nearby.\u003c/p>\u003cp>Sam picked up the \u003cspan class=\"story-hl\">duck\u003cspan class=\"gloss\">鸭子\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">spider\u003cspan class=\"gloss\">蜘蛛\u003c/span>\u003c/span>!\" said Sam with a big smile. Sam felt very \u003cspan class=\"story-hl\">happy\u003cspan class=\"gloss\">开心\u003c/span>\u003c/span> at that moment.\u003c/p>\u003cp>It was a truly \u003cspan class=\"story-hl\">ugly\u003cspan class=\"gloss\">丑的\u003c/span>\u003c/span> moment for Sam. Sam pointed at the \u003cspan class=\"story-hl\">milk\u003cspan class=\"gloss\">牛奶\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">honey\u003cspan class=\"gloss\">蜂蜜\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Suddenly, Sam found a \u003cspan class=\"story-hl\">flies\u003cspan class=\"gloss\">苍蝇\u003c/span>\u003c/span>.\u003c/p>\u003cp>At the end of the party, Sam thanked all his friends for coming. \"Sharing this day with you made it extra special,\" he said.\u003c/p>", "words": ["sheep", "cat", "horse", "duck", "spider", "happy", "ugly", "milk", "honey", "flies"]}}, {"id": "P_L1_U04", "material": "Power Up", "level": "1", "no": 4, "title": "Unit 4 · Food with Friends", "low": true, "words": [{"en": "burger", "say": "burger", "key": "burger", "zh": "汉堡", "emoji": "🍔", "pattern": "Have you got your burger?", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“汉堡”，再跟读英文。", "visual": "词义图标场景"}, {"en": "mango", "say": "mango", "key": "mango", "zh": "芒果", "emoji": "🥭", "pattern": "Have you got your burger?", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“芒果”，再跟读英文。", "visu ll bag. A friendly \u003cspan class=\"story-hl\">beans\u003cspan class=\"gloss\">豆子\u003c/span>\u003c/span> appeared, and Zoe could not stop smiling. Zoe pointed at the \u003cspan class=\"story-hl\">onion\u003cspan class=\"gloss\">洋葱\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">picnic\u003cspan class=\"gloss\">野餐\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "words": ["burger", "chicken", "water", "banana", "fruit", "grapes", "meat", "beans", "onion", "picnic"]}}, {"id": "P_L1_U05", "material": "Power Up", "level": "1", "no": 5, "title": "Unit 5 · Happy Birthday!", "low": true, "words": [{"en": "bike", "say": "bike", "key": "bike", "zh": "自行车", "emoji": "🚲", "pattern": "It's a kite.", "sources": ["Lesson 1 · Listening & Vocabulary 1"], "task": "观察图片，用动作或中文解释“自行车”，再跟读英文。", "visual": "词义图标场景"}, {"en": "kite", "say": "kite", "key": "kite", "zh": "风筝", "emoji": "🪁", "pattern": "It's a kite.", "sources": ["Lesson 1 · Listening & Vocabulary 1"], "task": "观察图片，用动作或中文解释“风筝”，再跟读英文。", "visual": "词义图标场景"}, {"en": "robot", "say": "robot", "key": "robot", "zh": "机器人", "emoji": "🤖", "pattern": "It's a kite.", "sources": ["Lesson 1 · Listening & Vocabulary 1"], "task": "观察图片，用动作或中文解释“机器人”，再跟读英文。", "visual": "词义图标场景"}, {"en": "plane", "say": "plane", "key": "plane", "zh": "飞机", "emoji": "✈️", "pattern": "It's a kite.", "sources": ["Lesson 1 · Listening & Vocabulary 1"], "task": "观察图片，用动作或中文解释“飞机”，再跟读英文。", "visual": "词义图标场景"}, {"en": "car", "say": "car", "key": "car", "zh": "汽车", "emoji": "🚗", "pattern": "Look at Eva! She is playing the toy house.", "sources": ["Lesson 2 · Vocabulary & Expressions 2"], "task": "观察图片，用动作或中文解释“汽车”，再跟读英文。", "visual": "词义图标场景"}, {"en": "ball", "say": "ball", "key": "ball", "zh": "球", "emoji": "⚽", "pattern": "Look at Eva ", "house", "computer", "keyboard", "mouse", "balloon", "box", "radio", "helicopter", "teddy", "ship", "board game", "circle", "square", "rectangle", "triangle"], "guide": "本篇围绕“Happy Birthday!”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "Ava gets a kite for her birthday."}, {"q": "What happens next? 后来发生了什么？", "a": "Her brother brings a ball and a toy robot."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "Up goes the kite!"}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 5 · Happy Birthday!", "context": "Power Up Level 1 · Unit 5 · Happy Birthday!", "theme": {"key": "space", "title_cn": "太空之旅", "title_en": "The Space Journey", "subject": "Alex", "opening": "\u003cp>\u003cb>Alex\u003c/b> put on his space suit and climbed into his shiny rocket. \"Three, two, one, blast off!\" he shouted, and off they flew into space.\u003c/p>", "closing": "\u003cp>After a long journey through the stars, Alex landed safely back on Earth. He couldn't wait to tell everyone about his amazing trip.\u003c/p>", "moral": "太空探索需要勇气和耐心，正如学习新知识一样，一步一步来，就能到达远方。"}, "bodyHtml": "\u003cp>\u003cb>Alex\u003c/b> put on his space suit and climbed into his shiny rocket. \"Three, two, one, blast off!\" he shouted, and off they flew into space.\u003c/p>\u003cp>Alex picked up the \u003cspan class=\"story-hl\">bike\u003cspan class=\"gloss\">自行车\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">robot\u003cspan class=\"gloss\">机器人\u003c/span>\u003c/span>!\" said Alex with a big smile. Alex carefully put the \u003cspan class=\"story-hl\">car\u003cspan class=\"gloss\">汽车\u003c/span>\u003c/span> into a small bag.\u003c/p>\u003cp>A friendly \u003cspan class=\"story-hl\">doll\u003cspan class=\"gloss\">玩偶\u003c/span>\u003c/span> appeared, and Alex could not stop smiling. Alex pointed at the \u003cspan class=\"story-hl\">computer\u003cspan class=\"gloss\">电脑\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">balloon\u003cspan class=\"gloss\">气球\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Suddenly, Alex found a \u003cspan class=\"story-hl\">radio\u003cspan class=\"gloss\">收音机\u003c/span>\u003c/span>. There, Alex noticed a \u003cspan class=\"story-hl\">teddy\u003cspan class=\"gloss\">泰迪熊\u003c/span>\u003c/span> nearby. Alex picked up the \u003cspan class=\"story-hl\">board game\u003cspan class=\"gloss\">桌游\u003c/span>\u003c/span> and smiled.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">square\u003cspan class=\"gloss\">正方形\u003c/span>\u003c/span>!\" said Alex with a big smile.\u003c/p>\u003cp>After a long journey through the stars, Alex landed safely back on Earth. He couldn't wait to tell everyone about his amazing trip.\u003c/p>", "words": ["bike", "robot", "car", "doll", "computer", "balloon", "radio", "teddy", "board game", "square"]}}, {"id": "P_L1_U06", "material": "Power Up", "level": "1", "no": 6, "title": "Unit 6 · A Day Out", "low": true, "words": [{"en": "car", "say": "car", "key": "car", "zh": "汽车", "emoji": "🚗", "pattern": "It's got some flowers in the park.", "sources": ["Lesson 1 · Vocabulary and Expression 1"], "task": "观察图片，用动作或中文解释“汽车”，再跟读英文。", "visual": "词义图标场景"}, {"en": "lorry", "say": "lorry", "key": "lorry", "zh": "卡车", "emoji": "🚚", "pattern": "It's got some flowers in the park.", "sources": ["Lesson 1 · Vocabulary and Expression 1"], "task": "观察图片，用动作或中文解释“卡车”，再跟读英文。", "visual": "词义图标场景"}, {"en": "garden", "say": "garden", "key": "garden", "zh": "花园", "emoji": "🌷", "pattern": "It's got some flowers in the park.", "sources": ["Lesson 1 · Vocabulary and Expression 1"], "task": "观察图片，用动作或中文解释“花园”，再跟读英文。", "visual": "词义图标场景"}, {"en": "park", "say": "park", "key": "park", "zh": "公园", "emoji": "🌳", "pattern" go home, Leo uses the map to find the bus stop.", "used": ["park", "flower", "tree", "bus", "bus stop", "shop"], "remaining": ["car", "lorry", "garden", "train", "motorbike", "bear", "snake", "crocodile", "monkey", "tiger", "elephant", "hippo", "polar bear", "zebra", "lizard", "giraffe", "Arctic", "grassland", "jungle", "whale", "sea", "swing", "bamboo", "flamingos"], "guide": "本篇围绕“A Day Out”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "Leo takes a bus to the park."}, {"q": "What happens next? 后来发生了什么？", "a": "He sees a flower beside a tree and a shop near the bus stop."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "When it is time to go home, Leo uses the map to find the bus stop."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 6 · A Day Out", "context": "Power Up Level 1 · Unit 6 · A Day Out", "theme": {"key": "zoo", "title_cn": "动物园惊喜", "title_en": "A Surprise at the Zoo", "subject": "Zoe", "opening": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>", "closing": "\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "moral": "保护动物、爱护自然，是每个小朋友都可以从小做起的事情。"}, "bodyHtml": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>\u003cp>Zoe pointed at the \u003cspan class=\"story-hl\">car\u003cspan class=\"gloss\">汽车\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">park\u003cspan class=\"gloss\">公园\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Zoe found a \u003cspan class=\"story-hl\">train\u003cspan class=\"gloss\">火车\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Zoe noticed a \u003cspan class=\"story-hl\">motorbike\u003cspan class=\"gloss\">摩托车\u003c/span>\u003c/span> nearby. Zoe picked up the \u003cspan class=\"story-hl\">snake\u003cspan class=\"gloss\">蛇\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">tiger\u003cspan class=\"gloss\">老虎\u003c/span>\u003c/span>!\" said Zoe with a big smile.\u003c/p>\u003cp>Zoe carefully put the \u003cspan class=\"story-hl\">polar bear\u003cspan class=\"gloss\">北极熊\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">giraffe\u003cspan class=\"gloss\">长颈鹿\u003c/span>\u003c/span> appeared, and Zoe could not stop smiling. Zoe pointed at the \u003cspan class=\"story-hl\">jungle\u003cspan class=\"gloss\">丛林\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">swing\u003cspan class=\"gloss\">荡秋千\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "words": ["car", "park", "train", "motorbike", "snake", "tiger", "polar bear", "giraffe", "jungle", "swing"]}}, {"id": "P_L1_U07", "material": "Power Up", "level": "1", "no": 7, "title": "Unit 7 · Let's Play!", "low": true, "words": [{"en": "play tennis", "say": "play tennis", "key": "play tennis", "zh": "打网球", "emoji": "🎾", "pattern": "Let's play tennis!", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“打网球”，再跟读英文。", "visual": "词义图标场景"}, {"en": "play football", "say": "play football", "key": "play football", "zh": "踢足球", "emoji": "⚽", "pattern": "Let's play tennis!", "sources": ["Lesson 1 · Vocabulary & Expressions 1"], "task": "观察图片，用动作或中文解释“踢足球”，再跟读英文。", "visual": "词义图标场景"}, {"en": "play basketball", "say": "play basketball", "key": "play basketball", "zh": "打篮球", "emoji": "🏀" ends, and got ready for a fun day of learning.\u003c/p>\u003cp>Tom carefully put the \u003cspan class=\"story-hl\">play tennis\u003cspan class=\"gloss\">打网球\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">play football\u003cspan class=\"gloss\">踢足球\u003c/span>\u003c/span> appeared, and Tom could not stop smiling. Tom pointed at the \u003cspan class=\"story-hl\">ride a bike\u003cspan class=\"gloss\">骑自行车\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">play the piano\u003cspan class=\"gloss\">弹钢琴\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Tom found a \u003cspan class=\"story-hl\">watch television\u003cspan class=\"gloss\">看电视\u003c/span>\u003c/span>. With a big smile, Tom began to \u003cspan class=\"story-hl\">throw\u003cspan class=\"gloss\">扔\u003c/span>\u003c/span>.\u003c/p>\u003cp>Tom picked up the \u003cspan class=\"story-hl\">badminton\u003cspan class=\"gloss\">羽毛球\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">hockey\u003cspan class=\"gloss\">曲棍球\u003c/span>\u003c/span>!\" said Tom with a big smile. Every morning, Tom liked to \u003cspan class=\"story-hl\">kick\u003cspan class=\"gloss\">踢\u003c/span>\u003c/span>.\u003c/p>\u003cp>A friendly \u003cspan class=\"story-hl\">pool\u003cspan class=\"gloss\">游泳池/池塘\u003c/span>\u003c/span> appeared, and Tom could not stop smiling.\u003c/p>\u003cp>When the bell rang at the end of the day, Tom packed up his things, feeling proud of everything he had learned.\u003c/p>", "words": ["play tennis", "play football", "ride a bike", "play the piano", "watch television", "throw", "badminton", "hockey", "kick", "pool"]}}, {"id": "P_L1_U08", "material": "Power Up", "level": "1", "no": 8, "title": "Unit 8 · At Home", "low": true, "words": [{"en": "bedroom", "say": "bedroom", "key": "bedroom", "zh": "卧室", "emoji": "🛏️", "pattern": "Where is Jenny? She's in the bedroom.", "sources":  she finds it on the sofa in the living room. Teddy is ready for a story.", "used": ["bedroom", "bed", "kitchen", "bathroom", "living room", "sofa", "lamp"], "remaining": ["radio", "dining room", "bath", "mirror", "armchair", "painting", "phone", "clock", "rug", "floor", "hall", "hut", "ranch", "houseboat", "flats", "stilt-house", "detached-house", "bounce", "worry"], "guide": "本篇围绕“At Home”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "Nina looks for her teddy in the bedroom."}, {"q": "What happens next? 后来发生了什么？", "a": "It is not on the bed or behind the lamp."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "Teddy is ready for a story."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 8 · At Home", "context": "Power Up Level 1 · Unit 8 · At Home", "theme": {"key": "farm", "title_cn": "农场假日", "title_en": "Holiday on the Farm", "subject": "Amy", "opening": "\u003cp>During the summer holiday, \u003cb>Amy\u003c/b> went to visit her grandpa's farm. There was so much to see and do every single day.\u003c/p>", "closing": "\u003cp>On her last evening at the farm, Amy watched the sunset and thought about all the wonderful things she had seen that week.\u003c/p>", "moral": "走进真实的生活去观察和体验，是记住新单词最好的方法之一。"}, "bodyHtml": "\u003cp>During the summer holiday, \u003cb>Amy\u003c/b> went to visit her grandpa's farm. There was so much to see and do every single day.\u003c/p>\u003cp>A friendly \u003cspan class=\"story-hl\">bedroom\u003cspan class=\"gloss\">卧室\u003c/span>\u003c/span> appeared, and Amy could not stop smiling. Amy pointed at the \u003cspan class=\"story-hl\">bed\u003cspan class=\"gloss\">床\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">bath\u003cspan class=\"gloss\">浴缸\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Suddenly, Amy found a \u003cspan class=\"story-hl\">bathroom\u003cspan class=\"gloss\">浴室\u003c/span>\u003c/span>. There, Amy noticed a \u003cspan class=\"story-hl\">lamp\u003cspan class=\"gloss\">台灯\u003c/span>\u003c/span> nearby. Amy picked up the \u003cspan class=\"story-hl\">phone\u003cspan class=\"gloss\">电话\u003c/span>\u003c/span> and smiled.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">rug\u003cspan class=\"gloss\">地毯\u003c/span>\u003c/span>!\" said Amy with a big smile. Amy carefully put the \u003cspan class=\"story-hl\">hut\u003cspan class=\"gloss\">小屋\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">houseboat\u003cspan class=\"gloss\">船屋\u003c/span>\u003c/span> appeared, and Amy could not stop smiling.\u003c/p>\u003cp>Amy pointed at the \u003cspan class=\"story-hl\">detached-house\u003cspan class=\"gloss\">独栋房屋\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>On her last evening at the farm, Amy watched the sunset and thought about all the wonderful things she had seen that week.\u003c/p>", "words": ["bedroom", "bed", "bath", "bathroom", "lamp", "phone", "rug", "hut", "houseboat", "detached-house"]}}, {"id": "P_L1_U09", "material": "Power Up", "level": "1", "no": 9, "title": "Unit 9 · Happy Holidays", "low": true, "words": [{"en": "sunglasses", "say": "sunglasses", "key": "sunglasses", "zh": "太阳镜", "emoji": "🕶️", "pattern": "What are you wearing?", "sources": ["Lesson 1 · Vocabulary & Expression 1"], "task": "观察图片，用动作或中文解释“太阳镜”，再跟读英文。", "visual": "词义图标场景"}, {"en": "hat", "say": "hat", "key": "hat", "zh": "帽子", "emoji": "🧢", "pattern": "What are you wearing?", "sources": ["Lesson 1 · Vocabulary & Expression 1"], "task": "观察图片，用动作或中文解释“帽子”，再跟读英文。", "visual": "词义图标场景"}, {"en": "boots", "say": "boots", "key": "boots", "zh": "靴子", "emoji": "👢", "pattern": "I'm wearing green boots.", "sources": ["Lesson 1 · Vocabulary & Expression 1"], "ta function mark(t,words){let safe=esc(t);const ks=[...new Set(words.map(x=>x.key).filter(x=>/^[a-z][a-z\s'-]*$/i.test(x)))].sort((a,b)=>b.length-a.length);if(!ks.length)return safe;return safe.replace(new RegExp('\\b('+ks.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi'),'<mark>$1</mark>')}
function card(w,i,low){return `<article class="card"><div class="card-top"><span>${String(i+1).padStart(2,'0')}</span><button class="sound" data-say="${esc(w.say)}" aria-label="朗读 ${esc(w.say)}">♪</button></div>${svg(w)}<h3>${esc(w.en)}</h3><p class="meaning">${esc(w.zh)}</p>${w.pattern?`<p class="example"><b>课中句型</b>${esc(w.pattern)}</p>`:''}<p class="task"><b>${low?'玩一玩':'表达挑战'}</b>${esc(w.task)}</p><details><summary>查看来源</summary>${w.sources.map(esc).join('<br>')}<br>图像：${esc(w.visual)}</details></article>`}
function story(u){return `<section class="story"><div class="story-heading"><span>THE READING CORNER</span><button data-say="${esc(u.story.text)}">♪ 朗读故事</button></div><h2>${esc(u.story.title)}</h2><p class="small">单元主题补充故事 · 编写内容，非教材原文 · ${u.story.text.split(/\s+/).length} words</p>${u.story.text.split('\n').map(p=>`<p class="reading">${mark(p,u.words)}</p>`).join('')}<div class="coach"><b>中文导读</b><p>${esc(u.story.guide)}</p></div><h3>读后说一说</h3>${u.story.questions.map((q,i)=>`<p>${i+1}. ${esc(q.q)}</p><details><summary>参考回应</summary>${esc(q.a)}</details>`).join('')}<div class="extension"><h3>${u.low?'亲子小任务':'阅读与表达延伸'}</h3>${u.extensions.map(x=>`<p>${esc(x)}</p>`).join('')}</div><details class="source-story"><summary>原 HTML 生成的小故事（保留原文）</summary><p class="small">原程序随机选择主题、词性句框；最多抽取 10 个词。部分表达可能不自然，建议仅用于核对。</p><h3>${esc(u.original?.theme.title_en||'无故事')}</h3>${u.original?.bodyHtml||''}<p>原故事选词：${u.original?.words.map(esc).join(' · ')||''}</p></details><div class="coverage"><b>故事中的单元词：</b>${u.story.used.map(esc).join(' · ')||'见主题与读后任务'}<br><b>其余词汇：</b>${u.story.remaining.map(esc).join(' · ')||'已全部覆盖'}<p>故事优先保证连贯；全部词汇均已在词卡中保留。任选 3 个剩余词，补写一句或补画一幕。</p></div></section>`}
function unitHTML(u,type='all'){return `<section class="unit" id="${u.id}"><header class="unit-head"><span>${esc(u.material)} / LEVEL ${u.level} / UNIT ${u.no}</span><h1>${esc(u.title)}</h1><p>${u.words.length} 条词汇 · ${u.low?'看图 · 做动作 · 亲子共读':'观察 · 推理 · 表达'}</p><div class="actions"><button data-export="${u.id}" data-kind="cards">下载本 Unit 词卡</button><button data-export="${u.id}" data-kind="story">下载本 Unit 故事</button></div></header>${type!=='story'?`<div class="cards">${u.words.map((w,i)=>card(w,i,u.low)).join('')}</div>`:''}${type!=='cards'?story(u):''}</section>`}
function render(){const q=($('#search')?.value||'').toLowerCase(),m=$('#material')?.value||'',l=$('#level')?.value||'';const rows=DATA.filter(u=>(!m||u.material===m)&&(!l||u.level===l)&&(!q||JSON.stringify([u.title,u.words.map(w=>[w.en,w.zh])]).toLowerCase().includes(q)));$('#content').innerHTML=rows.map(u=>unitHTML(u,TYPE)).join('')||'<p>未找到对应单元，请调整条件。</p>';$('#count').textContent=`${rows.length} 个 Unit · ${rows.reduce((n,u)=>n+u.words.length,0)} 条单元词汇`}
function exportUnit(u,type){let h=document.documentElement.cloneNode(true);h.querySelector('#content').innerHTML=unitHTML(u,type);h.querySelector('#dataset').textContent=JSON.stringify([u]).replace(/</g,'\\u003c');h.querySelector('#type').textContent=JSON.stringify(type);let blob=new Blob(['<!doctype html>'+h.outerHTML],{type:'text/html;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${u.id}_${type}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const DATA=JSON.parse($('#dataset').textContent),TYPE=JSON.parse($('#type').textContent);
$('#material').innerHTML='<option value="">全部教材</option>'+[...new Set(DATA.map(u=>u.material))].map(m=>`<option>${esc(m)}</option>`).join('');
function levels(){let m=$('#material').value;$('#level').innerHTML='<option value="">全部 Level</option>'+[...new Set(DATA.filter(u=>!m||u.material===m).map(u=>u.level))].sort((a,b)=>+a-+b).map(l=>`<option value="${l}">Level ${l}</option>`).join('')}
levels();render();$('#material').onchange=()=>{levels();render()};$('#level').onchange=render;$('#search').oninput=()=>{clearTimeout(window.searchTimer);window.searchTimer=setTimeout(render,180)};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.say)speak(b.dataset.say);if(b.dataset.export)exportUnit(DATA.find(u=>u.id===b.dataset.export),b.dataset.kind);if(b.id==='pause'){document.body.classList.toggle('paused');b.textContent=document.body.classList.contains('paused')?'继续动画':'暂停动画'}if(b.id==='print')window.print()});
</script></body></html>
