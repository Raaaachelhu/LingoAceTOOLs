 "Unit 2 · Animal Intelligence", "context": "Reach Higher Level 7 · Unit 2 · Animal Intelligence", "theme": {"key": "space", "title_cn": "太空之旅", "title_en": "The Space Journey", "subject": "Alex", "opening": "\u003cp>\u003cb>Alex\u003c/b> put on his space suit and climbed into his shiny rocket. \"Three, two, one, blast off!\" he shouted, and off they flew into space.\u003c/p>", "closing": "\u003cp>After a long journey through the stars, Alex landed safely back on Earth. He couldn't wait to tell everyone about his amazing trip.\u003c/p>", "moral": "太空探索需要勇气和耐心，正如学习新知识一样，一步一步来，就能到达远方。"}, "bodyHtml": "\u003cp>\u003cb>Alex\u003c/b> put on his space suit and climbed into his shiny rocket. \"Three, two, one, blast off!\" he shouted, and off they flew into space.\u003c/p>\u003cp>Alex picked up the \u003cspan class=\"story-hl\">adaptation\u003cspan class=\"gloss\">适应\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">defend\u003cspan class=\"gloss\">防御\u003c/span>\u003c/span>!\" said Alex with a big smile. Alex carefully put the \u003cspan class=\"story-hl\">predator\u003cspan class=\"gloss\">捕食者\u003c/span>\u003c/span> into a small bag.\u003c/p>\u003cp>A friendly \u003cspan class=\"story-hl\">prey\u003cspan class=\"gloss\">猎物\u003c/span>\u003c/span> appeared, and Alex could not stop smiling. Alex pointed at the \u003cspan class=\"story-hl\">trait\u003cspan class=\"gloss\">特质\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">behavior\u003cspan class=\"gloss\">行为\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Suddenly, Alex found a \u003cspan class=\"story-hl\">characteristic\u003cspan class=\"gloss\">特征\u003c/span>\u003c/span>. There, Alex noticed a \u003cspan class=\"story-hl\">response\u003cspan class=\"gloss\">回应\u003c/span>\u003c/span> nearby. Alex picked up the \u003cspan class=\"story-hl\">strategy\u003cspan class=\"gloss\">策略\u003c/span>\u003c/span> and smiled.\u003 >导航\u003c/span>\u003c/span> nearby.\u003c/p>\u003cp>Sam picked up the \u003cspan class=\"story-hl\">coastal\u003cspan class=\"gloss\">沿海的\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">galleon\u003cspan class=\"gloss\">大帆船\u003c/span>\u003c/span>!\" said Sam with a big smile. Sam carefully put the \u003cspan class=\"story-hl\">currency\u003cspan class=\"gloss\">货币\u003c/span>\u003c/span> into a small bag.\u003c/p>\u003cp>A friendly \u003cspan class=\"story-hl\">artifact\u003cspan class=\"gloss\">文物\u003c/span>\u003c/span> appeared, and Sam could not stop smiling. Sam pointed at the \u003cspan class=\"story-hl\">colony\u003cspan class=\"gloss\">殖民地\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">trade\u003cspan class=\"gloss\">贸易\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Suddenly, Sam found a \u003cspan class=\"story-hl\">examine\u003cspan class=\"gloss\">检查\u003c/span>\u003c/span>.\u003c/p>\u003cp>At the end of the party, Sam thanked all his friends for coming. \"Sharing this day with you made it extra special,\" he said.\u003c/p>", "words": ["treasure", "compass", "navigation", "coastal", "galleon", "currency", "artifact", "colony", "trade", "examine"]}}, {"id": "R_L7_U07", "material": "Reach Higher", "level": "7", "no": 7, "title": "Unit 7 · Moving Through Space", "low": false, "words": [{"en": "motion", "say": "motion", "key": "motion", "zh": "运动", "emoji": "", "pattern": "It means ___. For example, ___. / One of my favorite memories is ___. I once knew someone who ___. / Tell me why ___ was important to you. 等", "sources": ["Lesson 1（话题课1（第1循环））", "Lesson 2（话题课2（第1循环））", "Lesson 3（话题课3（第1循环））", "Lesson 4（话题课4（第2循环））", "Lesson 5（话题课5（第2循环））", "Lesson 6（话题课6（第2循环））", "Lesson 7（写作训练课）"], "task": "解释“运动”与单元主题的联系，用 motion 口述或写一句自己的表达。", "visual": "词义情境分镜"}, {"en": "measure", "say": "measure", "key": "measure", "zh": "测量", "emoji": "📏", "pattern": "It mean else if(/^(sun|sunny|rain|rainy|snow|snowy|cloud|cloudy|wind|windy|rainbow|storm|foggy|hot|cold|warm|cool)$/.test(k)){a='<circle cx="62" cy="61" r="26" fill="#F0CE6D"/><path d="M83 85q-22-40-42-6-30 0-24 24h132q20-34-12-32-8-26-32-8" fill="#C0D8EC"/>';if(/rain|storm/.test(k))a+='<g class="rain" stroke="#74A8DA" stroke-width="5"><path d="M48 117l-8 15m40-15l-8 15m40-15l-8 15m40-15l-8 15"/></g>';if(/snow|cold/.test(k))a+='<text x="48" y="142" font-size="25" fill="#74A8DA">❄ ❄ ❄</text>';if(/wind/.test(k))a+='<path d="M30 125h120m-105 16h85" stroke="#88BFAE" stroke-width="5"/>';kind='天气变化';motion='sway'}
else if(/^(seed|root|leaf|leaves|flower|grow|growth|sprout|plant|cycle|life cycle|hatch|pupa|caterpillar|butterfly)$/.test(k)){a='<path d="M28 143h146" stroke="#B1997F" stroke-width="9"/><g class="plant"><path d="M100 142V73" stroke="#639D83" stroke-width="7"/><path d="M100 108Q55 53 56 100q5 24 44 8M100 94q44-59 47-15-3 24-47 15" fill="#8BC5A0"/><circle cx="100" cy="59" r="18" fill="#EBA2B5"/><circle cx="100" cy="59" r="7" fill="#F4D577"/></g>';kind='生长过程';motion='pulse'}
else if(/^(map|compass|direction|navigation|route|distance|kilometer|meter|measurement)$/.test(k)){a='<path d="M30 55l45-16 48 15 45-15v98l-45 16-48-15-45 16z" fill="#E1EED8" stroke="#90B697" stroke-width="3"/><path d="M48 121q13-66 48-26t53-30" fill="none" stroke="#DE9A7B" stroke-width="5" stroke-dasharray="6 6"/><circle class="target" cx="149" cy="65" r="11" fill="#DE9A7B"/>';kind='路线示意';motion='none'}
else if(/^(solid|liquid|melt|freeze|temperature|heat|heat up|cool|water cycle|evaporation)$/.test(k)){a='<rect x="25" y="71" width="45" height="45" rx="8" fill="#A5CFEC"/><path d="M86 92h25m-8-8l9 8-9 8" stroke="#DFAC80" stroke-width="4"/><path d="M142 52q-50 61 0 80 50-19 0-80" fill="#80B6DD"/>';kind='物态转换';motion='pulse'}
else if(CONCEPTS[k]){let c=CONCEPTS[k];a=c.icons.map((icon,i)=>`<rect x="${6+i*65}" y="46" width="59" height="83" rx="10" fill="white" stroke="#D0DAEB"/><text x="${35+i*65}" y="87" text-anchor="middle" font-size="30">${esc(icon)}</text><text x="${35+i*65}" y="113" text-anchor="middle" font-size="8" fill="#40516A">${esc(c.labels[i])}</text>`).join('');a+='<path d="M62 35h72m-8-6l8 6-8 6" stroke="#B2A0D0" stroke-width="3" fill="none"/>';kind='词义情境分镜';motion='pulse'}
else if(e){a=`<path d="M20 148q75-25 160 0v25H20" fill="#DDEDDC"/><text x="100" y="116" font-size="78" text-anchor="middle">${esc(e)}</text>`;kind='词义图标场景';motion=/fish|dolphin|whale|boat|shark|seal|octopus/.test(k)?'travel':/bird|parrot|plane|rocket|butterfly/.test(k)?'sway':/food|bread|milk|cake|apple|banana/.test(k)?'none':'float'}
else{a=`<rect x="18" y="41" width="164" height="103" rx="18" fill="#fff" stroke="#B8C8E7" stroke-width="3"/><circle cx="50" cy="77" r="14" fill="#EAB783"/><path d="M75 77h91m-118 31h118" stroke="#9CB2D4" stroke-width="5"/><text x="100" y="132" text-anchor="middle" font-size="13" fill="#40516A">${esc(z)}</text>`;kind='词义关系图';motion='pulse'}
return `<svg class="scene" viewBox="0 0 200 180" role="img" aria-label="${esc(w.en+'：'+z+'；'+kind)}"><rect width="200" height="180" rx="22" fill="#F1F6FC"/><g class="${motion}">${a}</g></svg>`}
function mark(t,words){let safe=esc(t);const ks=[...new Set(words.map(x=>x.key).filter(x=>/^[a-z][a-z\s'-]*$/i.test(x)))].sort((a,b)=>b.length-a.length);if(!ks.length)return safe;return safe.replace(new RegExp('\\b('+ks.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi'),'<mark>$1</mark>')}
function card(w,i,low){return `<article class="card"><div class="card-top"><span>${String(i+1).padStart(2,'0')}</span><button class="sound" data-say="${esc(w.say)}" aria-label="朗读 ${esc(w.say)}">♪</button></div>${svg(w)}<h3>${esc(w.en)}</h3><p class="meaning">${esc(w.zh)}</p>${w.pattern?`<p class="example"><b>课中句型</b>${esc(w.pattern)}</p>`:''}<p class="task"><b>${low?'玩一玩':'表达挑战'}</b>${esc(w.task)}</p><details><summary>查看来源</summary>${w.sources.map(esc).join('<br>')}<br>图像：${esc(w.visual)}</details></article>`}
function story(u){return `<section class="story"><div class="story-heading"><span>THE READING CORNER</span><button data-say="${esc(u.story.text)}">♪ 朗读故事</button></div><h2>${esc(u.story.title)}</h2><p class="small">单元主题补充故事 · 编写内容，非教材原文 · ${u.story.text.split(/\s+/).length} words</p>${u.story.text.split('\n').map(p=>`<p class="reading">${mark(p,u.words)}</p>`).join('')}<div class="coach"><b>中文导读</b><p>${esc(u.story.guide)}</p></div><h3>读后说一说</h3>${u.story.questions.map((q,i)=>`<p>${i+1}. ${esc(q.q)}</p><details><summary>参考回应</summary>${esc(q.a)}</details>`).join('')}<div class="extension"><h3>${u.low?'亲子小任务':'阅读与表达延伸'}</h3>${u.extensions.map(x=>`<p>${esc(x)}</p>`).join('')}</div><details class="source-story"><summary>原 HTML 生成的小故事（保留原文）</summary><p class="small">原程序随机选择主题、词性句框；最多抽取 10 个词。部分表达可能不自然，建议仅用于核对。</p><h3>${esc(u.original?.theme.title_en||'无故事')}</h3>${u.original?.bodyHtml||''}<p>原故事选词：${u.original?.words.map(esc).join(' · ')||''}</p></details><div class="coverage"><b>故事中的单元词：</b>${u.story.used.map(esc).join(' · ')||'见主题与读后任务'}<br><b>其余词汇：</b>${u.story.remaining.map(esc).join(' · ')||'已全部覆盖'}<p>故事优先保证连贯；全部词汇均已在词卡中保留。任选 3 个剩余词，补写一句或补画一幕。</p></div></section>`}
function unitHTML(u,type='all'){return `<section class="unit" id="${u.id}"><header class="unit-head"><span>${esc(u.material)} / LEVEL ${u.level} / UNIT ${u.no}</span><h1>${esc(u.title)}</h1><p>${u.words.length} 条词汇 · ${u.low?'看图 · 做动作 · 亲子共读':'观察 · 推理 · 表达'}</p><div class="actions"><button data-export="${u.id}" data-kind="cards">下载本 Unit 词卡</button><button data-export="${u.id}" data-kind="story">下载本 Unit 故事</button></div></header>${type!=='story'?`<div class="cards">${u.words.map((w,i)=>card(w,i,u.low)).join('')}</div>`:''}${type!=='cards'?story(u):''}</section>`}
function render(){const q=($('#search')?.value||'').toLowerCase(),m=$('#material')?.value||'',l=$('#level')?.value||'';const rows=DATA.filter(u=>(!m||u.material===m)&&(!l||u.level===l)&&(!q||JSON.stringify([u.title,u.words.map(w=>[w.en,w.zh])]).toLowerCase().includes(q)));$('#content').innerHTML=rows.map(u=>unitHTML(u,TYPE)).join('')||'<p>未找到对应单元，请调整条件。</p>';$('#count').textContent=`${rows.length} 个 Unit · ${rows.reduce((n,u)=>n+u.words.length,0)} 条单元词汇`}
function exportUnit(u,type){let h=document.documentElement.cloneNode(true);h.querySelector('#content').innerHTML=unitHTML(u,type);h.querySelector('#dataset').textContent=JSON.stringify([u]).replace(/</g,'\\u003c');h.querySelector('#type').textContent=JSON.stringify(type);let blob=new Blob(['<!doctype html>'+h.outerHTML],{type:'text/html;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${u.id}_${type}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const DATA=JSON.parse($('#dataset').textContent),TYPE=JSON.parse($('#type').textContent);
$('#material').innerHTML='<option value="">全部教材</option>'+[...new Set(DATA.map(u=>u.material))].map(m=>`<option>${esc(m)}</option>`).join('');
function levels(){let m=$('#material').value;$('#level').innerHTML='<option value="">全部 Level</option>'+[...new Set(DATA.filter(u=>!m||u.material===m).map(u=>u.level))].sort((a,b)=>+a-+b).map(l=>`<option value="${l}">Level ${l}</option>`).join('')}
levels();render();$('#material').onchange=()=>{levels();render()};$('#level').onchange=render;$('#search').oninput=()=>{clearTimeout(window.searchTimer);window.searchTimer=setTimeout(render,180)};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.say)speak(b.dataset.say);if(b.dataset.export)exportUnit(DATA.find(u=>u.id===b.dataset.export),b.dataset.kind);if(b.id==='pause'){document.body.classList.toggle('paused');b.textContent=document.body.classList.contains('paused')?'继续动画':'暂停动画'}if(b.id==='print')window.print()});
</script></body></html>
