余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "Mia sees a red apple and smells it."}, {"q": "What happens next? 后来发生了什么？", "a": "She touches its smooth skin and hears a bird outside."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "Her eyes, nose, hands, ears and mouth help her notice different things."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 1 · All About Me", "context": "Reach Higher Level 1 · Unit 1 · All About Me", "theme": {"key": "zoo", "title_cn": "动物园惊喜", "title_en": "A Surprise at the Zoo", "subject": "Zoe", "opening": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>", "closing": "\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "moral": "保护动物、爱护自然，是每个小朋友都可以从小做起的事情。"}, "bodyHtml": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>\u003cp>Zoe pointed at the \u003cspan class=\"story-hl\">eyes\u003cspan class=\"gloss\">眼睛\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">mouth\u003cspan class=\"gloss\">嘴巴\u003c/span>\u003c/span> waiting to be discovered. With a big smile, Zoe began to \u003cspan class=\"story-hl\">smell\u003cspan class=\"gloss\">闻\u003c/span>\u003c/span>.\u003c/p>\u003cp>Zoe decided to \u003cspan class=\"story-hl\">play\u003cspan class=\"gloss\">玩\u003c/span>\u003c/span>. Zoe picked up the \u003cspan class=\"story-hl\">living room\u003cspan class=\"gloss\">客厅\u003c/span>\u003c/span> and smiled. Zoe's new friend was \u003cspan class=\"story-hl\">happy\u003cspan class=\"gloss\">开心\u003c/span>\u003c/span> and kind.\u003c/p>\u003cp>Zoe felt very \u003cspan class=\"story-hl\">sad\u003cspan class=\"gloss\">难过\u003c/span>\u003c/span> at that moment. With a big smile, Zoe began to \u003cspan class=\"story-hl\">eat\u003cspan class=\"gloss\">吃\u003c/span>\u003c/span>. Zoe pointed at the \u003cspan class=\"story-hl\">hat\u003cspan class=\"gloss\">帽子\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">sunny\u003cspan class=\"gloss\">晴朗的\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "words": ["eyes", "mouth", "smell", "play", "living room", "happy", "sad", "eat", "hat", "sunny"]}}, {"id": "R_L1_U02", "material": "Reach Higher", "level": "1", "no": 2, "title": "Unit 2 · My Family", "low": true, "words": [{"en": "grandmother", "say": "grandmother", "key": "grandmother", "zh": "奶奶/外婆", "emoji": "👵", "pattern": "Who is this?-This is___.", "sources": ["Lesson 1-16（话题课）", "Lesson 19-20（口语训练课）"], "task": "观察图片，用动作或中文解释“奶奶/外婆”，再跟读英文。", "visual": "词义图标场景"}, {"en": "grandfather", "say": "grandfather", "key": "grandfather", "zh": "爷爷/外公", "emoji": "👴", "pattern": "Who is this?-This is___.", "sources": ["Lesson 1-16（话题课）", "Lesson 19-20（口语训练课）"], "task": "观察图片，用动作或中文解释“爷爷/外公”，再跟读英文。", "visual": "词义图标场景"}, {"en": "father", "say": "father", "key": "father", "zh": "爸爸", "emoji": "👨", "pattern": "Who is this?-This is___.", "sources": ["Lesson 1-16（话题课）", "Lesson 19-20（口语训练课）"], "task": "观察图片，用动作或中文解释“爸爸”，再跟读英文。", "visual": "词义图标场景"}, {"en": "mother", "say": "mother", "key": "mother", "zh": "妈妈", "emoji": "👩", "pattern": "Who is this?-This is___.", "sources": ["Lesson 1-16（话题课）", "Lesson 19-20（口语训练课）"], "task": "观察图片，用动作或中文解释“妈妈”，再跟读英文。", "visual": "词义图标场景"}, {"en": "brother", "say": "brother", "key": "brother", "zh": "兄弟", "emoji": "👦", "pattern": "Who is this?-This is___.", "sources": ["Lesson 1- ry": {"title": "The Family Picture", "text": "A girl draws her mother, father, brother and sister. Her grandmother likes to read, and her grandfather likes to sing. Each person adds something to the picture. It becomes a picture of a family doing things together.", "used": ["grandmother", "grandfather", "father", "mother", "brother", "sister", "sing", "read"], "remaining": ["dance", "draw", "cook", "swim", "fish", "soup", "pizza", "fries", "apple pie", "carrots", "potatoes", "onions", "beans", "corn", "cat", "rabbit", "dog", "bird", "run", "jump", "climb", "fly", "dolls", "bears", "blocks", "robots", "yo-yos", "circle", "star", "rectangle", "heart", "square"], "guide": "本篇围绕“My Family”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "A girl draws her mother, father, brother and sister."}, {"q": "What happens next? 后来发生了什么？", "a": "Her grandmother likes to read, and her grandfather likes to sing."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "It becomes a picture of a family doing things together."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 2 · My Family", "context": "Reach Higher Level 1 · Unit 2 · My Family", "theme": {"key": "farm", "title_cn": "农场假日", "title_en": "Holiday on the Farm", "subject": "Amy", "opening": "\u003cp>During the summer holiday, \u003cb>Amy\u003c/b> went to visit her grandpa's farm. There was so much to see and do every single day.\u003c/p>", "closing": "\u003cp>On her last evening at the farm, Amy watched the sunset and thought about all the wonderful things she had seen that week.\u003c/p>", "moral": "走进真实的生活去观察和体验，是记住新单词最好的方法之一。"}, "bodyHtml": "\u003cp>During the summer holiday, \u003cb>Amy\u003c/b> went to visit her grandpa's farm. There was so much to see and do every single day.\u003c/p>\u003cp>A friendly \u003cspan class=\"story-hl\">grandmother\u003cspan class=\"gloss\">奶奶/外婆\u003c/span>\u003c/span> appeared, and Amy could not stop smiling. Amy pointed at the \u003cspan class=\"story-hl\">brother\u003cspan class=\"gloss\">兄弟\u003c/span>\u003c/span> and asked lots of questions. Amy tried to \u003cspan class=\"story-hl\">read\u003cspan class=\"gloss\">读\u003c/span>\u003c/span>, and it turned out to be great fun.\u003c/p>\u003cp>Suddenly, Amy found a \u003cspan class=\"story-hl\">fish\u003cspan class=\"gloss\">鱼\u003c/span>\u003c/span>. There, Amy noticed a \u003cspan class=\"story-hl\">apple pie\u003cspan class=\"gloss\">苹果派\u003c/span>\u003c/span> nearby. Amy picked up the \u003cspan class=\"story-hl\">beans\u003cspan class=\"gloss\">豆子\u003c/span>\u003c/span> and smiled.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">dog\u003cspan class=\"gloss\">狗\u003c/span>\u003c/span>!\" said Amy with a big smile. Amy tried to \u003cspan class=\"story-hl\">climb\u003cspan class=\"gloss\">爬\u003c/span>\u003c/span>, and it turned out to be great fun. A friendly \u003cspan class=\"story-hl\">blocks\u003cspan class=\"gloss\">积木\u003c/span>\u003c/span> appeared, and Amy could not stop smiling.\u003c/p>\u003cp>Amy pointed at the \u003cspan class=\"story-hl\">star\u003cspan class=\"gloss\">星星\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>On her last evening at the farm, Amy watched the sunset and thought about all the wonderful things she had seen that week.\u003c/p>", "words": ["grandmother", "brother", "read", "fish", "apple pie", "beans", "dog", "climb", "blocks", "star"]}}, {"id": "R_L1_U03", "material": "Reach Higher", "level": "1", "no": 3, "title": "Unit 3 · My Life", "low": true, "words": [{"en": "backpack", "say": "backpack", "key": "backpack", "zh": "背包", "emoji": "🎒", "pattern": "What's this?-It's a___.", "sources": ["Lesson 1-16（话题课）", "Lesson 19-20（口语训练课）"], "task": "观察图片，用动作或中文解释“背包”，再跟读英文。", "visual": "书包实物"}, {"en": "book", "sa anas", "tomatoes", "lollipops", "eggs"], "guide": "本篇围绕“My Life”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "Leo puts a book, a notebook and a pencil in his backpack."}, {"q": "What happens next? 后来发生了什么？", "a": "At school, his friend needs a crayon."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "Before going home, they put away the glue stick and clean their table."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 3 · My Life", "context": "Reach Higher Level 1 · Unit 3 · My Life", "theme": {"key": "zoo", "title_cn": "动物园惊喜", "title_en": "A Surprise at the Zoo", "subject": "Zoe", "opening": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>", "closing": "\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "moral": "保护动物、爱护自然，是每个小朋友都可以从小做起的事情。"}, "bodyHtml": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>\u003cp>Zoe pointed at the \u003cspan class=\"story-hl\">backpack\u003cspan class=\"gloss\">背包\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">crayon\u003cspan class=\"gloss\">蜡笔\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Zoe found a \u003cspan class=\"story-hl\">painting\u003cspan class=\"gloss\">画\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Zoe noticed a \u003cspan class=\"story-hl\">dining room\u003cspan class=\"gloss\">餐厅\u003c/span>\u003c/span> nearby. Zoe picked up the \u003cspan class=\"story-hl\">Monday-Sunday(星期)\u003cspan class=\"gloss\">星期一至星期天\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">on foot\u003cspan class=\"gloss\">步行\u003c/span>\u003c/span>!\" said Zoe with a big smile.\u003c/p>\u003cp>Zoe carefully put the \u003cspan class=\"story-hl\">volleyball\u003cspan class=\"gloss\">排球\u003c/span>\u003c/span> into a small bag. Zoe decided to \u003cspan class=\"story-hl\">catch\u003cspan class=\"gloss\">接住\u003c/span>\u003c/span>. Zoe pointed at the \u003cspan class=\"story-hl\">muffins\u003cspan class=\"gloss\">松饼\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">mushrooms\u003cspan class=\"gloss\">蘑菇\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "words": ["backpack", "crayon", "painting", "dining room", "Monday-Sunday(星期)", "on foot", "volleyball", "catch", "muffins", "mushrooms"]}}, {"id": "R_L2_U01", "material": "Reach Higher", "level": "2", "no": 1, "title": "Unit 1 · Animals", "low": true, "words": [{"en": "goat", "say": "goat", "key": "goat", "zh": "山羊", "emoji": "🐐", "pattern": "What animal do you see?-I see a(an)___.", "sources": ["Lesson 1-16（话题课）", "Lesson 19-20（口语训练课）"], "task": "观察图片，用动作或中文解释“山羊”，再跟读英文。", "visual": "词义图标场景"}, {"en": "horse", "say": "horse", "key": "horse", "zh": "马", "emoji": "🐴", "pattern": "What animal do you see?-I see a(an)___.", "sources": ["Lesson 1-16（话题课）", "Lesson 19-20（口语训练课）"], "task": "观察图片，用动作或中文解释“马”，再跟读英文。", "visual": "词义图标场景"}, {"en": "goose", "say": "goose", "key": "goose", "zh": "鹅", "emoji": "🪿", "pattern": "What animal do you see?-I see a(an)___.", "sources": ["Lesson 1-16（话题课）", "Lesson 19-20（口语训练课）"], "task": "观察图片，用动作或中文解释“鹅”，再跟读英文。", "visual": "词义图标场景"}, {"en": "cow", "say": "cow", "key": "cow", "zh": "奶牛", "emoji": "🐄", "pattern": "What animal do you see?-I see a(an)___.", "sources": ["Lesson 1-16（话题课）", "Lesson 19-20（口 u003cspan class=\"gloss\">海龟\u003c/span>\u003c/span> nearby. Zoe picked up the \u003cspan class=\"story-hl\">ocean\u003cspan class=\"gloss\">海洋\u003c/span>\u003c/span> and smiled. Zoe's new friend was \u003cspan class=\"story-hl\">red\u003cspan class=\"gloss\">红色\u003c/span>\u003c/span> and kind.\u003c/p>\u003cp>Zoe carefully put the \u003cspan class=\"story-hl\">tiger\u003cspan class=\"gloss\">老虎\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">zebra\u003cspan class=\"gloss\">斑马\u003c/span>\u003c/span> appeared, and Zoe could not stop smiling. Zoe pointed at the \u003cspan class=\"story-hl\">duckling\u003cspan class=\"gloss\">小鸭子\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">wings\u003cspan class=\"gloss\">翅膀\u003c/span>\u003c/span> waiting to be discovered.\u003c/p>\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "words": ["goat", "fast", "loud", "sea turtle", "ocean", "red", "tiger", "zebra", "duckling", "wings"]}}, {"id": "R_L2_U02", "material": "Reach Higher", "level": "2", "no": 2, "title": "Unit 2 · Magic Garden", "low": true, "words": [{"en": "carrot", "say": "carrot", "key": "carrot", "zh": "胡萝卜", "emoji": "🥕", "pattern": "What do you see?-I see a___.", "sources": ["Lesson 1-16（话题课）", "Lesson 19-20（口语训练课）"], "task": "观察图片，用动作或中文解释“胡萝卜”，再跟读英文。", "visual": "词义图标场景"}, {"en": "potato", "say": "potato", "key": "potato", "zh": "土豆", "emoji": "🥔", "pattern": "What do you see?-I see a___.", "sources": ["Lesson 1-16（话题课）", "Lesson 19-20（口语训练课）"], "task": "观察图片，用动作或中文解释“土豆”，再跟读英文。", "visual": "词义图标场景"}, {"en": "peach", "say": "peach", "key": "peach", "zh": "桃子", "emoji": "🍑", "pattern": "What do you see?-I see a___.", "sources": ["Lesson 1-16（话题课）", "Lesson 19-20（口语训练课）"], "task": "观察图片，用动作或中文解释“桃子”，再跟读英文。", "visual": "词义图标场景"}, {"en": "pear", "say": "pear", "ke  story about? 故事里有谁／什么？", "a": "Nina plants a seed in the garden."}, {"q": "What happens next? 后来发生了什么？", "a": "A root grows down, and a leaf grows up."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "Nina draws every change in her notebook."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 2 · Magic Garden", "context": "Reach Higher Level 2 · Unit 2 · Magic Garden", "theme": {"key": "school", "title_cn": "校园的一天", "title_en": "A Day at School", "subject": "Tom", "opening": "\u003cp>It was a busy morning at school. \u003cb>Tom\u003c/b> walked into his classroom, said hello to his friends, and got ready for a fun day of learning.\u003c/p>", "closing": "\u003cp>When the bell rang at the end of the day, Tom packed up his things, feeling proud of everything he had learned.\u003c/p>", "moral": "每天在学校里认真学习一点点，日积月累就会有大大的进步。"}, "bodyHtml": "\u003cp>It was a busy morning at school. \u003cb>Tom\u003c/b> walked into his classroom, said hello to his friends, and got ready for a fun day of learning.\u003c/p>\u003cp>Tom carefully put the \u003cspan class=\"story-hl\">carrot\u003cspan class=\"gloss\">胡萝卜\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">pear\u003cspan class=\"gloss\">梨\u003c/span>\u003c/span> appeared, and Tom could not stop smiling. Tom pointed at the \u003cspan class=\"story-hl\">leaf\u003cspan class=\"gloss\">叶子\u003c/span>\u003c/span> and asked lots of questions.\u003c/p>\u003cp>Tom tried to \u003cspan class=\"story-hl\">read\u003cspan class=\"gloss\">读\u003c/span>\u003c/span>, and it turned out to be great fun. Suddenly, Tom found a \u003cspan class=\"story-hl\">soup\u003cspan class=\"gloss\">汤\u003c/span>\u003c/span>. There, Tom noticed a \u003cspan class=\"story-hl\">water\u003cspan class=\"gloss\">水\u003c/span>\u003c/span> nearby.\u003c/p>\u003cp>\"Let's \u003cspan class=\"story-hl\">make\u003c l": "词义情境分镜"}], "story": {"title": "A Jacket for Spring", "text": "Tom puts on a warm jacket in winter. In spring, he sees flowers and takes a raincoat outside. Summer feels hot, but fall feels cool. He watches the weather before choosing what to wear.", "used": ["spring", "summer", "fall", "winter", "hot", "warm", "cool", "wear", "jacket", "raincoat", "weather"], "remaining": ["favorite", "cold", "T-shirt", "dress", "sweater", "scarf", "windy", "sunny", "rainy", "snowy", "hear", "smell", "see", "taste", "touch", "ear", "nose", "eye", "fingers", "tongue"], "guide": "本篇围绕“Is It Spring Yet”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "Who or what is this story about? 故事里有谁／什么？", "a": "Tom puts on a warm jacket in winter."}, {"q": "What happens next? 后来发生了什么？", "a": "In spring, he sees flowers and takes a raincoat outside."}, {"q": "How does the story end? 故事最后怎么样了？", "a": "He watches the weather before choosing what to wear."}]}, "extensions": ["准备：纸、彩笔或 3 个安全的小物件。家长先用中文问“你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 3 · Is It Spring Yet", "context": "Reach Higher Level 2 · Unit 3 · Is It Spring Yet", "theme": {"key": "birthday", "title_cn": "生日派对", "title_en": "The Birthday Party", "subject": "Sam", "opening": "\u003cp>Today was \u003cb>Sam\u003c/b>'s birthday! Balloons filled the living room, and all his friends were coming over for a party.\u003c/p>", "closing": "\u003cp>At the end of the party, Sam thanked all his friends for coming. \"Sharing this day with you made it extra special,\" he said.\u003c/p>", "moral": "和朋友、家人一起分享快乐时光，会让美好的回忆更加珍贵。"}, "bodyHtml": "\u003cp>Today was \u003cb>Sam\u003c/b>'s birthday! Balloons filled the living room, and all his friends were coming over for a party.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">spring\u003cspan class=\"gloss\">春天\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Sam found a \u003cspan class=\"story-hl\">winter\u003cspan class=\"gloss\">冬天\u003c/span>\u003c/span>. It was a truly \u003cspan class=\"story-hl\">cold\u003cspan class=\"gloss\">冷\u003c/span>\u003c/span> moment for Sam.\u003c/p>\u003cp>Sam tried to \u003cspan class=\"story-hl\">wear\u003cspan class=\"gloss\">穿\u003c/span>\u003c/span>, and it turned out to be great fun. \"Look, a \u003cspan class=\"story-hl\">T-shirt\u003cspan class=\"gloss\">T恤\u003c/span>\u003c/span>!\" said Sam with a big smile. Sam carefully put the \u003cspan class=\"story-hl\">scarf\u003cspan class=\"gloss\">围巾\u003c/span>\u003c/span> into a small bag.\u003c/p>\u003cp>A friendly \u003cspan class=\"story-hl\">rainy\u003cspan class=\"gloss\">下雨的\u003c/span>\u003c/span> appeared, and Sam could not stop smiling. Every morning, Sam liked to \u003cspan class=\"story-hl\">hear\u003cspan class=\"gloss\">听见\u003c/span>\u003c/span>. Sam tried to \u003cspan class=\"story-hl\">taste\u003cspan class=\"gloss\">品尝\u003c/span>\u003c/span>, and it turned out to be great fun.\u003c/p>\u003cp>Suddenly, Sam found a \u003cspan class=\"story-hl\">nose\u003cspan class=\"gloss\">鼻子\u003c/span>\u003c/span>.\u003c/p>\u003cp>At the end of the party, Sam thanked all his friends for coming. \"Sharing this day with you made it extra special,\" he said.\u003c/p>", "words": ["spring", "winter", "cold", "wear", "T-shirt", "scarf", "rainy", "hear", "taste", "nose"]}}, {"id": "R_L3_U01", "material": "Reach Higher", "level": "3", "no": 1, "title": "Unit 1 · I Like It Here", "low": true, "words": [{"en": "library", "say": "library", "key": "library", "zh": "图书馆", "emoji": "📚", "pattern": "Where do you live?-I live in a/an___.", "sources": ["Lesson 1-16（话题课）", "Lesson 19-20（口语训练课）"], "task": "观察图片，用动作或中文解释“图书馆”，再跟读英文。", "visual": "词义图标场景"}, {"en": "bakery", "say": "bakery", "key": "bakery", "zh": "面包店", "emoji": "🥐", "pattern": "Where do you live?-I live in a/an___.", "sources": ["Lesson 1-16（话题课）", 你看到了什么？”，孩子指图即可。", "共读：先听一遍，再逐句模仿；选 3 张词卡做动作或摆放位置，不要求家长即兴说英语。", "复述：画“开始—中间—最后”三格，指着画说关键词；愿意的话再说完整句。"], "original": {"title": "Unit 2 · Jobs People Do", "context": "Reach Higher Level 3 · Unit 2 · Jobs People Do", "theme": {"key": "birthday", "title_cn": "生日派对", "title_en": "The Birthday Party", "subject": "Sam", "opening": "\u003cp>Today was \u003cb>Sam\u003c/b>'s birthday! Balloons filled the living room, and all his friends were coming over for a party.\u003c/p>", "closing": "\u003cp>At the end of the party, Sam thanked all his friends for coming. \"Sharing this day with you made it extra special,\" he said.\u003c/p>", "moral": "和朋友、家人一起分享快乐时光，会让美好的回忆更加珍贵。"}, "bodyHtml": "\u003cp>Today was \u003cb>Sam\u003c/b>'s birthday! Balloons filled the living room, and all his friends were coming over for a party.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">doctor\u003cspan class=\"gloss\">医生\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Sam found a \u003cspan class=\"story-hl\">teacher\u003cspan class=\"gloss\">老师\u003c/span>\u003c/span>. There, Sam noticed a \u003cspan class=\"story-hl\">hospital\u003cspan class=\"gloss\">医院\u003c/span>\u003c/span> nearby.\u003c/p>\u003cp>Sam picked up the \u003cspan class=\"story-hl\">driver\u003cspan class=\"gloss\">司机\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">firefighter\u003cspan class=\"gloss\">消防员\u003c/span>\u003c/span>!\" said Sam with a big smile. Sam carefully put the \u003cspan class=\"story-hl\">singer\u003cspan class=\"gloss\">歌手\u003c/span>\u003c/span> into a small bag.\u003c/p>\u003cp>Every morning, Sam liked to \u003cspan class=\"story-hl\">play\u003cspan class=\"gloss\">玩\u003c/span>\u003c/span>. Sam pointed at the \u003cspan class=\"story-hl\">hammer\u003cspan class=\"gloss\">锤子\u003c/span>\u003c/span> and asked lots of questions. With a big smile, Sam began to \u003cspan class=\"story-hl\">eat\u003cspan class=\"gloss\">吃\u003c/span>\u003c/span>. al celebration, and her cousin explains a game."}, {"q": "What action, observation or decision moves the story forward?", "a": "The extended family helps prepare the food and clean up afterwards."}, {"q": "What can you conclude? Which part is evidence, and which part is your interpretation?", "a": "参考结尾：Maya learns that caring can be shown through small actions. 先引用原文，再解释自己的推断。开放题允许不同答案。"}]}, "extensions": ["采访一位家人，写出一项家庭活动及你能承担的工作。区分 family member 与 extended family。", "词汇迁移：从本 Unit 选 5 个词，写一段与“My Family”有关的新情境；不用逐词硬塞，优先保证意思连贯。", "表达支架：I think ... because ... / The story shows ... / Another possibility is ...", "写作建议：先用 4–6 句表达清楚；高 Level 可扩为 80–120 词，增加证据、不同观点或局限。Level 是教材内等级，各教材不直接等同。"], "original": {"title": "Unit 1 · My Family", "context": "Reach Higher Level 4 · Unit 1 · My Family", "theme": {"key": "sea", "title_cn": "海底世界", "title_en": "Under the Sea", "subject": "Emma", "opening": "\u003cp>Deep under the blue ocean, \u003cb>Emma\u003c/b> the little mermaid swam past colorful coral reefs, looking for her next adventure.\u003c/p>", "closing": "\u003cp>As the sun set over the water, Emma waved goodbye to her new friends. \"I can't wait to come back tomorrow!\" she said happily.\u003c/p>", "moral": "大海里藏着许多惊喜——就像学习新单词一样，每一次探索都会带来新的发现。"}, "bodyHtml": "\u003cp>Deep under the blue ocean, \u003cb>Emma\u003c/b> the little mermaid swam past colorful coral reefs, looking for her next adventure.\u003c/p>\u003cp>There, Emma noticed a \u003cspan class=\"story-hl\">family member\u003cspan class=\"gloss\">家庭成员\u003c/span>\u003c/span> nearby. Emma picked up the \u003cspan class=\"story-hl\">meal\u003cspan class=\"gloss\">一餐\u003c/span>\u003c/span> and smiled. With a big smile, Emma began to \u003cspan class=\"story-hl\">help\u003cspan class=\"gloss\">帮助\u003c/span>\u003c/span>.\u003c/p>\u003cp>Emma carefully put the \u003cspan class=\"story-hl\">world\u003cspan class=\"gloss\">世界\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">special\u003cs ry", "text": "Maya observes a nest from a safe distance. First, she sees eggs; later, the eggs hatch. The baby birds change in size and grow feathers before they leave. Her diary records what happened before and after each change. Watching patiently helps her understand a life cycle.", "used": ["baby", "nest", "hatch", "grow", "before", "size", "change"], "remaining": ["adult", "egg", "form", "inside", "shape", "time", "insect", "caterpillar", "butterfly", "chrysalis", "pupa"], "guide": "本篇围绕“Growing and Changing”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "What is the main topic? Name one detail that supports your answer.", "a": "Topic: Growing and Changing. A supporting detail: First, she sees eggs; later, the eggs hatch."}, {"q": "What action, observation or decision moves the story forward?", "a": "The baby birds change in size and grow feathers before they leave."}, {"q": "What can you conclude? Which part is evidence, and which part is your interpretation?", "a": "参考结尾：Watching patiently helps her understand a life cycle. 先引用原文，再解释自己的推断。开放题允许不同答案。"}]}, "extensions": ["画 egg → hatch → baby → adult 的阶段图。用 first / next / then / finally 复述，说明阶段变化与单纯长大的区别。", "词汇迁移：从本 Unit 选 5 个词，写一段与“Growing and Changing”有关的新情境；不用逐词硬塞，优先保证意思连贯。", "表达支架：I think ... because ... / The story shows ... / Another possibility is ...", "写作建议：先用 4–6 句表达清楚；高 Level 可扩为 80–120 词，增加证据、不同观点或局限。Level 是教材内等级，各教材不直接等同。"], "original": {"title": "Unit 4 · Growing and Changing", "context": "Reach Higher Level 4 · Unit 4 · Growing and Changing", "theme": {"key": "garden", "title_cn": "魔法花园", "title_en": "The Magic Garden", "subject": "Lily", "opening": "\u003cp>\u003cb>Lily\u003c/b> opened the little wooden gate and stepped into her grandmother's magic garden, where anything seemed possible.\u003c/p>", "closing": "\u003cp>When it was time to go home, Lily looked back at the garden one more time. \"I'll take good care of everything here,\" she promised.\u003c/p>", "moral": "用心照顾身边的小事物，就像用心记住每一个新单词一样，慢慢就会开花结果。"}, "bodyHtml": "\u003cp>\u003cb>Lily\u003c/b> opened the little wooden gate and stepped into her grandmother's magic garden, where anything seemed possible.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">baby\u003cspan class=\"gloss\">婴儿\u003c/span>\u003c/span>!\" said Lily with a big smile. Lily carefully put the \u003cspan class=\"story-hl\">adult\u003cspan class=\"gloss\">成年人\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">nest\u003cspan class=\"gloss\">鸟巢\u003c/span>\u003c/span> appeared, and Lily could not stop smiling.\u003c/p>\u003cp>Lily pointed at the \u003cspan class=\"story-hl\">hatch\u003cspan class=\"gloss\">孵化\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">before\u003cspan class=\"gloss\">在……之前\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Lily found a \u003cspan class=\"story-hl\">shape\u003cspan class=\"gloss\">形状\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Lily noticed a \u003cspan class=\"story-hl\">size\u003cspan class=\"gloss\">大小\u003c/span>\u003c/span> nearby. Lily picked up the \u003cspan class=\"story-hl\">insect\u003cspan class=\"gloss\">昆虫\u003c/span>\u003c/span> and smiled. \"Look, a \u003cspan class=\"story-hl\">caterpillar\u003cspan class=\"gloss\">毛毛虫\u003c/span>\u003c/span>!\" said Lily with a big smile.\u003c/p>\u003cp>Lily carefully put the \u003cspan class=\"story-hl\">chrysalis\u003cspan class=\"gloss\">蛹\u003c/span>\u003c/span> into a small bag.\u003c/p>\u003cp>When it was time to go home, Lily looked back at the garden one more time. \"I'll take good care of everything here,\" she promised.\u003c/p>", "words": ["baby", "adult", "nest", "hatch", "before", "shape", "size", "insect", "caterpillar", "chrysalis"]}}, {"id": "R_L4_U05", "material": "Reach Higher", "level": "4", "no": 5, "title": "Unit 5 · Creature Features", "low": false, "words": [{" es”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "What is the main topic? Name one detail that supports your answer.", "a": "Topic: Creature Features. A supporting detail: Feathers, scales and fur cover their bodies in different ways."}, {"q": "What action, observation or decision moves the story forward?", "a": "A beak and a mouth also work differently."}, {"q": "What can you conclude? Which part is evidence, and which part is your interpretation?", "a": "参考结尾：The children explain what is alike and what is different, using evidence from pictures. 先引用原文，再解释自己的推断。开放题允许不同答案。"}]}, "extensions": ["做 beak / feathers / scales / fur 对比表；选两个动物，用 alike 与 different 写 4 句。", "词汇迁移：从本 Unit 选 5 个词，写一段与“Creature Features”有关的新情境；不用逐词硬塞，优先保证意思连贯。", "表达支架：I think ... because ... / The story shows ... / Another possibility is ...", "写作建议：先用 4–6 句表达清楚；高 Level 可扩为 80–120 词，增加证据、不同观点或局限。Level 是教材内等级，各教材不直接等同。"], "original": {"title": "Unit 5 · Creature Features", "context": "Reach Higher Level 4 · Unit 5 · Creature Features", "theme": {"key": "garden", "title_cn": "魔法花园", "title_en": "The Magic Garden", "subject": "Lily", "opening": "\u003cp>\u003cb>Lily\u003c/b> opened the little wooden gate and stepped into her grandmother's magic garden, where anything seemed possible.\u003c/p>", "closing": "\u003cp>When it was time to go home, Lily looked back at the garden one more time. \"I'll take good care of everything here,\" she promised.\u003c/p>", "moral": "用心照顾身边的小事物，就像用心记住每一个新单词一样，慢慢就会开花结果。"}, "bodyHtml": "\u003cp>\u003cb>Lily\u003c/b> opened the little wooden gate and stepped into her grandmother's magic garden, where anything seemed possible.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">beak\u003cspan class=\"gloss\">鸟喙\u003c/span>\u003c/span>!\" said Lily with a big smile. Lily carefully put the \u003cspan class=\"story-hl\">scales\u003cspan class=\"gloss\">鳞片\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">fur\u003cspan class=\"gloss\">毛皮\u003c/span>\u003c/span> appeared, and Lily could not stop smiling.\u003c/p>\u003cp>Lily pointed at the \u003cspan class=\"story-hl\">alligator\u003cspan class=\"gloss\">短吻鳄\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">different\u003cspan class=\"gloss\">不同的\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Lily found a \u003cspan class=\"story-hl\">feature\u003cspan class=\"gloss\">特征\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Lily noticed a \u003cspan class=\"story-hl\">slide\u003cspan class=\"gloss\">滑梯\u003c/span>\u003c/span> nearby. Every morning, Lily liked to \u003cspan class=\"story-hl\">climb\u003cspan class=\"gloss\">爬\u003c/span>\u003c/span>. \"Look, a \u003cspan class=\"story-hl\">back\u003cspan class=\"gloss\">背部\u003c/span>\u003c/span>!\" said Lily with a big smile.\u003c/p>\u003cp>Lily carefully put the \u003cspan class=\"story-hl\">front\u003cspan class=\"gloss\">前面\u003c/span>\u003c/span> into a small bag.\u003c/p>\u003cp>When it was time to go home, Lily looked back at the garden one more time. \"I'll take good care of everything here,\" she promised.\u003c/p>", "words": ["beak", "scales", "fur", "alligator", "different", "feature", "slide", "climb", "back", "front"]}}, {"id": "R_L4_U06", "material": "Reach Higher", "level": "4", "no": 6, "title": "Unit 6 · Up in the Air", "low": false, "words": [{"en": "storm", "say": "storm", "key": "storm", "zh": "暴风雨", "emoji": "⛈️", "pattern": "I can ___ on a windy day. / I like ___ weather because I can ___. / Wind can blow ___. / Wind makes me feel ___. 等", "sources": ["Lesson 1（话题课1（第1循环））", "Lesson 2（话题课2（第1循环））", "Lesson 3（话题课3（第1循环））", "Lesson 4（话题课4（第2循环））", "Lesson 5（话题课5（第2循环））", "Lesson 6（话题课6（第2循环））", "Lesson 7（写作训练课）"], "task": "解释“暴风雨”与单元主题的联系，用 storm 口述或写一句自己的表达。", "visual": "天气变化"}, {"en": "weather", "say": "weather", "key": "weather", "zh": "天气", "emoji": "⛅", "p iced a \u003cspan class=\"story-hl\">television\u003cspan class=\"gloss\">电视\u003c/span>\u003c/span> nearby. Lily decided to \u003cspan class=\"story-hl\">build\u003cspan class=\"gloss\">建造\u003c/span>\u003c/span>. \"Look, a \u003cspan class=\"story-hl\">invent\u003cspan class=\"gloss\">发明\u003c/span>\u003c/span>!\" said Lily with a big smile.\u003c/p>\u003cp>Lily felt very \u003cspan class=\"story-hl\">modern\u003cspan class=\"gloss\">现代的\u003c/span>\u003c/span> at that moment.\u003c/p>\u003cp>When it was time to go home, Lily looked back at the garden one more time. \"I'll take good care of everything here,\" she promised.\u003c/p>", "words": ["computer", "internet", "communicate", "history", "present", "radio", "television", "build", "invent", "modern"]}}, {"id": "R_L4_U08", "material": "Reach Higher", "level": "4", "no": 8, "title": "Unit 8 · Get Out the Map", "low": false, "words": [{"en": "map", "say": "map", "key": "map", "zh": "地图", "emoji": "🗺️", "pattern": "We can use a/an ___ map to ___. / The symbol of the ___ stands for ___. / First, ___. / There, he ___. 等", "sources": ["Lesson 1（话题课1（第1循环））", "Lesson 2（话题课2（第1循环））", "Lesson 3（话题课3（第1循环））", "Lesson 4（话题课4（第2循环））", "Lesson 5（话题课5（第2循环））", "Lesson 6（话题课6（第2循环））", "Lesson 7（写作训练课）"], "task": "解释“地图”与单元主题的联系，用 map 口述或写一句自己的表达。", "visual": "路线示意"}, {"en": "key", "say": "key", "key": "key", "zh": "钥匙", "emoji": "🔑", "pattern": "We can use a/an ___ map to ___. / The symbol of the ___ stands for ___. / First, ___. / There, he ___. 等", "sources": ["Lesson 1（话题课1（第1循环））", "Lesson 2（话题课2（第1循环））", "Lesson 3（话题课3（第1循环））", "Lesson 4（话题课4（第2循环））", "Lesson 5（话题课5（第2循环））", "Lesson 6（话题课6（第2循环））", "Lesson 7（写作训练课）"], "task": "解释“钥匙”与单元主题的联系，用 key 口述或写一句自己的表达。", "visual": "词义图标场景"}, {"en": "useful", "say": "useful", "key": "useful", "zh": "有用的", "emoji": "", "pattern": "We can use a/an ___ map to ___. / The symbol of the ___ stands for ___. / First, ___. / There, he ___. 等", "sources": ["Lesson 1（话题课1（第1循环））", "Lesson 2（ ", "predators"], "remaining": ["defend", "safe", "absorb", "aid", "food", "water", "shelter", "feature", "prey", "attack", "attract", "message", "recognize", "seem"], "guide": "本篇围绕“Staying Alive”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "What is the main topic? Name one detail that supports your answer.", "a": "Topic: Staying Alive. A supporting detail: The children first struggle to find it in a picture."}, {"q": "What action, observation or decision moves the story forward?", "a": "They learn that this adaptation can help it hide from predators and survive."}, {"q": "What can you conclude? Which part is evidence, and which part is your interpretation?", "a": "参考结尾：They use observations to explain why shape, color and size may matter. 先引用原文，再解释自己的推断。开放题允许不同答案。"}]}, "extensions": ["选一种动物，按 trait → function → survival 写 3 句；不用“所有动物都一样”的概括。", "词汇迁移：从本 Unit 选 5 个词，写一段与“Staying Alive”有关的新情境；不用逐词硬塞，优先保证意思连贯。", "表达支架：I think ... because ... / The story shows ... / Another possibility is ...", "写作建议：先用 4–6 句表达清楚；高 Level 可扩为 80–120 词，增加证据、不同观点或局限。Level 是教材内等级，各教材不直接等同。"], "original": {"title": "Unit 2 · Staying Alive", "context": "Reach Higher Level 5 · Unit 2 · Staying Alive", "theme": {"key": "birthday", "title_cn": "生日派对", "title_en": "The Birthday Party", "subject": "Sam", "opening": "\u003cp>Today was \u003cb>Sam\u003c/b>'s birthday! Balloons filled the living room, and all his friends were coming over for a party.\u003c/p>", "closing": "\u003cp>At the end of the party, Sam thanked all his friends for coming. \"Sharing this day with you made it extra special,\" he said.\u003c/p>", "moral": "和朋友、家人一起分享快乐时光，会让美好的回忆更加珍贵。"}, "bodyHtml": "\u003cp>Today was \u003cb>Sam\u003c/b>'s birthday! Balloons filled the living room, and all his friends were coming over for a party.\u003c/p>\u003cp>Not far away, there was a \u003cspan class=\"story-hl\">shape\u003cspan class=\"gloss\">形状\u003c/span>\u003c/span> waiting to be d oves the story forward?", "a": "Lava cools into rock, and repeated eruptions can help form an island."}, {"q": "What can you conclude? Which part is evidence, and which part is your interpretation?", "a": "参考结尾：Their diagram distinguishes observations from explanations about pressure and force. 先引用原文，再解释自己的推断。开放题允许不同答案。"}]}, "extensions": ["为 volcano 画内部与外部标签，区分 magma 和 lava；用因果连词解释形成过程。", "词汇迁移：从本 Unit 选 5 个词，写一段与“Blast! Crash! Splash!”有关的新情境；不用逐词硬塞，优先保证意思连贯。", "表达支架：I think ... because ... / The story shows ... / Another possibility is ...", "写作建议：先用 4–6 句表达清楚；高 Level 可扩为 80–120 词，增加证据、不同观点或局限。Level 是教材内等级，各教材不直接等同。"], "original": {"title": "Unit 7 · Blast! Crash! Splash!", "context": "Reach Higher Level 6 · Unit 7 · Blast! Crash! Splash!", "theme": {"key": "forest", "title_cn": "森林探险", "title_en": "The Forest Adventure", "subject": "Mia", "opening": "\u003cp>One sunny morning, \u003cb>Mia\u003c/b> and her little fox friend walked into the big green forest. Birds were singing, and the leaves danced in the wind.\u003c/p>", "closing": "\u003cp>By the time the sun went down, Mia had learned so much. \"What a wonderful day,\" she said with a big smile, and they walked home together, hand in hand.\u003c/p>", "moral": "和朋友一起探索新事物，会让学习变得更快乐——鼓励孩子像Mia一样，勇敢又好奇地认识世界。"}, "bodyHtml": "\u003cp>One sunny morning, \u003cb>Mia\u003c/b> and her little fox friend walked into the big green forest. Birds were singing, and the leaves danced in the wind.\u003c/p>\u003cp>Suddenly, Mia found a \u003cspan class=\"story-hl\">volcano\u003cspan class=\"gloss\">火山\u003c/span>\u003c/span>. There, Mia noticed a \u003cspan class=\"story-hl\">magma\u003cspan class=\"gloss\">岩浆\u003c/span>\u003c/span> nearby. Mia picked up the \u003cspan class=\"story-hl\">lava\u003cspan class=\"gloss\">熔岩\u003c/span>\u003c/span> and smiled.\u003c/p>\u003cp>\"Look, a \u003cspan class=\"story-hl\">ocean\u003cspan class=\"gloss\">海洋\u003c/span>\u003c/span>!\" said Mia with a big smile. Mia carefully put the \u003cspan class=\"story-hl\">develop\u003cspan class=\"gloss\">发展\u003c/span>\u003c/span> into a small bag. A friendly \u003cspan class=\"story-hl\">pressure\u003cspan class=\"gloss\">压力\u003c/span>\u003c/span> appeared, and Mia could not stop smiling.\u003c/p>\u003cp>Mia pointed at the \u003cspan class=\"story-hl\">earthquake\u003cspan class=\"gloss\">地震\u003c/span>\u003c/span> and asked lots of questions. Not far away, there was a \u003cspan class=\"story-hl\">tsunami\u003cspan class=\"gloss\">海啸\u003c/span>\u003c/span> waiting to be discovered. Suddenly, Mia found a \u003cspan class=\"story-hl\">sense\u003cspan class=\"gloss\">感觉\u003c/span>\u003c/span>.\u003c/p>\u003cp>There, Mia noticed a \u003cspan class=\"story-hl\">power\u003cspan class=\"gloss\">力量/电力\u003c/span>\u003c/span> nearby.\u003c/p>\u003cp>By the time the sun went down, Mia had learned so much. \"What a wonderful day,\" she said with a big smile, and they walked home together, hand in hand.\u003c/p>", "words": ["volcano", "magma", "lava", "ocean", "develop", "pressure", "earthquake", "tsunami", "sense", "power"]}}, {"id": "R_L6_U08", "material": "Reach Higher", "level": "6", "no": 8, "title": "Unit 8 · Getting There", "low": false, "words": [{"en": "distance", "say": "distance", "key": "distance", "zh": "距离", "emoji": "", "pattern": "Do you know ___? / Should I ___? / You should/should not ___. / First, ___ Next, ___ Then, ___, In the end, ___. / I want to/will/plan to/am going to ___.", "sources": ["Lesson 1（话题课1（第1循环））", "Lesson 2（话题课2（第1循环））", "Lesson 3（话题课3（第1循环））", "Lesson 4（话题课4（第2循环））", "Lesson 5（话题课5（第2循环））", "Lesson 6（话题课6（第2循环））", "Lesson 7（写作训练课）"], "task": "解释“距离”与单元主题的联系，用 distance 口述或写一句自己的表达。", "visual": "路线示意"}, {"en": "feet", "say": "feet", "key": "feet", "zh": "脚", "emoji": "🦶", "pattern": "Do you know ___? / Should I ___? / You should/should not ___. / First, ___ Next, ___ Then, ___, In the end, ___. / I want to/will/plan to/am going to ___.", "sources": ["Lesson 1（话题课1（第1循环））", "Lesson ion", "strategy"], "remaining": ["feet", "kilometer", "measurement", "meter", "unit", "achieve", "estimate", "continent", "destination", "globe", "journey", "location", "explore", "discover", "prepare", "challenge", "endurance"], "guide": "本篇围绕“Getting There”展开。先看词卡里的实物、动作或概念，再听故事；通过人物遇到的情况、采取的行动和结尾练习理解与复述。故事中高亮的是出现的单元词，其余词在下方列出，便于继续编写。", "questions": [{"q": "What is the main topic? Name one detail that supports your answer.", "a": "Topic: Getting There. A supporting detail: Their first strategy takes too long, so they compare another direction."}, {"q": "What action, observation or decision moves the story forward?", "a": "They check the units before calculating."}, {"q": "What can you conclude? Which part is evidence, and which part is your interpretation?", "a": "参考结尾：Reaching a goal requires both a useful plan and measurements that make sense. 先引用原文，再解释自己的推断。开放题允许不同答案。"}]}, "extensions": ["估算并测量一条室内路线；统一 meter / kilometer 单位，比较 estimate 与 measurement。", "词汇迁移：从本 Unit 选 5 个词，写一段与“Getting There”有关的新情境；不用逐词硬塞，优先保证意思连贯。", "表达支架：I think ... because ... / The story shows ... / Another possibility is ...", "写作建议：先用 4–6 句表达清楚；高 Level 可扩为 80–120 词，增加证据、不同观点或局限。Level 是教材内等级，各教材不直接等同。"], "original": {"title": "Unit 8 · Getting There", "context": "Reach Higher Level 6 · Unit 8 · Getting There", "theme": {"key": "zoo", "title_cn": "动物园惊喜", "title_en": "A Surprise at the Zoo", "subject": "Zoe", "opening": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>", "closing": "\u003cp>Before leaving, Zoe bought a postcard to remember her favorite animal from the day. \"This was the best day ever!\" she said.\u003c/p>", "moral": "保护动物、爱护自然，是每个小朋友都可以从小做起的事情。"}, "bodyHtml": "\u003cp>\u003cb>Zoe\u003c/b> and her family arrived at the zoo early in the morning, excited to see all kinds of amazing animals.\u003c/p>\u003cp>Zoe pointed at the \u003cspan class=\"story-hl\">distance\u003cspan class=\"gloss\ else if(CONCEPTS[k]){let c=CONCEPTS[k];a=c.icons.map((icon,i)=>`<rect x="${6+i*65}" y="46" width="59" height="83" rx="10" fill="white" stroke="#D0DAEB"/><text x="${35+i*65}" y="87" text-anchor="middle" font-size="30">${esc(icon)}</text><text x="${35+i*65}" y="113" text-anchor="middle" font-size="8" fill="#40516A">${esc(c.labels[i])}</text>`).join('');a+='<path d="M62 35h72m-8-6l8 6-8 6" stroke="#B2A0D0" stroke-width="3" fill="none"/>';kind='词义情境分镜';motion='pulse'}
else if(e){a=`<path d="M20 148q75-25 160 0v25H20" fill="#DDEDDC"/><text x="100" y="116" font-size="78" text-anchor="middle">${esc(e)}</text>`;kind='词义图标场景';motion=/fish|dolphin|whale|boat|shark|seal|octopus/.test(k)?'travel':/bird|parrot|plane|rocket|butterfly/.test(k)?'sway':/food|bread|milk|cake|apple|banana/.test(k)?'none':'float'}
else{a=`<rect x="18" y="41" width="164" height="103" rx="18" fill="#fff" stroke="#B8C8E7" stroke-width="3"/><circle cx="50" cy="77" r="14" fill="#EAB783"/><path d="M75 77h91m-118 31h118" stroke="#9CB2D4" stroke-width="5"/><text x="100" y="132" text-anchor="middle" font-size="13" fill="#40516A">${esc(z)}</text>`;kind='词义关系图';motion='pulse'}
return `<svg class="scene" viewBox="0 0 200 180" role="img" aria-label="${esc(w.en+'：'+z+'；'+kind)}"><rect width="200" height="180" rx="22" fill="#F1F6FC"/><g class="${motion}">${a}</g></svg>`}
function mark(t,words){let safe=esc(t);const ks=[...new Set(words.map(x=>x.key).filter(x=>/^[a-z][a-z\s'-]*$/i.test(x)))].sort((a,b)=>b.length-a.length);if(!ks.length)return safe;return safe.replace(new RegExp('\\b('+ks.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi'),'<mark>$1</mark>')}
function card(w,i,low){return `<article class="card"><div class="card-top"><span>${String(i+1).padStart(2,'0')}</span><button class="sound" data-say="${esc(w.say)}" aria-label="朗读 ${esc(w.say)}">♪</button></div>${svg(w)}<h3>${esc(w.en)}</h3><p class="meaning">${esc(w.zh)}</p>${w.pattern?`<p class="example"><b>课中句型</b>${esc(w.pattern)}</p>`:''}<p class="task"><b>${low?'玩一玩':'表达挑战'}</b>${esc(w.task)}</p><details><summary>查看来源</summary>${w.sources.map(esc).join('<br>')}<br>图像：${esc(w.visual)}</details></article>`}
function story(u){return `<section class="story"><div class="story-heading"><span>THE READING CORNER</span><button data-say="${esc(u.story.text)}">♪ 朗读故事</button></div><h2>${esc(u.story.title)}</h2><p class="small">单元主题补充故事 · 编写内容，非教材原文 · ${u.story.text.split(/\s+/).length} words</p>${u.story.text.split('\n').map(p=>`<p class="reading">${mark(p,u.words)}</p>`).join('')}<div class="coach"><b>中文导读</b><p>${esc(u.story.guide)}</p></div><h3>读后说一说</h3>${u.story.questions.map((q,i)=>`<p>${i+1}. ${esc(q.q)}</p><details><summary>参考回应</summary>${esc(q.a)}</details>`).join('')}<div class="extension"><h3>${u.low?'亲子小任务':'阅读与表达延伸'}</h3>${u.extensions.map(x=>`<p>${esc(x)}</p>`).join('')}</div><details class="source-story"><summary>原 HTML 生成的小故事（保留原文）</summary><p class="small">原程序随机选择主题、词性句框；最多抽取 10 个词。部分表达可能不自然，建议仅用于核对。</p><h3>${esc(u.original?.theme.title_en||'无故事')}</h3>${u.original?.bodyHtml||''}<p>原故事选词：${u.original?.words.map(esc).join(' · ')||''}</p></details><div class="coverage"><b>故事中的单元词：</b>${u.story.used.map(esc).join(' · ')||'见主题与读后任务'}<br><b>其余词汇：</b>${u.story.remaining.map(esc).join(' · ')||'已全部覆盖'}<p>故事优先保证连贯；全部词汇均已在词卡中保留。任选 3 个剩余词，补写一句或补画一幕。</p></div></section>`}
function unitHTML(u,type='all'){return `<section class="unit" id="${u.id}"><header class="unit-head"><span>${esc(u.material)} / LEVEL ${u.level} / UNIT ${u.no}</span><h1>${esc(u.title)}</h1><p>${u.words.length} 条词汇 · ${u.low?'看图 · 做动作 · 亲子共读':'观察 · 推理 · 表达'}</p><div class="actions"><button data-export="${u.id}" data-kind="cards">下载本 Unit 词卡</button><button data-export="${u.id}" data-kind="story">下载本 Unit 故事</button></div></header>${type!=='story'?`<div class="cards">${u.words.map((w,i)=>card(w,i,u.low)).join('')}</div>`:''}${type!=='cards'?story(u):''}</section>`}
function render(){const q=($('#search')?.value||'').toLowerCase(),m=$('#material')?.value||'',l=$('#level')?.value||'';const rows=DATA.filter(u=>(!m||u.material===m)&&(!l||u.level===l)&&(!q||JSON.stringify([u.title,u.words.map(w=>[w.en,w.zh])]).toLowerCase().includes(q)));$('#content').innerHTML=rows.map(u=>unitHTML(u,TYPE)).join('')||'<p>未找到对应单元，请调整条件。</p>';$('#count').textContent=`${rows.length} 个 Unit · ${rows.reduce((n,u)=>n+u.words.length,0)} 条单元词汇`}
function exportUnit(u,type){let h=document.documentElement.cloneNode(true);h.querySelector('#content').innerHTML=unitHTML(u,type);h.querySelector('#dataset').textContent=JSON.stringify([u]).replace(/</g,'\\u003c');h.querySelector('#type').textContent=JSON.stringify(type);let blob=new Blob(['<!doctype html>'+h.outerHTML],{type:'text/html;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${u.id}_${type}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const DATA=JSON.parse($('#dataset').textContent),TYPE=JSON.parse($('#type').textContent);
$('#material').innerHTML='<option value="">全部教材</option>'+[...new Set(DATA.map(u=>u.material))].map(m=>`<option>${esc(m)}</option>`).join('');
function levels(){let m=$('#material').value;$('#level').innerHTML='<option value="">全部 Level</option>'+[...new Set(DATA.filter(u=>!m||u.material===m).map(u=>u.level))].sort((a,b)=>+a-+b).map(l=>`<option value="${l}">Level ${l}</option>`).join('')}
levels();render();$('#material').onchange=()=>{levels();render()};$('#level').onchange=render;$('#search').oninput=()=>{clearTimeout(window.searchTimer);window.searchTimer=setTimeout(render,180)};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.say)speak(b.dataset.say);if(b.dataset.export)exportUnit(DATA.find(u=>u.id===b.dataset.export),b.dataset.kind);if(b.id==='pause'){document.body.classList.toggle('paused');b.textContent=document.body.classList.contains('paused')?'继续动画':'暂停动画'}if(b.id==='print')window.print()});
</script></body></html>
